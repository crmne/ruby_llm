                  "text": "My favorite Ruby feature is **blocks with iterators**\u2014especially how naturally they let you inject behavior into methods.\n\nFor example, `map`, `select`, `each`, and friends make it feel like you\u2019re defining *what* you want done rather than *how* to loop:\n\n```ruby\nnums = [1, 2, 3, 4]\nsquares = nums.map { |n| n * n }\n```\n\nIt\u2019s concise, expressive, and shows off Ruby\u2019s \u201cmake the common case easy\u201d philosophy."
