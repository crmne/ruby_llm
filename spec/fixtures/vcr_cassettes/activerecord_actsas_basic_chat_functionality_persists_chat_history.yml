                  "text": "My favorite Ruby feature is **blocks + iterators** (and the whole `yield`/`Enumerable` vibe).\n\nRuby makes it feel natural to express \u201cdo this for each item\u201d or \u201cwrap this behavior around something\u201d:\n\n```ruby\n[1, 2, 3].map { |n| n * 2 }\n```\n\n\u2026and you can also write your own reusable control flow with blocks:\n\n```ruby\ndef with_logging\n  puts \"start\"\n  yield\n  puts \"done\"\nend\n```\n\nIt\u2019s small, expressive, and kind of the glue that makes Ruby feel Ruby."
