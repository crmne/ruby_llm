        Lisp, and Python, aiming to create a language that was **programmer-friendly**,
        **productive**, and emphasized **simplicity** and **beauty**.\n\nMatz has
        often stated that he wanted Ruby to make programmers happy and to feel enjoyable
        while coding — a philosophy that has influenced the language''s design and
