              "name": "microsoft_docs_search",
              "output": "{\"results\": [{\"title\": \"Azure Storage Blobs client library for .NET - version 12.30.1\", \"content\": \"# Azure Storage Blobs client library for .NET - version 12.30.1\\n\\nServer Version: 2021-02-12, 2020-12-06, 2020-10-02, 2020-08-04, 2020-06-12, 2020-04-08, 2020-02-10, 2019-12-12, 2019-07-07, and 2019-02-02\\n\\nAzure Blob storage is Microsoft's object storage solution for the cloud. Blob storage is optimized for storing massive amounts of unstructured data. Unstructured data is data that does not adhere to a particular data model or definition, such as text or binary data.\\n[Source code](https://github.com/Azure/azure-sdk-for-net/tree/Azure.Storage.Blobs_12.30.1/sdk/storage/Azure.Storage.Blobs/src) | [Package (NuGet)](https://www.nuget.org/packages/Azure.Storage.Blobs/) | [API reference documentation](https://learn.microsoft.com/en-us/dotnet/api/azure.storage.blobs) | [REST API documentation](https://learn.microsoft.com/en-us/rest/api/storageservices/blob-service-rest-api) | [Product documentation](https://learn.microsoft.com/en-us/azure/storage/blobs/storage-blobs-overview)\", \"contentUrl\": \"https://learn.microsoft.com/dotnet/api/overview/azure/storage.blobs-readme?view=azure-dotnet\"}, {\"title\": \"Monitor Azure Blob Storage\", \"content\": \"# Monitor Azure Blob Storage\\n## Analyze monitoring data\\n### **.NET**\\nAzure Monitor provides the [.NET SDK](https://www.nuget.org/packages/Microsoft.Azure.Management.Monitor/) to read metric definitions and values.\\nIn these examples, replace the `<resource-ID>` placeholder with the resource ID of the entire storage account or the Blob storage service. You can find these resource IDs on the **Endpoints** pages of your storage account in the Azure portal.\\nReplace the `<subscription-ID>` variable with the ID of your subscription. For guidance on how to obtain values for `<tenant-ID>`, `<application-ID>`, and `<AccessKey>`, see [Use the portal to create a Microsoft Entra application and service principal that can access resources](https://learn.microsoft.com/azure/active-directory/develop/howto-create-service-principal-portal).\\n#### List the account-level metric definition\\nThe following example shows how to list a metric definition at the account level:\\n#### Read account-level metric values\\nThe following example shows how to read `UsedCapacity` data at the account level:\\n#### Read multidimensional metric values\\nFor multidimensional metrics, you need to define metadata filters if you want to read metric data on specific dimension values.\\nThe following example shows how to read metric data on the metric supporting multidimensional values:\\n### Analyze logs for Azure Blob Storage\\nYou can access resource logs either as a blob in a storage account, as event data, or through Log Analytics queries. For information about how to find those logs, see [Azure resource logs](https://learn.microsoft.com/en-us/azure/azure-monitor/essentials/resource-logs).\\nTo get the list of SMB and REST operations that are logged, see [Storage logged operations and status messages](https://learn.microsoft.com/en-us/rest/api/storageservices/storage-analytics-logged-operations-and-status-messages).\\nLog entries are created only if there are requests made against the service endpoint. For example, if a storage account has activity in its file endpoint but not in its table or queue endpoints, only logs that pertain to the Azure Blob Storage service are created. Azure Storage logs contain detailed information about successful and failed requests to a storage service. This information can be used to monitor individual requests and to diagnose issues with a storage service. Requests are logged on a best-effort basis.\\nWhen you view a storage account in the Azure portal, the operations called by the portal are also logged. For this reason, you may see operations logged in a storage account even though you haven't written any data to the account.\\n#### Log authenticated requests\", \"contentUrl\": \"https://learn.microsoft.com/azure/storage/blobs/monitor-blob-storage#analyze-monitoring-data\"}, {\"title\": \"Introduction to Azure Blob Storage\", \"content\": \"# Introduction to Azure Blob Storage\\nAzure Blob Storage is Microsoft's object storage solution for the cloud. Blob Storage is optimized for storing massive amounts of unstructured data. Unstructured data is data that doesn't adhere to a particular data model or definition, such as text or binary data.\\n## About Blob Storage\\nBlob Storage is designed for:\\n1. Serving images or documents directly to a browser.\\n2. Storing files for distributed access.\\n3. Streaming video and audio.\\n4. Writing to log files.\\n5. Storing data for backup and restore, disaster recovery, and archiving.\\n6. Storing data for analysis by an on-premises or Azure-hosted service.\\nUsers or client applications can access objects in Blob Storage via HTTP or HTTPS from anywhere in the world. You can access objects in Blob Storage through the [Azure Storage REST API](https://learn.microsoft.com/en-us/rest/api/storageservices/blob-service-rest-api), [Azure PowerShell](https://learn.microsoft.com/en-us/powershell/module/az.storage), [Azure CLI](https://learn.microsoft.com/en-us/cli/azure/storage), or an Azure Storage client library. Client libraries are available for different languages, including:\\n1. [.NET](https://learn.microsoft.com/en-us/dotnet/api/overview/azure/storage)\\n2. [Java](https://learn.microsoft.com/en-us/java/api/overview/azure/storage)\\n3. [Node.js](https://github.com/Azure/azure-sdk-for-js/tree/master/sdk/storage)\\n4. [Python](https://learn.microsoft.com/azure/storage/blobs/storage-quickstart-blobs-python)\\n5. [Go](https://github.com/Azure/azure-sdk-for-go/tree/main/sdk/storage/azblob)\\nClients can also securely connect to Blob Storage by using SSH File Transfer Protocol (SFTP) and mount Blob Storage containers by using the Network File System (NFS) 3.0 protocol.\\n## About Azure Data Lake Storage\\nBlob Storage supports Azure Data Lake Storage, Microsoft's enterprise big data analytics solution for the cloud. Azure Data Lake Storage offers a hierarchical file system as well as the advantages of Blob Storage, including:\\n1. Low-cost, tiered storage\\n2. High availability\\n3. Strong consistency\\n4. Disaster recovery capabilities\\nFor more information about Data Lake Storage, see [Introduction to Azure Data Lake Storage](https://learn.microsoft.com/azure/storage/blobs/data-lake-storage-introduction).\", \"contentUrl\": \"https://learn.microsoft.com/azure/storage/blobs/storage-blobs-introduction\"}, {\"title\": \"Get started with Azure Blob Storage and .NET\", \"content\": \"# Get started with Azure Blob Storage and .NET\\n## Build your app\\nAs you build apps to work with data resources in Azure Blob Storage, your code primarily interacts with three resource types: storage accounts, containers, and blobs. To learn more about these resource types, how they relate to one another, and how apps interact with resources, see [Understand how apps interact with Blob Storage data resources](https://learn.microsoft.com/azure/storage/blobs/storage-blob-object-model).\\nThe following guides show you how to access data and perform specific actions using the Azure Storage client library for .NET:\\n| Guide | Description| \\n|  --- | ---  |\\n| [Append data to blobs](https://learn.microsoft.com/azure/storage/blobs/storage-blob-append) | Learn how to create an append blob and then append data to that blob. |\\n| [Configure a retry policy](https://learn.microsoft.com/azure/storage/blobs/storage-retry-policy) | Implement retry policies for client operations. |\\n| [Copy blobs](https://learn.microsoft.com/azure/storage/blobs/storage-blob-copy) | Copy a blob from one location to another. |\\n| [Create a container](https://learn.microsoft.com/azure/storage/blobs/storage-blob-container-create) | Create containers. |\\n| [Create a user delegation SAS](https://learn.microsoft.com/azure/storage/blobs/storage-blob-user-delegation-sas-create-dotnet) | Create a user delegation SAS for a container or blob. |\\n| [Create and manage blob leases](https://learn.microsoft.com/azure/storage/blobs/storage-blob-lease) | Establish and manage a lock on a blob. |\\n| [Create and manage container leases](https://learn.microsoft.com/azure/storage/blobs/storage-blob-container-lease) | Establish and manage a lock on a container. |\\n| [Delete and restore blobs](https://learn.microsoft.com/azure/storage/blobs/storage-blob-delete) | Delete blobs, and if soft-delete is enabled, restore deleted blobs. |\\n| [Delete and restore containers](https://learn.microsoft.com/azure/storage/blobs/storage-blob-container-delete) | Delete containers, and if soft-delete is enabled, restore deleted containers. |\\n| [Download blobs](https://learn.microsoft.com/azure/storage/blobs/storage-blob-download) | Download blobs by using strings, streams, and file paths. |\\n| [Find blobs using tags](https://learn.microsoft.com/azure/storage/blobs/storage-blob-tags) | Set and retrieve tags, and use tags to find blobs. |\\n| [List blobs](https://learn.microsoft.com/azure/storage/blobs/storage-blobs-list) | List blobs in different ways. |\\n| [List containers](https://learn.microsoft.com/azure/storage/blobs/storage-blob-containers-list) | List containers in an account and the various options available to customize a listing. |\\n| [Manage properties and metadata](https://learn.microsoft.com/azure/storage/blobs/storage-blob-properties-metadata) | Get and set properties and metadata for blobs. |\\n| [Manage properties and metadata](https://learn.microsoft.com/azure/storage/blobs/storage-blob-container-properties-metadata) | Get and set properties and metadata for containers. |\\n| [Performance tuning for data transfers](https://learn.microsoft.com/azure/storage/blobs/storage-blobs-tune-upload-download) | Optimize performance for data transfer operations. |\\n| [Set or change a blob's access tier](https://learn.microsoft.com/azure/storage/blobs/storage-blob-use-access-tier-dotnet) | Set or change the access tier for a block blob. |\\n| [Upload blobs](https://learn.microsoft.com/azure/storage/blobs/storage-blob-upload) | Learn how to upload blobs by using strings, streams, file paths, and other methods. |\\n\", \"contentUrl\": \"https://learn.microsoft.com/azure/storage/blobs/storage-blob-dotnet-get-started#build-your-app\"}, {\"title\": \"Introduction to Azure Storage\", \"content\": \"# Introduction to Azure Storage\\n## Blob Storage\\nAzure Blob Storage is Microsoft's object storage solution for the cloud. Blob Storage is optimized for storing massive amounts of unstructured data, such as text or binary data.\\nBlob Storage is ideal for:\\n1. Serving images or documents directly to a browser.\\n2. Storing files for distributed access.\\n3. Streaming video and audio.\\n4. Storing data for backup and restore, disaster recovery, and archiving.\\n5. Storing data for analysis by an on-premises or Azure-hosted service.\\nYou can access objects in Blob Storage from anywhere in the world via HTTP or HTTPS. Users or client applications can access blobs via URLs, the [Azure Storage REST API](https://learn.microsoft.com/en-us/rest/api/storageservices/blob-service-rest-api), [Azure PowerShell](https://learn.microsoft.com/en-us/powershell/module/az.storage), [Azure CLI](https://learn.microsoft.com/en-us/cli/azure/storage), or an Azure Storage client library. The storage client libraries are available for multiple languages, including [.NET](https://learn.microsoft.com/en-us/dotnet/api/overview/azure/storage), [Java](https://learn.microsoft.com/en-us/java/api/overview/azure/storage), [Node.js](https://azure.github.io/azure-storage-node), and [Python](https://learn.microsoft.com/en-us/python/api/overview/azure/storage).\\nClients can also securely connect to Blob Storage by using SSH File Transfer Protocol (SFTP) and mount Blob Storage containers by using the Network File System (NFS) 3.0 protocol.\\nFor more information about Blob Storage, see [Introduction to Blob Storage](https://learn.microsoft.com/azure/storage/blobs/storage-blobs-introduction).\", \"contentUrl\": \"https://learn.microsoft.com/azure/storage/common/storage-introduction#blob-storage\"}, {\"title\": \"Introduction to Azure Blob Storage\", \"content\": \"# Introduction to Azure Blob Storage\\n## Blob Storage resources\\nBlob Storage offers three types of resources:\\n1. The **storage account**\\n2. A **container** in the storage account\\n3. A **blob** in a container\\nThe following diagram shows the relationship between these resources.\\n![Screenshot of the relationship between an Azure Blob Storage account, containers, and blobs.](https://learn.microsoft.com/azure/storage/blobs/media/storage-blobs-introduction/blob1.png)\\n### Storage accounts\\nA storage account provides a unique namespace in Azure for your data. Every object that you store in Azure Storage has an address that includes your unique account name. The combination of the account name and the Blob Storage endpoint forms the base address for the objects in your storage account.\\nFor example, if your storage account is named *mystorageaccount*, the default endpoint for Blob Storage is:\\n```\\nhttp://mystorageaccount.blob.core.windows.net\\n```\\nThe following table describes the different types of storage accounts that support Blob Storage:\\n| Type of storage account | Performance tier | Usage| \\n|  --- | --- | ---  |\\n| General-purpose v2 | Standard | Standard storage account type for blobs, file shares, queues, and tables. Recommended for most scenarios that use Blob Storage or one of the other Azure Storage services. |\\n| Block blob | Premium | Premium storage account type for block blobs and append blobs. Recommended for scenarios with high transaction rates or that use smaller objects or require consistently low storage latency. [Learn more about workloads for premium block blob accounts...](https://learn.microsoft.com/azure/storage/blobs/storage-blob-block-blob-premium) |\\n| Page blob | Premium | Premium storage account type for page blobs only. [Learn more about workloads for premium page blob accounts...](https://learn.microsoft.com/azure/storage/blobs/storage-blob-pageblob-overview) |\\n\\nTo learn more about types of storage accounts, see [Azure storage account overview](https://learn.microsoft.com/azure/storage/common/storage-account-overview?toc=/azure/storage/blobs/toc.json). For information about legacy storage account types, see [Legacy storage account types](https://learn.microsoft.com/azure/storage/common/storage-account-overview#legacy-storage-account-types).\\nTo learn how to create a storage account, see [Create a storage account](https://learn.microsoft.com/azure/storage/common/storage-account-create).\\n### Containers\\nA container organizes a set of blobs, similar to a directory in a file system. A storage account can include an unlimited number of containers, and a container can store an unlimited number of blobs.\", \"contentUrl\": \"https://learn.microsoft.com/azure/storage/blobs/storage-blobs-introduction#blob-storage-resources\"}, {\"title\": \"Reliability in Azure Blob Storage\", \"content\": \"# Reliability in Azure Blob Storage\\n[Azure Blob Storage](https://learn.microsoft.com/en-us/azure/storage/blobs/storage-blobs-overview) is an object storage solution for the cloud from Microsoft. It's designed to store massive amounts of unstructured data such as text, binary data, documents, media files, and application backups. As a foundational Azure storage service, Blob Storage provides multiple reliability features to ensure that your data remains available and durable during both planned and unplanned events.\\nWhen you use Azure, [reliability is a shared responsibility](https://learn.microsoft.com/en-us/azure/reliability/concept-shared-responsibility). Microsoft provides a range of capabilities to support resiliency and recovery. You're responsible for understanding how those capabilities work within all of the services you use, and selecting the capabilities you need to meet your business objectives and uptime goals.\\nThis article describes how to make Blob Storage resilient to a variety of potential outages and problems, including transient faults, availability zone outages, and region outages. It also describes how you can use backups to recover from other types of problems, and highlights some key information about the Blob Storage service level agreement (SLA).\\nNote\\nBlob Storage is part of the Azure Storage platform. Some of the capabilities of Blob Storage are common across many Azure Storage services. In this article, we use *Azure Storage* to refer to these features.\\n## Production deployment recommendations\\nTo learn about how to deploy Blob Storage to support your solution's reliability requirements, and how reliability affects other aspects of your architecture, see [Architecture best practices for Blob Storage](https://learn.microsoft.com/en-us/azure/well-architected/service-guides/azure-blob-storage) in the Azure Well-Architected Framework.\", \"contentUrl\": \"https://learn.microsoft.com/azure/reliability/reliability-storage-blob\"}, {\"title\": \"Get started with Azure Blob Storage and Go\", \"content\": \"# Get started with Azure Blob Storage and Go\\n## Authorize access and connect to Blob Storage\\nTo connect an app to Blob Storage, create a client object using [azblob.NewClient](https://pkg.go.dev/github.com/Azure/azure-sdk-for-go/sdk/storage/azblob#NewClient). This object is your starting point to interact with data resources at the storage account level. You can use it to operate on the storage account and its containers.\\nTo learn more about creating and managing client objects, including best practices, see [Create and manage client objects that interact with data resources](https://learn.microsoft.com/azure/storage/blobs/storage-blob-client-management).\\nYou can authorize a client object using a Microsoft Entra authorization token (recommended), an account access key, or a shared access signature (SAS).\\n### **Microsoft Entra ID (recommended)**\\nTo authorize with Microsoft Entra ID, you need to use a [security principal](https://learn.microsoft.com/azure/active-directory/develop/app-objects-and-service-principals). The following articles provide guidance on different authentication scenarios:\\n1. [Authentication in development environments](https://learn.microsoft.com/en-us/azure/developer/go/azure-sdk-authentication)\\n2. [Authentication in Azure-hosted apps](https://learn.microsoft.com/en-us/azure/developer/go/azure-sdk-authentication-managed-identity)\\n3. [Authentication with a service principal](https://learn.microsoft.com/en-us/azure/developer/go/azure-sdk-authentication-service-principal)\\n#### Authorize access using DefaultAzureCredential\\nAn easy and secure way to authorize access and connect to Blob Storage is to obtain an OAuth token by creating a [DefaultAzureCredential](https://pkg.go.dev/github.com/Azure/azure-sdk-for-go/sdk/azidentity#DefaultAzureCredential) instance. You can then use that credential to create the client object using [azblob.NewClient](https://pkg.go.dev/github.com/Azure/azure-sdk-for-go/sdk/storage/azblob#NewClient).\\n```go\\nfunc getServiceClientTokenCredential(accountURL string) *azblob.Client {\\n    // Create a new service client with token credential\\n    credential, err := azidentity.NewDefaultAzureCredential(nil)\\n    handleError(err)\\n\\n    client, err := azblob.NewClient(accountURL, credential, nil)\\n    handleError(err)\\n\\n    return client\\n}\\n```\", \"contentUrl\": \"https://learn.microsoft.com/azure/storage/blobs/storage-blob-go-get-started#authorize-access-and-connect-to-blob-storage\"}, {\"title\": \"Introduction to Azure Blob Storage\", \"content\": \"# Introduction to Azure Blob Storage\\n## Blob Storage resources\\nA container name must be a valid DNS name, as it forms part of the unique URI (Uniform resource identifier) used to address the container or its blobs. Follow these rules when naming a container:\\n1. Container names can be between 3 and 63 characters long.\\n2. Container names must start with a letter or number, and can contain only lowercase letters, numbers, and the dash (-) character.\\n3. Two or more consecutive dash characters aren't permitted in container names.\\nThe URI for a container is similar to:\\n`https://myaccount.blob.core.windows.net/mycontainer`\\nFor more information about naming containers, see [Naming and Referencing Containers, Blobs, and Metadata](https://learn.microsoft.com/en-us/rest/api/storageservices/Naming-and-Referencing-Containers--Blobs--and-Metadata).\\n### Blobs\\nAzure Storage supports three types of blobs:\\n1. **Block blobs** store text and binary data. Block blobs are made up of blocks of data that can be managed individually. Block blobs can store up to about 190.7 TiB.\\n2. **Append blobs** are made up of blocks like block blobs, but they're optimized for append operations. Append blobs are ideal for scenarios such as logging data from virtual machines.\\n3. **Page blobs** store random access files up to 8 TiB in size. Page blobs store virtual hard drive (VHD) files and serve as disks for Azure virtual machines. For more information about page blobs, see [Overview of Azure page blobs](https://learn.microsoft.com/azure/storage/blobs/storage-blob-pageblob-overview).\\nFor more information about the different types of blobs, see [Understanding Block Blobs, Append Blobs, and Page Blobs](https://learn.microsoft.com/en-us/rest/api/storageservices/understanding-block-blobs--append-blobs--and-page-blobs).\\nThe URI for a blob is similar to:\\n`https://myaccount.blob.core.windows.net/mycontainer/myblob`\\nor\\n`https://myaccount.blob.core.windows.net/mycontainer/myvirtualdirectory/myblob`\\nFollow these rules when naming a blob:\\n1. A blob name can contain any combination of characters.\\n2. A blob name must be at least one character long and can't be more than 1,024 characters long, for blobs in Azure Storage.\\n3. Blob names are case-sensitive.\\n4. Reserved URL characters must be properly escaped.\", \"contentUrl\": \"https://learn.microsoft.com/azure/storage/blobs/storage-blobs-introduction#blob-storage-resources\"}, {\"title\": \"Get started with Azure Blob Storage and JavaScript or TypeScript\", \"content\": \"# Get started with Azure Blob Storage and JavaScript or TypeScript\\n## Build your app\\nAs you build apps to work with data resources in Azure Blob Storage, your code primarily interacts with three resource types: storage accounts, containers, and blobs. To learn more about these resource types, how they relate to one another, and how apps interact with resources, see [Understand how apps interact with Blob Storage data resources](https://learn.microsoft.com/azure/storage/blobs/storage-blob-object-model).\\nThe following guides show you how to access data and perform specific actions using the Azure Storage client library for JavaScript:\\n| Guide | Description| \\n|  --- | ---  |\\n| [Configure a retry policy](https://learn.microsoft.com/azure/storage/blobs/storage-retry-policy-javascript) | Implement retry policies for client operations. |\\n| [Copy blobs](https://learn.microsoft.com/azure/storage/blobs/storage-blob-copy-javascript) | Copy a blob from one location to another. |\\n| [Create a container](https://learn.microsoft.com/azure/storage/blobs/storage-blob-container-create-javascript) | Create blob containers. |\\n| [Create a user delegation SAS](https://learn.microsoft.com/azure/storage/blobs/storage-blob-create-user-delegation-sas-javascript) | Create a user delegation SAS for a container or blob. |\\n| [Create and manage blob leases](https://learn.microsoft.com/azure/storage/blobs/storage-blob-lease-javascript) | Establish and manage a lock on a blob. |\\n| [Create and manage container leases](https://learn.microsoft.com/azure/storage/blobs/storage-blob-container-lease-javascript) | Establish and manage a lock on a container. |\\n| [Delete and restore](https://learn.microsoft.com/azure/storage/blobs/storage-blob-delete-javascript) | Delete blobs and restore soft-deleted blobs. |\\n| [Delete and restore containers](https://learn.microsoft.com/azure/storage/blobs/storage-blob-container-delete-javascript) | Delete containers and restore soft-deleted containers. |\\n| [Download blobs](https://learn.microsoft.com/azure/storage/blobs/storage-blob-download-javascript) | Download blobs by using strings, streams, and file paths. |\\n| [Find blobs using tags](https://learn.microsoft.com/azure/storage/blobs/storage-blob-tags-javascript) | Set and retrieve tags, and use tags to find blobs. |\\n| [List blobs](https://learn.microsoft.com/azure/storage/blobs/storage-blobs-list-javascript) | List blobs in different ways. |\\n| [List containers](https://learn.microsoft.com/azure/storage/blobs/storage-blob-containers-list-javascript) | List containers in an account and the various options available to customize a listing. |\\n| [Manage properties and metadata (blobs)](https://learn.microsoft.com/azure/storage/blobs/storage-blob-properties-metadata-javascript) | Get and set properties and metadata for blobs. |\\n| [Manage properties and metadata (containers)](https://learn.microsoft.com/azure/storage/blobs/storage-blob-container-properties-metadata-javascript) | Get and set properties and metadata for containers. |\\n| [Performance tuning for data transfers](https://learn.microsoft.com/azure/storage/blobs/storage-blobs-tune-upload-download-javascript) | Optimize performance for data transfer operations. |\\n| [Set or change a blob's access tier](https://learn.microsoft.com/azure/storage/blobs/storage-blob-use-access-tier-javascript) | Set or change the access tier for a block blob. |\\n| [Upload blobs](https://learn.microsoft.com/azure/storage/blobs/storage-blob-upload-javascript) | Learn how to upload blobs by using strings, streams, file paths, and other methods. |\\n\", \"contentUrl\": \"https://learn.microsoft.com/azure/storage/blobs/storage-blob-javascript-get-started#build-your-app\"}]}",
