              "name": "microsoft_docs_search",
              "output": "{\"results\": [{\"title\": \"Introduction to Azure Blob Storage\", \"content\": \"# Introduction to Azure Blob Storage\\nAzure Blob Storage is Microsoft's object storage solution for the cloud. Blob Storage is optimized for storing massive amounts of unstructured data. Unstructured data is data that doesn't adhere to a particular data model or definition, such as text or binary data.\\n## About Blob Storage\\nBlob Storage is designed for:\\n1. Serving images or documents directly to a browser.\\n2. Storing files for distributed access.\\n3. Streaming video and audio.\\n4. Writing to log files.\\n5. Storing data for backup and restore, disaster recovery, and archiving.\\n6. Storing data for analysis by an on-premises or Azure-hosted service.\\nUsers or client applications can access objects in Blob Storage via HTTP or HTTPS from anywhere in the world. You can access objects in Blob Storage through the [Azure Storage REST API](https://learn.microsoft.com/en-us/rest/api/storageservices/blob-service-rest-api), [Azure PowerShell](https://learn.microsoft.com/en-us/powershell/module/az.storage), [Azure CLI](https://learn.microsoft.com/en-us/cli/azure/storage), or an Azure Storage client library. Client libraries are available for different languages, including:\\n1. [.NET](https://learn.microsoft.com/en-us/dotnet/api/overview/azure/storage)\\n2. [Java](https://learn.microsoft.com/en-us/java/api/overview/azure/storage)\\n3. [Node.js](https://github.com/Azure/azure-sdk-for-js/tree/master/sdk/storage)\\n4. [Python](https://learn.microsoft.com/azure/storage/blobs/storage-quickstart-blobs-python)\\n5. [Go](https://github.com/Azure/azure-sdk-for-go/tree/main/sdk/storage/azblob)\\nClients can also securely connect to Blob Storage by using SSH File Transfer Protocol (SFTP) and mount Blob Storage containers by using the Network File System (NFS) 3.0 protocol.\\n## About Azure Data Lake Storage\\nBlob Storage supports Azure Data Lake Storage, Microsoft's enterprise big data analytics solution for the cloud. Azure Data Lake Storage offers a hierarchical file system as well as the advantages of Blob Storage, including:\\n1. Low-cost, tiered storage\\n2. High availability\\n3. Strong consistency\\n4. Disaster recovery capabilities\\nFor more information about Data Lake Storage, see [Introduction to Azure Data Lake Storage](https://learn.microsoft.com/azure/storage/blobs/data-lake-storage-introduction).\", \"contentUrl\": \"https://learn.microsoft.com/azure/storage/blobs/storage-blobs-introduction\"}, {\"title\": \"Introduction to Azure Storage\", \"content\": \"# Introduction to Azure Storage\\n## Blob Storage\\nAzure Blob Storage is Microsoft's object storage solution for the cloud. Blob Storage is optimized for storing massive amounts of unstructured data, such as text or binary data.\\nBlob Storage is ideal for:\\n1. Serving images or documents directly to a browser.\\n2. Storing files for distributed access.\\n3. Streaming video and audio.\\n4. Storing data for backup and restore, disaster recovery, and archiving.\\n5. Storing data for analysis by an on-premises or Azure-hosted service.\\nYou can access objects in Blob Storage from anywhere in the world via HTTP or HTTPS. Users or client applications can access blobs via URLs, the [Azure Storage REST API](https://learn.microsoft.com/en-us/rest/api/storageservices/blob-service-rest-api), [Azure PowerShell](https://learn.microsoft.com/en-us/powershell/module/az.storage), [Azure CLI](https://learn.microsoft.com/en-us/cli/azure/storage), or an Azure Storage client library. The storage client libraries are available for multiple languages, including [.NET](https://learn.microsoft.com/en-us/dotnet/api/overview/azure/storage), [Java](https://learn.microsoft.com/en-us/java/api/overview/azure/storage), [Node.js](https://azure.github.io/azure-storage-node), and [Python](https://learn.microsoft.com/en-us/python/api/overview/azure/storage).\\nClients can also securely connect to Blob Storage by using SSH File Transfer Protocol (SFTP) and mount Blob Storage containers by using the Network File System (NFS) 3.0 protocol.\\nFor more information about Blob Storage, see [Introduction to Blob Storage](https://learn.microsoft.com/azure/storage/blobs/storage-blobs-introduction).\", \"contentUrl\": \"https://learn.microsoft.com/azure/storage/common/storage-introduction#blob-storage\"}, {\"title\": \"Introduction to Azure Blob Storage\", \"content\": \"# Introduction to Azure Blob Storage\\n## Blob Storage resources\\nBlob Storage offers three types of resources:\\n1. The **storage account**\\n2. A **container** in the storage account\\n3. A **blob** in a container\\nThe following diagram shows the relationship between these resources.\\n![Screenshot of the relationship between an Azure Blob Storage account, containers, and blobs.](https://learn.microsoft.com/azure/storage/blobs/media/storage-blobs-introduction/blob1.png)\\n### Storage accounts\\nA storage account provides a unique namespace in Azure for your data. Every object that you store in Azure Storage has an address that includes your unique account name. The combination of the account name and the Blob Storage endpoint forms the base address for the objects in your storage account.\\nFor example, if your storage account is named *mystorageaccount*, the default endpoint for Blob Storage is:\\n```\\nhttp://mystorageaccount.blob.core.windows.net\\n```\\nThe following table describes the different types of storage accounts that support Blob Storage:\\n| Type of storage account | Performance tier | Usage| \\n|  --- | --- | ---  |\\n| General-purpose v2 | Standard | Standard storage account type for blobs, file shares, queues, and tables. Recommended for most scenarios that use Blob Storage or one of the other Azure Storage services. |\\n| Block blob | Premium | Premium storage account type for block blobs and append blobs. Recommended for scenarios with high transaction rates or that use smaller objects or require consistently low storage latency. [Learn more about workloads for premium block blob accounts...](https://learn.microsoft.com/azure/storage/blobs/storage-blob-block-blob-premium) |\\n| Page blob | Premium | Premium storage account type for page blobs only. [Learn more about workloads for premium page blob accounts...](https://learn.microsoft.com/azure/storage/blobs/storage-blob-pageblob-overview) |\\n\\nTo learn more about types of storage accounts, see [Azure storage account overview](https://learn.microsoft.com/azure/storage/common/storage-account-overview?toc=/azure/storage/blobs/toc.json). For information about legacy storage account types, see [Legacy storage account types](https://learn.microsoft.com/azure/storage/common/storage-account-overview#legacy-storage-account-types).\\nTo learn how to create a storage account, see [Create a storage account](https://learn.microsoft.com/azure/storage/common/storage-account-create).\\n### Containers\\nA container organizes a set of blobs, similar to a directory in a file system. A storage account can include an unlimited number of containers, and a container can store an unlimited number of blobs.\", \"contentUrl\": \"https://learn.microsoft.com/azure/storage/blobs/storage-blobs-introduction#blob-storage-resources\"}, {\"title\": \"Overview of Azure page blobs\", \"content\": \"# Overview of Azure page blobs\\nAzure Storage offers three types of blob storage: Block Blobs, Append Blobs and page blobs. Block blobs are composed of blocks and are ideal for storing text or binary files, and for uploading large files efficiently. Append blobs are also made up of blocks, but they're optimized for append operations, making them ideal for logging scenarios. Page blobs are made up of 512-byte pages up to 8 TB in total size and are designed for frequent random read/write operations. Page blobs are the foundation of Azure IaaS Disks. This article focuses on explaining the features and benefits of page blobs.\\nPage blobs are a collection of 512-byte pages, which provide the ability to read/write arbitrary ranges of bytes. Hence, page blobs are ideal for storing index-based and sparse data structures like OS and data disks for Virtual Machines and Databases. For example, Azure SQL DB uses page blobs as the underlying persistent storage for its databases. Moreover, page blobs are also often used for files with Range-Based updates.\\nKey features of Azure page blobs are its REST interface, the durability of the underlying storage, and the seamless migration capabilities to Azure. These features are discussed in more detail in the next section. In addition, Azure page blobs are currently supported on two types of storage: Premium Storage and Standard Storage. Premium Storage is designed specifically for workloads requiring consistent high performance and low latency making premium page blobs ideal for high performance storage scenarios. Standard storage accounts are more cost effective for running latency-insensitive workloads.\\n## Restrictions\\nPage blobs can only use the **Hot** access tier; they can't use either the **Cool** or **Archive** tiers. For more information on access tiers, see [Hot, Cool, and Archive access tiers for blob data](https://learn.microsoft.com/azure/storage/blobs/access-tiers-overview).\", \"contentUrl\": \"https://learn.microsoft.com/azure/storage/blobs/storage-blob-pageblob-overview\"}, {\"title\": \"Overview of Azure page blobs\", \"content\": \"# Overview of Azure page blobs\\n## Pricing\\nBoth types of storage offered with page blobs have their own pricing model. Premium page blobs follow the managed disks pricing model, while standard page blobs are billed on used size and with each transaction. For more information, see the [Azure Page Blobs pricing page](https://azure.microsoft.com/pricing/details/storage/page-blobs/).\\n## Page blob features\\n### REST API\\nTo get started with developing using page blobs, see [Develop using page blobs](https://learn.microsoft.com/azure/storage/blobs/storage-quickstart-blobs-dotnet). As an example, look at how to access page blobs using Storage Client Library for .NET.\\nThe following diagram describes the overall relationships between account, containers, and page blobs.\\n![Screenshot showing relationships between account, containers, and page blobs](https://learn.microsoft.com/azure/storage/blobs/media/storage-blob-pageblob-overview/storage-blob-pageblob-overview-figure1.png)\\n#### Creating an empty page blob of a specified size\\nFirst, get a reference to a container. To create a page blob, call the GetPageBlobClient method, and then call the [PageBlobClient.Create](https://learn.microsoft.com/en-us/dotnet/api/azure.storage.blobs.specialized.pageblobclient.create) method. Pass in the max size for the blob to create. That size must be a multiple of 512 bytes.\\n```csharp\\nlong OneGigabyteAsBytes = 1024 * 1024 * 1024;\\n\\nBlobServiceClient blobServiceClient = new BlobServiceClient(connectionString);\\n\\nvar blobContainerClient =\\n    blobServiceClient.GetBlobContainerClient(Constants.containerName);\\n\\nvar pageBlobClient = blobContainerClient.GetPageBlobClient(\\\"0s4.vhd\\\");\\n\\npageBlobClient.Create(16 * OneGigabyteAsBytes);\\n```\\n#### Resizing a page blob\\nTo resize a page blob after creation, use the [Resize](https://learn.microsoft.com/en-us/dotnet/api/azure.storage.blobs.specialized.pageblobclient.resize) method. The requested size should be a multiple of 512 bytes.\\n```csharp\\npageBlobClient.Resize(32 * OneGigabyteAsBytes);\\n```\\n#### Writing pages to a page blob\\nTo write pages, use the [PageBlobClient.UploadPages](https://learn.microsoft.com/en-us/dotnet/api/azure.storage.blobs.specialized.pageblobclient.uploadpages) method.\\n```csharp\\npageBlobClient.UploadPages(dataStream, startingOffset);\\n```\\nThis allows you to write a sequential set of pages up to 4MBs. The offset being written to must start on a 512-byte boundary (startingOffset % 512 == 0), and end on a 512 boundary - 1.\\nAs soon as a write request for a sequential set of pages succeeds in the blob service and is replicated for durability and resiliency, the write has committed, and success is returned back to the client.\\nThe following diagram shows two separate write operations:\", \"contentUrl\": \"https://learn.microsoft.com/azure/storage/blobs/storage-blob-pageblob-overview#pricing\"}, {\"title\": \"Reliability in Azure Blob Storage\", \"content\": \"# Reliability in Azure Blob Storage\\n[Azure Blob Storage](https://learn.microsoft.com/en-us/azure/storage/blobs/storage-blobs-overview) is an object storage solution for the cloud from Microsoft. It's designed to store massive amounts of unstructured data such as text, binary data, documents, media files, and application backups. As a foundational Azure storage service, Blob Storage provides multiple reliability features to ensure that your data remains available and durable during both planned and unplanned events.\\nWhen you use Azure, [reliability is a shared responsibility](https://learn.microsoft.com/en-us/azure/reliability/concept-shared-responsibility). Microsoft provides a range of capabilities to support resiliency and recovery. You're responsible for understanding how those capabilities work within all of the services you use, and selecting the capabilities you need to meet your business objectives and uptime goals.\\nThis article describes how to make Blob Storage resilient to a variety of potential outages and problems, including transient faults, availability zone outages, and region outages. It also describes how you can use backups to recover from other types of problems, and highlights some key information about the Blob Storage service level agreement (SLA).\\nNote\\nBlob Storage is part of the Azure Storage platform. Some of the capabilities of Blob Storage are common across many Azure Storage services. In this article, we use *Azure Storage* to refer to these features.\\n## Production deployment recommendations\\nTo learn about how to deploy Blob Storage to support your solution's reliability requirements, and how reliability affects other aspects of your architecture, see [Architecture best practices for Blob Storage](https://learn.microsoft.com/en-us/azure/well-architected/service-guides/azure-blob-storage) in the Azure Well-Architected Framework.\", \"contentUrl\": \"https://learn.microsoft.com/azure/reliability/reliability-storage-blob\"}, {\"title\": \"Get started with Azure Blob Storage using F\", \"content\": \"# Get started with Azure Blob Storage using F\\nAzure Blob Storage is a service that stores unstructured data in the cloud as objects/blobs. Blob storage can store any type of text or binary data, such as a document, media file, or application installer. Blob storage is also referred to as object storage.\\nThis article shows you how to perform common tasks using Blob storage. The samples are written using F# with the `Azure.Storage.Blobs` package. The tasks covered include how to upload, list, download, and delete blobs.\\nFor a conceptual overview of blob storage, see [the .NET guide for blob storage](https://learn.microsoft.com/en-us/azure/storage/blobs/storage-quickstart-blobs-dotnet). For ease, these tutorials use [connection strings](https://learn.microsoft.com/en-us/azure/storage/storage-configure-connection-string) to authenticate with Azure. For production applications, you should use Microsoft Entra ID with [managed identities](https://learn.microsoft.com/en-us/entra/identity/managed-identities-azure-resources/) or the [Azure.Identity library](https://learn.microsoft.com/en-us/dotnet/api/overview/azure/identity-readme) for enhanced security.\\nImportant\\nThis article uses the modern `Azure.Storage.Blobs` package. If you're updating from older code that used the deprecated `WindowsAzure.Storage` or `Microsoft.Azure.Storage.Blob` packages, you need to update your package references and namespace declarations. For migration guidance, see [Migrate to Azure.Storage.Blobs](https://learn.microsoft.com/en-us/azure/storage/blobs/storage-quickstart-blobs-dotnet).\\nNote\\nF# developers might consider the [FSharp.Azure.Blob](https://github.com/random82/FSharp.Azure.Blob) library, which provides a more idiomatic F# API for working with Azure Blob Storage. This community library offers idiomatic F# functions and patterns that make blob operations more natural in F#.\\n## Prerequisites\\nTo use this guide, you must first [create an Azure storage account](https://learn.microsoft.com/en-us/azure/storage/common/storage-account-create). You also need your storage access key for this account.\", \"contentUrl\": \"https://learn.microsoft.com/dotnet/fsharp/using-fsharp-on-azure/blob-storage\"}, {\"title\": \"Get started with Azure Blob Storage and .NET\", \"content\": \"# Get started with Azure Blob Storage and .NET\\n## Build your app\\nAs you build apps to work with data resources in Azure Blob Storage, your code primarily interacts with three resource types: storage accounts, containers, and blobs. To learn more about these resource types, how they relate to one another, and how apps interact with resources, see [Understand how apps interact with Blob Storage data resources](https://learn.microsoft.com/azure/storage/blobs/storage-blob-object-model).\\nThe following guides show you how to access data and perform specific actions using the Azure Storage client library for .NET:\\n| Guide | Description| \\n|  --- | ---  |\\n| [Append data to blobs](https://learn.microsoft.com/azure/storage/blobs/storage-blob-append) | Learn how to create an append blob and then append data to that blob. |\\n| [Configure a retry policy](https://learn.microsoft.com/azure/storage/blobs/storage-retry-policy) | Implement retry policies for client operations. |\\n| [Copy blobs](https://learn.microsoft.com/azure/storage/blobs/storage-blob-copy) | Copy a blob from one location to another. |\\n| [Create a container](https://learn.microsoft.com/azure/storage/blobs/storage-blob-container-create) | Create containers. |\\n| [Create a user delegation SAS](https://learn.microsoft.com/azure/storage/blobs/storage-blob-user-delegation-sas-create-dotnet) | Create a user delegation SAS for a container or blob. |\\n| [Create and manage blob leases](https://learn.microsoft.com/azure/storage/blobs/storage-blob-lease) | Establish and manage a lock on a blob. |\\n| [Create and manage container leases](https://learn.microsoft.com/azure/storage/blobs/storage-blob-container-lease) | Establish and manage a lock on a container. |\\n| [Delete and restore blobs](https://learn.microsoft.com/azure/storage/blobs/storage-blob-delete) | Delete blobs, and if soft-delete is enabled, restore deleted blobs. |\\n| [Delete and restore containers](https://learn.microsoft.com/azure/storage/blobs/storage-blob-container-delete) | Delete containers, and if soft-delete is enabled, restore deleted containers. |\\n| [Download blobs](https://learn.microsoft.com/azure/storage/blobs/storage-blob-download) | Download blobs by using strings, streams, and file paths. |\\n| [Find blobs using tags](https://learn.microsoft.com/azure/storage/blobs/storage-blob-tags) | Set and retrieve tags, and use tags to find blobs. |\\n| [List blobs](https://learn.microsoft.com/azure/storage/blobs/storage-blobs-list) | List blobs in different ways. |\\n| [List containers](https://learn.microsoft.com/azure/storage/blobs/storage-blob-containers-list) | List containers in an account and the various options available to customize a listing. |\\n| [Manage properties and metadata](https://learn.microsoft.com/azure/storage/blobs/storage-blob-properties-metadata) | Get and set properties and metadata for blobs. |\\n| [Manage properties and metadata](https://learn.microsoft.com/azure/storage/blobs/storage-blob-container-properties-metadata) | Get and set properties and metadata for containers. |\\n| [Performance tuning for data transfers](https://learn.microsoft.com/azure/storage/blobs/storage-blobs-tune-upload-download) | Optimize performance for data transfer operations. |\\n| [Set or change a blob's access tier](https://learn.microsoft.com/azure/storage/blobs/storage-blob-use-access-tier-dotnet) | Set or change the access tier for a block blob. |\\n| [Upload blobs](https://learn.microsoft.com/azure/storage/blobs/storage-blob-upload) | Learn how to upload blobs by using strings, streams, file paths, and other methods. |\\n\", \"contentUrl\": \"https://learn.microsoft.com/azure/storage/blobs/storage-blob-dotnet-get-started#build-your-app\"}, {\"title\": \"Azure Blob Storage lifecycle management overview\", \"content\": \"# Azure Blob Storage lifecycle management overview\\nAzure Blob Storage empowers organizations to efficiently manage and scale their data storage needs, even as data volumes grow, and usage patterns evolve. By using blob lifecycle management, customers can proactively optimize costs by implementing rule-based policies that automatically transition data to cooler tiers or expire it when it's no longer needed.\\nThis seamless automation ensures that data is always stored in the most cost-effective manner which maximizes budget efficiency while maintaining easy access and robust data management. With blob lifecycle management, organizations can confidently scale their storage environments, knowing that their costs are optimized and their data is managed according to real-world usage.\\nWith the lifecycle management policy, you can:\\n1. Transition current versions of a blob, previous versions of a blob, or blob snapshots to a cooler storage tier if these objects aren't accessed or modified for a period of time, to optimize for cost.\\n2. Transition blobs back from cool to hot immediately when they're accessed.\\n3. Delete current versions of a blob, previous versions of a blob, or blob snapshots at the end of their lifecycles.\\n4. Apply rules to an entire storage account, to select containers, or to a subset of blobs using name prefixes or blob index tags as filters.\\nTip\\nWhile lifecycle management helps you optimize your costs for a single account, you can use [Azure Storage Actions](https://learn.microsoft.com/azure/storage-actions/overview) to accomplish multiple data operations at scale across multiple accounts.\", \"contentUrl\": \"https://learn.microsoft.com/azure/storage/blobs/lifecycle-management-overview\"}, {\"title\": \"Overview of Azure page blobs\", \"content\": \"# Overview of Azure page blobs\\n## Page blob features\\nIn addition to rich REST APIs, page blobs also provide shared access, durability, and enhanced security. We'll cover those benefits in more detail in the next paragraphs.\\n### Concurrent access\\nThe page blobs REST API and its leasing mechanism allows applications to access the page blob from multiple clients. For example, let's say you need to build a distributed cloud service that shares storage objects with multiple users. It could be a web application serving a large collection of images to several users. One option for implementing this is to use a VM with attached disks. Downsides of this include, (i) the constraint that a disk can only be attached to a single VM thus limiting the scalability, flexibility, and increasing risks. If there is a problem with the VM or the service running on the VM, then due to the lease, the image is inaccessible until the lease expires or is broken; and (ii) Additional cost of having an IaaS VM.\\nAn alternative option is to use the page blobs directly via Azure Storage REST APIs. This option eliminates the need for costly IaaS VMs, offers full flexibility of direct access from multiple clients, simplifies the classic deployment model by eliminating the need to attach/detach disks, and eliminates the risk of issues on the VM. And, it provides the same level of performance for random read/write operations as a disk\\n### Durability and high availability\\nBoth standard and premium storage are durable storage where the page blob data is always replicated to ensure durability and high availability. consistently delivered enterprise-grade durability for IaaS disks and page blobs, with an industry-leading zero percent [Annualized Failure Rate](https://en.wikipedia.org/wiki/Annualized_failure_rate).\\nFor more information about Azure Storage redundancy for standard and premium storage accounts, see [Azure Storage redundancy](https://learn.microsoft.com/azure/storage/common/storage-redundancy), and these two sections specifically:\\n1. [Supported Azure Storage services](https://learn.microsoft.com/azure/storage/common/storage-redundancy#supported-azure-storage-services)\\n2. [Supported storage account types](https://learn.microsoft.com/azure/storage/common/storage-redundancy#supported-storage-account-types)\\n### Seamless migration to Azure\", \"contentUrl\": \"https://learn.microsoft.com/azure/storage/blobs/storage-blob-pageblob-overview#page-blob-features\"}]}",
