                    "text": "As of September 2026, the latest stable version of Ruby is **Ruby 4.0.6**, which was released on **July 14, 2026**. \n\nUnder the Ruby core team's bimonthly maintenance release schedule for the Ruby 4.0 series, the next minor patch release (Ruby 4.0.7) is expected to be released later in September 2026.\n\n### Active & Supported Stable Branches\nIf you are running older versions, there are still a couple of active branches receiving updates:\n*   **Ruby 3.4 (Stable):** The latest version in this branch is **3.4.10**, released on June 30, 2026.\n*   **Ruby 3.3 (Security-only maintenance):** The latest version in this branch is **3.3.12**, released on July 16, 2026. This branch has transitioned to security-only support and will reach End of Life (EOL) in March 2027.\n*   **Ruby 3.2 (End of Life):** Officially reached its EOL status on March 31, 2026, and is no longer supported. \n\n### Sources\n*   [Official Ruby Lang - Download Page](https://www.ruby-lang.org/en/downloads/)\n*   [Official Ruby Lang - Ruby Releases](https://www.ruby-lang.org/en/downloads/releases/)\n*   [Ruby 4.0.6 Release Announcement](https://www.ruby-lang.org/en/news/2026/07/14/ruby-4-0-6-released/)\n*   [Ruby Branch Maintenance Status (endoflife.date)](https://endoflife.date/ruby)",
