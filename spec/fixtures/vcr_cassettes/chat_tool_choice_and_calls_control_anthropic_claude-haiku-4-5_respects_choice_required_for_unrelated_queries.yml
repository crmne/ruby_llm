        Augustulus, was deposed by the Germanic chieftain Odoacer. This marks the
        conventional end of the Western Roman Empire.\n\nHowever, the \"fall\" of
        Rome was actually a complex process rather than a single event:\n\n- **Gradual
        decline**: The Western Roman Empire experienced political instability, military
        problems, and economic difficulties throughout the 3rd, 4th, and 5th centuries.\n\n-
        **Division of the Empire**: In 285 CE, Emperor Diocletian divided the empire
        for administrative purposes, creating the Eastern and Western Roman Empires.\n\n-
        **Eastern Roman Empire**: The Eastern Roman Empire (later called the Byzantine
        Empire) continued to exist until 1453 CE when Constantinople fell to the Ottoman
        Turks.\n\n- **Multiple factors**: The collapse involved invasions by Germanic
