        data: {"type":"response.output_text.done","sequence_number":147,"item_id":"msg_zzCF3Hn5pk7c4UmTQlFyTtFm","output_index":2,"content_index":0,"text":"The latest stable Ruby version is **Ruby 4.0.9**, released on **October 23, 2026**.\n\nAccording to the official [ruby-lang.org downloads page](https://www.ruby-lang.org/en/downloads/), \"The current stable version is 4.0.9.\"\n\n**Current maintenance status of Ruby branches:**\n\n| Version | Latest Release | Status |\n|---------|---------------|--------|\n| Ruby 4.0 | 4.0.9 (2026-10-23) | Normal maintenance |\n| Ruby 3.4 | 3.4.12 (2026-10-23) | Normal maintenance |\n| Ruby 3.3 | 3.3.13 (2026-10-23) | Security maintenance only |\n| Ruby 3.2 | 3.2.11 (2026-03-27) | End of life |\n\nRuby 4.0.0 was originally released on December 25, 2025 (following Ruby's tradition of Christmas releases), and the 4.0 series receives patch releases roughly every two months. There's also a **Ruby 4.1.0-preview1** available (released October 12, 2026) for those wanting to test the upcoming version.\n\nIf you're still on Ruby 3.3 or earlier, it's a good time to plan an upgrade, as 3.3 is in security-only maintenance and 3.2 has reached end-of-life.","logprobs":[]}

