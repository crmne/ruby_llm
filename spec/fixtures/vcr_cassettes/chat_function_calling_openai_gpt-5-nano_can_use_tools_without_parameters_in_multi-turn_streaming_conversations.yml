        tutorials.\n\nNotes and next steps:\n- If your goal is data science, Python
        is typically more in demand and has extensive libraries.\n- If you want front-end
        or full-stack web development, JavaScript (and TypeScript) is essential.\n-
        If you’re into systems programming or performance-critical code, languages
        like Rust or Go might be better.\n\nQuestions to tailor the recommendation:\n-
        What are your goals (web development, data science, automation, mobile apps,
