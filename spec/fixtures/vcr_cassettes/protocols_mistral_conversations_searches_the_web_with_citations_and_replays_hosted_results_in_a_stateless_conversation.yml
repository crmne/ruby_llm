        \"title\": \"Announcement (computing)\", \"description\": null, \"snippets\":
        [\"An **announcement** (**ANN**) is a Usenet, mailing list or e-mail message
        sent to notify subscribers that a software project has made a new release
        version. Newsgroup announcement recipients often have a name like \\\"comp.*somegroup*.announce\\\".
        Mailing list announcement recipients often have a name like \\\"*toolname*-announce\\\".
        In an announcement, the subject line commonly contains the abbreviated prefix
        **ANN:** or **[ANN]**.\\n\\nThe contents of an announcement usually contain
        a title line which contains the tool name, version, release name, and date.
        Additional contents often fall into the following message sections:\\n\\n-   **About:**
        a short paragraph summary of the tool''s purpose\\n-   **Changes:** a list
        of the highest impact changes since the last release (should be brief since
        the changelog comprises the definitive list)\\n-   **Resources:** links to
        project pages of interest, such as homepage, where to download, bug tracking
        system, etc.\\n\\nSome additional, optional fields might include \\\"Highlights\\\",
        \\\"Author(s)\\\", \\\"License\\\", \\\"Requirements\\\", and \\\"Release
        History\\\".\\n\\nAnnouncement messages are usually sent in plain text form.\\n\\n##
        Example\\n\\nExample announcement message subject line:\\n\\nANN: fooutils
        0.9.42 beta released\\n\\nExample announcement message contents:\\n\\n ==============================================\\n  Fooutils
        0.9.42 Beta Released -- 2006 Feb 16\\n ==============================================\\n\\n
        ANNOUNCING Fooutils v0.2.12beta, the first beta release.\\n\\n About Fooutils\\n
        --------------\\n Fooutils are a set of utilities that...\\n\\n Changes\\n
        -------\\n Improved the searching facility by including...\\n Fixed bugs:
        #123, #456, ...\\n\\n Resources\\n ---------\\n Homepage:\\n   http://fooutils.org\\n\\n
        Documentation:\\n   http://fooutils.org/docs\\n\\n Download:\\n   http://fooutils.org/download\\n\\n
        Bug Tracker:\\n   http://fooutils.org/newticket\\n\\n Mailing Lists:\\n   http://lists.fooutils.org/\\n\\n\"],
