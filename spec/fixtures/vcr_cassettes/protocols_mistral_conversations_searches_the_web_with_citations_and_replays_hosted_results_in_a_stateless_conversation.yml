        [\"***Four Days in November*** is a 1964 American documentary film directed
        by Mel Stuart about the assassination of John F. Kennedy. In 1965, it was
        nominated for an Academy Award for Best Documentary Feature.\\n\\n## Summary\\n\\nThe
        film includes Dallas radio and television coverage of:\\n\\n-   The President''s
        arrival at Love Field (Bob Walker, WFAA-TV 8)\\n-   Progression of the motorcade
        (Bob Huffaker, KRLD Radio)\\n-   First local bulletin of shooting (Jay Watson,
        WFAA-TV 8)\\n-   Reports at Parkland Hospital (Bob Huffaker, KRLD Radio)\\n-   Official
        announcement of President''s death from Malcolm Kilduff (Roy Nichols, KLIF
        Radio)\\n\\nAmateur films and photos include:\\n\\n-   Scenes along the motorcade
        route\\n-   Orville Nix''s films of the motorcade entering Dealey Plaza, the
        fatal head shot followed by Secret Service Agent Clint Hill climbing on top
        of the presidential limousine and the post-shooting confusion at the Plaza\\n-   Mary
        Moorman''s photo taken just a fraction of a second after the fatal shot\\n-   Bob
        Jackson''s photo Jack Ruby shoots Lee Harvey Oswald at the Dallas City Jail\\n\\n##
        Production\\n\\nThe opening credits indicate that \\\"certain scenes have
        been recreated in the original locations by the actual participants\\\". Some
        of these recreations include:\\n\\n-   Buell Wesley Frazier driving himself
        and Lee Harvey Oswald to work at the Texas School Book Depository on the morning
        of November 22. This scene includes commentary from Frazier and his sister
        Linnie Mae Randle who saw Oswald arrive at their house and place a package
        (in which Oswald told Frazier it contained curtain rods but really had the
        murder weapon) in Frazier''s car to take to work.\\n-   Oswald''s post-shooting
        trek from the Texas School Book Depository to the Texas Theater. This segment
        includes commentary from cab driver William Whaley, who picked Oswald up and
        took him to his rooming house on North Beckley.\\n-   Jack Ruby''s path from
        his apartment to the Dallas City Jail on the morning of November 24\\n\\n##
        Release\\n\\n*Four Days in November* was originally produced for television;
        United Artists then acquired the film for theatrical release.\\n\\n\"], \"date\":
