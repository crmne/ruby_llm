                  "text": "The **fall of Rome** usually refers to the collapse of the **Western Roman Empire**, traditionally dated to **476 CE**, when the Germanic leader **Odoacer deposed Emperor Romulus Augustulus**.\n\nIt was not a single sudden event but a long decline, especially from the 3rd to 5th centuries. Major contributing factors included:\n\n- Political instability and civil wars  \n- Economic problems, heavy taxation, and inflation  \n- Military pressures from Germanic tribes and the Huns  \n- Dependence on non-Roman soldiers  \n- Difficulty governing and defending a huge empire  \n- Epidemics and population decline  \n- The division of the empire into eastern and western halves  \n\nThe **Eastern Roman Empire**, later called the Byzantine Empire, survived until **1453**, when Constantinople fell to the Ottoman Turks."
