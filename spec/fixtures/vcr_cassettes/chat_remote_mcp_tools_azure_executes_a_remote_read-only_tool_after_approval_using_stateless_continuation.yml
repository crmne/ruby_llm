              "name": "microsoft_docs_search",
              "output": "{\"results\": [{\"title\": \"Introduction to Azure Blob Storage\", \"content\": \"# Introduction to Azure Blob Storage\\nAzure Blob Storage is Microsoft's object storage solution for the cloud. Blob Storage is optimized for storing massive amounts of unstructured data. Unstructured data is data that doesn't adhere to a particular data model or definition, such as text or binary data.\\n## About Blob Storage\\nBlob Storage is designed for:\\n1. Serving images or documents directly to a browser.\\n2. Storing files for distributed access.\\n3. Streaming video and audio.\\n4. Writing to log files.\\n5. Storing data for backup and restore, disaster recovery, and archiving.\\n6. Storing data for analysis by an on-premises or Azure-hosted service.\\nUsers or client applications can access objects in Blob Storage via HTTP or HTTPS from anywhere in the world. You can access objects in Blob Storage through the [Azure Storage REST API](https://learn.microsoft.com/en-us/rest/api/storageservices/blob-service-rest-api), [Azure PowerShell](https://learn.microsoft.com/en-us/powershell/module/az.storage), [Azure CLI](https://learn.microsoft.com/en-us/cli/azure/storage), or an Azure Storage client library. Client libraries are available for different languages, including:\\n1. [.NET](https://learn.microsoft.com/en-us/dotnet/api/overview/azure/storage)\\n2. [Java](https://learn.microsoft.com/en-us/java/api/overview/azure/storage)\\n3. [Node.js](https://github.com/Azure/azure-sdk-for-js/tree/master/sdk/storage)\\n4. [Python](https://learn.microsoft.com/azure/storage/blobs/storage-quickstart-blobs-python)\\n5. [Go](https://github.com/Azure/azure-sdk-for-go/tree/main/sdk/storage/azblob)\\nClients can also securely connect to Blob Storage by using SSH File Transfer Protocol (SFTP) and mount Blob Storage containers by using the Network File System (NFS) 3.0 protocol.\\n## About Azure Data Lake Storage\\nBlob Storage supports Azure Data Lake Storage, Microsoft's enterprise big data analytics solution for the cloud. Azure Data Lake Storage offers a hierarchical file system as well as the advantages of Blob Storage, including:\\n1. Low-cost, tiered storage\\n2. High availability\\n3. Strong consistency\\n4. Disaster recovery capabilities\\nFor more information about Data Lake Storage, see [Introduction to Azure Data Lake Storage](https://learn.microsoft.com/azure/storage/blobs/data-lake-storage-introduction).\", \"contentUrl\": \"https://learn.microsoft.com/azure/storage/blobs/storage-blobs-introduction\"}, {\"title\": \"Introduction to Azure Storage\", \"content\": \"# Introduction to Azure Storage\\n## Blob Storage\\nAzure Blob Storage is Microsoft's object storage solution for the cloud. Blob Storage is optimized for storing massive amounts of unstructured data, such as text or binary data.\\nBlob Storage is ideal for:\\n1. Serving images or documents directly to a browser.\\n2. Storing files for distributed access.\\n3. Streaming video and audio.\\n4. Storing data for backup and restore, disaster recovery, and archiving.\\n5. Storing data for analysis by an on-premises or Azure-hosted service.\\nYou can access objects in Blob Storage from anywhere in the world via HTTP or HTTPS. Users or client applications can access blobs via URLs, the [Azure Storage REST API](https://learn.microsoft.com/en-us/rest/api/storageservices/blob-service-rest-api), [Azure PowerShell](https://learn.microsoft.com/en-us/powershell/module/az.storage), [Azure CLI](https://learn.microsoft.com/en-us/cli/azure/storage), or an Azure Storage client library. The storage client libraries are available for multiple languages, including [.NET](https://learn.microsoft.com/en-us/dotnet/api/overview/azure/storage), [Java](https://learn.microsoft.com/en-us/java/api/overview/azure/storage), [Node.js](https://azure.github.io/azure-storage-node), and [Python](https://learn.microsoft.com/en-us/python/api/overview/azure/storage).\\nClients can also securely connect to Blob Storage by using SSH File Transfer Protocol (SFTP) and mount Blob Storage containers by using the Network File System (NFS) 3.0 protocol.\\nFor more information about Blob Storage, see [Introduction to Blob Storage](https://learn.microsoft.com/azure/storage/blobs/storage-blobs-introduction).\", \"contentUrl\": \"https://learn.microsoft.com/azure/storage/common/storage-introduction#blob-storage\"}, {\"title\": \"What is Azure Blob storage?\", \"content\": \"# What is Azure Blob storage?\\nAzure Blob Storage is Microsoft's object storage solution for the cloud. Blob Storage is optimized for storing massive amounts of unstructured data. Unstructured data is data that doesn't adhere to a particular data model or definition, such as text or binary data.\\n## About Blob Storage\\nBlob Storage is designed for:\\n1. Serving images or documents directly to a browser.\\n2. Storing files for distributed access.\\n3. Streaming video and audio.\\n4. Writing to log files.\\n5. Storing data for backup and restore, disaster recovery, and archiving.\\n6. Storing data for analysis by an on-premises or Azure-hosted service.\\nUsers or client applications can access objects in Blob Storage via HTTP or HTTPS from anywhere in the world. You can access objects in Blob Storage through the [Azure Storage REST API](https://learn.microsoft.com/en-us/rest/api/storageservices/blob-service-rest-api), [Azure PowerShell](https://learn.microsoft.com/en-us/powershell/module/az.storage), [Azure CLI](https://learn.microsoft.com/en-us/cli/azure/storage), or an Azure Storage client library. Client libraries are available for different languages, including:\\n1. [.NET](https://learn.microsoft.com/en-us/dotnet/api/overview/azure/storage)\\n2. [Java](https://learn.microsoft.com/en-us/java/api/overview/azure/storage)\\n3. [Node.js](https://github.com/Azure/azure-sdk-for-js/tree/master/sdk/storage)\\n4. [Python](https://learn.microsoft.com/azure/storage/blobs/storage-quickstart-blobs-python)\\n5. [Go](https://github.com/Azure/azure-sdk-for-go/tree/main/sdk/storage/azblob)\\nClients can also securely connect to Blob Storage by using SSH File Transfer Protocol (SFTP) and mount Blob Storage containers by using the Network File System (NFS) 3.0 protocol.\\n## About Azure Data Lake Storage\\nBlob Storage supports Azure Data Lake Storage, Microsoft's enterprise big data analytics solution for the cloud. Azure Data Lake Storage offers a hierarchical file system as well as the advantages of Blob Storage, including:\\n1. Low-cost, tiered storage\\n2. High availability\\n3. Strong consistency\\n4. Disaster recovery capabilities\\nFor more information about Data Lake Storage, see [Introduction to Azure Data Lake Storage](https://learn.microsoft.com/azure/storage/blobs/data-lake-storage-introduction).\", \"contentUrl\": \"https://learn.microsoft.com/azure/storage/blobs/storage-blobs-overview\"}, {\"title\": \"Overview of Azure page blobs\", \"content\": \"# Overview of Azure page blobs\\n## Sample use cases\\nHere are a couple of use cases for page blobs starting with Azure IaaS Disks. Azure page blobs are the backbone of the virtual disks platform for Azure IaaS. Both Azure OS and data disks are implemented as virtual disks where data is durably persisted in the Azure Storage platform and then delivered to the virtual machines for maximum performance. Azure Disks are persisted in Hyper-V [VHD format](https://learn.microsoft.com/en-us/previous-versions/windows/it-pro/windows-7/dd979539%28v=ws.10%29) and stored as a [page blob](https://learn.microsoft.com/en-us/rest/api/storageservices/Understanding-Block-Blobs--Append-Blobs--and-Page-Blobs#about-page-blobs) in Azure Storage. In addition to using virtual disks for Azure IaaS VMs, page blobs also enable PaaS and DBaaS scenarios such as Azure SQL DB service, which currently uses page blobs for storing SQL data, enabling fast random read-write operations for the database. Another example would be if you have a PaaS service for shared media access for collaborative video editing applications, page blobs enable fast access to random locations in the media. It also enables fast and efficient editing and merging of the same media by multiple users.\\nFirst party Microsoft services like Azure Site Recovery, Azure Backup, as well as many third-party developers have implemented industry-leading innovations using page blob's REST interface. Following are some of the unique scenarios implemented on Azure:\\n1. Application-directed incremental snapshot management: Applications can leverage page blob snapshots and REST APIs for saving the application checkpoints without incurring costly duplication of data. Azure Storage supports local snapshots for page blobs, which don't require copying the entire blob. These public snapshot APIs also enable accessing and copying of deltas between snapshots.\\n2. Live migration of application and data from on premises to cloud: Copy the on premises data and use REST APIs to write directly to an Azure page blob while the on premises VM continues to run. Once the target has caught up, you can quickly failover to Azure VM using that data. In this way, you can migrate your VMs and virtual disks from on premises to cloud with minimal downtime since the data migration occurs in the background while you continue to use the VM and the downtime needed for failover will be short (in minutes).\\n3. [SAS-based](https://learn.microsoft.com/azure/storage/common/storage-sas-overview) shared access, which enables scenarios like multiple-readers and single-writer with support for concurrency control.\\nUnmanaged disks are being retired, for details see [Migrate your Azure unmanaged disks by September 30, 2025](https://learn.microsoft.com/en-us/azure/virtual-machines/unmanaged-disks-deprecation).\", \"contentUrl\": \"https://learn.microsoft.com/azure/storage/blobs/storage-blob-pageblob-overview#sample-use-cases\"}, {\"title\": \"Store application data with Azure Blob Storage - Training\", \"content\": \"# Store application data with Azure Blob Storage\\r\\n\\r\\n- Module\\r\\n- 8 Units\\r\\n\\r\\n Beginner \\r\\n\\r\\n Developer \\r\\n\\r\\n Azure \\r\\n\\r\\n Azure Storage \\r\\n\\r\\nBuild an app that stores user files with Azure Blob Storage.\\r\\n\\r\\n##  Learning objectives \\r\\n\\r\\nIn this module, you will:\\r\\n\\r\\n- Organize your data with Azure Blob Storage.\\r\\n- Create storage resources to hold blobs.\\r\\n- Store and retrieve data from Azure Blob Storage.\\r\\n\\r\\n## Prerequisites\\r\\n\\r\\nNone\\r\\n\\r\\n## Get started with Azure\\r\\n\\r\\nChoose the Azure account that's right for you. Pay as you go or try Azure free for up to 30 days. [Sign up.](https://azure.microsoft.com/pricing/purchase-options/azure-account?icid=msft_learn)\\r\\n\\r\\n- [Introduction to Blob storage](https://learn.microsoft.com/training/modules/store-app-data-with-azure-blob-storage/1-introduction)\\r\\n- [What are blobs?](https://learn.microsoft.com/training/modules/store-app-data-with-azure-blob-storage/2-what-are-blobs)\\r\\n- [Design a storage organization strategy](https://learn.microsoft.com/training/modules/store-app-data-with-azure-blob-storage/3-design-organization-strategy)\\r\\n- [Exercise - Create Azure Storage resources](https://learn.microsoft.com/training/modules/store-app-data-with-azure-blob-storage/4-create-storage-resources)\\r\\n- [Exercise - Configure and initialize the client library](https://learn.microsoft.com/training/modules/store-app-data-with-azure-blob-storage/5-configure-and-initialize-the-client-library)\\r\\n- [Exercise - Get blob references](https://learn.microsoft.com/training/modules/store-app-data-with-azure-blob-storage/6-getting-blob-references)\\r\\n- [Exercise - Blob uploads and downloads](https://learn.microsoft.com/training/modules/store-app-data-with-azure-blob-storage/7-blob-uploads-and-downloads)\\r\\n- [Summary, clean up and knowledge check](https://learn.microsoft.com/training/modules/store-app-data-with-azure-blob-storage/8-cleanup-next-steps-knowledge-check)\\r\\n\\r\\nTake the module assessment\\r\\n\\r\\n Module Assessment Results\\r\\n\\r\\nAssess your understanding of this module. Sign in and answer all questions correctly to earn a pass designation on your profile.\", \"contentUrl\": \"https://learn.microsoft.com/training/modules/store-app-data-with-azure-blob-storage/\"}, {\"title\": \"Overview of Azure page blobs\", \"content\": \"# Overview of Azure page blobs\\nAzure Storage offers three types of blob storage: Block Blobs, Append Blobs and page blobs. Block blobs are composed of blocks and are ideal for storing text or binary files, and for uploading large files efficiently. Append blobs are also made up of blocks, but they're optimized for append operations, making them ideal for logging scenarios. Page blobs are made up of 512-byte pages up to 8 TB in total size and are designed for frequent random read/write operations. Page blobs are the foundation of Azure IaaS Disks. This article focuses on explaining the features and benefits of page blobs.\\nPage blobs are a collection of 512-byte pages, which provide the ability to read/write arbitrary ranges of bytes. Hence, page blobs are ideal for storing index-based and sparse data structures like OS and data disks for Virtual Machines and Databases. For example, Azure SQL DB uses page blobs as the underlying persistent storage for its databases. Moreover, page blobs are also often used for files with Range-Based updates.\\nKey features of Azure page blobs are its REST interface, the durability of the underlying storage, and the seamless migration capabilities to Azure. These features are discussed in more detail in the next section. In addition, Azure page blobs are currently supported on two types of storage: Premium Storage and Standard Storage. Premium Storage is designed specifically for workloads requiring consistent high performance and low latency making premium page blobs ideal for high performance storage scenarios. Standard storage accounts are more cost effective for running latency-insensitive workloads.\\n## Restrictions\\nPage blobs can only use the **Hot** access tier; they can't use either the **Cool** or **Archive** tiers. For more information on access tiers, see [Hot, Cool, and Archive access tiers for blob data](https://learn.microsoft.com/azure/storage/blobs/access-tiers-overview).\", \"contentUrl\": \"https://learn.microsoft.com/azure/storage/blobs/storage-blob-pageblob-overview\"}, {\"title\": \"Introduction to Azure Blob Storage\", \"content\": \"# Introduction to Azure Blob Storage\\n## Move data to Blob Storage\\nA number of solutions exist for migrating existing data to Blob Storage:\\n1. **AzCopy** is an easy-to-use command-line tool for Windows and Linux that copies data to and from Blob Storage, across containers, or across storage accounts. For more information about AzCopy, see [Transfer data with the AzCopy v10](https://learn.microsoft.com/azure/storage/common/storage-use-azcopy-v10).\\n2. The **Azure Storage Data Movement library** is a .NET library for moving data between Azure Storage services. The AzCopy utility is built with the Data Movement library. For more information, see the [reference documentation](https://learn.microsoft.com/en-us/dotnet/api/microsoft.azure.storage.datamovement) for the Data Movement library.\\n3. **Azure Data Factory** supports copying data to and from Blob Storage by using the account key, a shared access signature, a service principal, or managed identities for Azure resources. For more information, see [Copy data to or from Azure Blob Storage by using Azure Data Factory](https://learn.microsoft.com/azure/data-factory/connector-azure-blob-storage?toc=/azure/storage/blobs/toc.json).\\n4. **Blobfuse** is a virtual file system driver for Azure Blob Storage. You can use BlobFuse to access your existing block blob data in your Storage account through the Linux file system. For more information, see [What is BlobFuse? - BlobFuse2 (preview)](https://learn.microsoft.com/azure/storage/blobs/blobfuse2-what-is).\\n5. **Azure Data Box** service is available to transfer on-premises data to Blob Storage when large datasets or network constraints make uploading data over the wire unrealistic. Depending on your data size, you can request [Azure Data Box Disk](https://learn.microsoft.com/azure/databox/data-box-disk-overview), [Azure Data Box](https://learn.microsoft.com/azure/databox/data-box-overview), or [Azure Data Box Heavy](https://learn.microsoft.com/azure/databox/data-box-heavy-overview) devices from Microsoft. You can then copy your data to those devices and ship them back to Microsoft to be uploaded into Blob Storage.\\n6. The **Azure Import/Export service** provides a way to import or export large amounts of data to and from your storage account by using hard drives that you provide. For more information, see [What is Azure Import/Export service?](https://learn.microsoft.com/azure/import-export/storage-import-export-service)\", \"contentUrl\": \"https://learn.microsoft.com/azure/storage/blobs/storage-blobs-introduction#move-data-to-blob-storage\"}, {\"title\": \"Introduction to Azure Blob Storage\", \"content\": \"# Introduction to Azure Blob Storage\\n## Blob Storage resources\\nBlob Storage offers three types of resources:\\n1. The **storage account**\\n2. A **container** in the storage account\\n3. A **blob** in a container\\nThe following diagram shows the relationship between these resources.\\n![Screenshot of the relationship between an Azure Blob Storage account, containers, and blobs.](https://learn.microsoft.com/azure/storage/blobs/media/storage-blobs-introduction/blob1.png)\\n### Storage accounts\\nA storage account provides a unique namespace in Azure for your data. Every object that you store in Azure Storage has an address that includes your unique account name. The combination of the account name and the Blob Storage endpoint forms the base address for the objects in your storage account.\\nFor example, if your storage account is named *mystorageaccount*, the default endpoint for Blob Storage is:\\n```\\nhttp://mystorageaccount.blob.core.windows.net\\n```\\nThe following table describes the different types of storage accounts that support Blob Storage:\\n| Type of storage account | Performance tier | Usage| \\n|  --- | --- | ---  |\\n| General-purpose v2 | Standard | Standard storage account type for blobs, file shares, queues, and tables. Recommended for most scenarios that use Blob Storage or one of the other Azure Storage services. |\\n| Block blob | Premium | Premium storage account type for block blobs and append blobs. Recommended for scenarios with high transaction rates or that use smaller objects or require consistently low storage latency. [Learn more about workloads for premium block blob accounts...](https://learn.microsoft.com/azure/storage/blobs/storage-blob-block-blob-premium) |\\n| Page blob | Premium | Premium storage account type for page blobs only. [Learn more about workloads for premium page blob accounts...](https://learn.microsoft.com/azure/storage/blobs/storage-blob-pageblob-overview) |\\n\\nTo learn more about types of storage accounts, see [Azure storage account overview](https://learn.microsoft.com/azure/storage/common/storage-account-overview?toc=/azure/storage/blobs/toc.json). For information about legacy storage account types, see [Legacy storage account types](https://learn.microsoft.com/azure/storage/common/storage-account-overview#legacy-storage-account-types).\\nTo learn how to create a storage account, see [Create a storage account](https://learn.microsoft.com/azure/storage/common/storage-account-create).\\n### Containers\\nA container organizes a set of blobs, similar to a directory in a file system. A storage account can include an unlimited number of containers, and a container can store an unlimited number of blobs.\", \"contentUrl\": \"https://learn.microsoft.com/azure/storage/blobs/storage-blobs-introduction#blob-storage-resources\"}, {\"title\": \"Overview of Azure page blobs\", \"content\": \"# Overview of Azure page blobs\\n## Page blob features\\nIn addition to rich REST APIs, page blobs also provide shared access, durability, and enhanced security. We'll cover those benefits in more detail in the next paragraphs.\\n### Concurrent access\\nThe page blobs REST API and its leasing mechanism allows applications to access the page blob from multiple clients. For example, let's say you need to build a distributed cloud service that shares storage objects with multiple users. It could be a web application serving a large collection of images to several users. One option for implementing this is to use a VM with attached disks. Downsides of this include, (i) the constraint that a disk can only be attached to a single VM thus limiting the scalability, flexibility, and increasing risks. If there is a problem with the VM or the service running on the VM, then due to the lease, the image is inaccessible until the lease expires or is broken; and (ii) Additional cost of having an IaaS VM.\\nAn alternative option is to use the page blobs directly via Azure Storage REST APIs. This option eliminates the need for costly IaaS VMs, offers full flexibility of direct access from multiple clients, simplifies the classic deployment model by eliminating the need to attach/detach disks, and eliminates the risk of issues on the VM. And, it provides the same level of performance for random read/write operations as a disk\\n### Durability and high availability\\nBoth standard and premium storage are durable storage where the page blob data is always replicated to ensure durability and high availability. consistently delivered enterprise-grade durability for IaaS disks and page blobs, with an industry-leading zero percent [Annualized Failure Rate](https://en.wikipedia.org/wiki/Annualized_failure_rate).\\nFor more information about Azure Storage redundancy for standard and premium storage accounts, see [Azure Storage redundancy](https://learn.microsoft.com/azure/storage/common/storage-redundancy), and these two sections specifically:\\n1. [Supported Azure Storage services](https://learn.microsoft.com/azure/storage/common/storage-redundancy#supported-azure-storage-services)\\n2. [Supported storage account types](https://learn.microsoft.com/azure/storage/common/storage-redundancy#supported-storage-account-types)\\n### Seamless migration to Azure\", \"contentUrl\": \"https://learn.microsoft.com/azure/storage/blobs/storage-blob-pageblob-overview#page-blob-features\"}, {\"title\": \"Work with Azure Blob storage - Training\", \"content\": \"# Work with Azure Blob storage\\r\\n\\r\\n- Module\\r\\n- 8 Units\\r\\n\\r\\n Intermediate \\r\\n\\r\\n Developer \\r\\n\\r\\n Azure \\r\\n\\r\\n Azure Blob Storage \\r\\n\\r\\nLearn how to use the Azure Blob storage client library to create and update Blob storage resources.\\r\\n\\r\\n## Learning objectives\\r\\n\\r\\nAfter completing this module, you'll be able to:\\r\\n\\r\\n- Create an application to create and manipulate data by using the Azure Storage client library for Blob storage.\\r\\n- Manage container properties and metadata by using .NET and REST.\\r\\n\\r\\n## Prerequisites\\r\\n\\r\\n- You should be familiar with developer concepts and terminology.\\r\\n- Experience working with unstructured data solutions.\\r\\n- An understanding of cloud computing and some experience with the Azure portal.\\r\\n\\r\\n## Get started with Azure\\r\\n\\r\\nChoose the Azure account that's right for you. Pay as you go or try Azure free for up to 30 days. [Sign up.](https://azure.microsoft.com/pricing/purchase-options/azure-account?icid=msft_learn)\\r\\n\\r\\nTake the module assessment\\r\\n\\r\\n Module Assessment Results\\r\\n\\r\\nAssess your understanding of this module. Sign in and answer all questions correctly to earn a pass designation on your profile.\\r\\n\\r\\n- [Introduction](https://learn.microsoft.com/training/modules/work-azure-blob-storage/1-introduction)\\r\\n- [Explore Azure Blob storage client library](https://learn.microsoft.com/training/modules/work-azure-blob-storage/2-blob-storage-client-library-overview)\\r\\n- [Create a client object](https://learn.microsoft.com/training/modules/work-azure-blob-storage/3-create-client-object)\\r\\n- [Exercise - Create Blob storage resources by using the .NET client library](https://learn.microsoft.com/training/modules/work-azure-blob-storage/4-develop-blob-storage-dotnet)\\r\\n- [Manage container properties and metadata by using .NET](https://learn.microsoft.com/training/modules/work-azure-blob-storage/5-manage-container-properties-metadata-dotnet)\\r\\n- [Set and retrieve properties and metadata for blob resources by using REST](https://learn.microsoft.com/training/modules/work-azure-blob-storage/6-set-retrieve-properties-metadata-rest)\\r\\n- [Module assessment](https://learn.microsoft.com/training/modules/work-azure-blob-storage/7-knowledge-check)\\r\\n- [Summary](https://learn.microsoft.com/training/modules/work-azure-blob-storage/8-summary)\\r\\n\\r\\nTake the module assessment\\r\\n\\r\\n Module Assessment Results\\r\\n\\r\\nAssess your understanding of this module. Sign in and answer all questions correctly to earn a pass designation on your profile.\", \"contentUrl\": \"https://learn.microsoft.com/training/modules/work-azure-blob-storage/\"}]}",
