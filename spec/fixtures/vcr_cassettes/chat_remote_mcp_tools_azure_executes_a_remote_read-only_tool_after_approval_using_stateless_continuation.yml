              "arguments": "{\"query\":\"Azure Blob Storage Microsoft Learn documentation\"}",
              "error": null,
              "name": "microsoft_docs_search",
              "output": "{\"results\": [{\"title\": \"Develop solutions that use Blob storage - Training\", \"content\": \"# Develop solutions that use Blob storage\\r\\n\\r\\n- Learning Path\\r\\n- 3 Modules\\r\\n\\r\\n##  At a glance\\r\\n\\r\\n- Level \\r\\n\\r\\n[Intermediate](https://learn.microsoft.com/en-us/training/browse/?levels=intermediate&amp;resource_type=learning%20path)\\r\\n- Skill \\r\\n\\r\\n&nbsp;\\r\\n- Product \\r\\n\\r\\n[Azure](https://learn.microsoft.com/en-us/training/browse/?products=azure&amp;resource_type=learning%20path)\\r\\n- Role \\r\\n\\r\\n[Developer](https://learn.microsoft.com/en-us/training/browse/?roles=developer&amp;resource_type=learning%20path)\\r\\n- Subject \\r\\n\\r\\n[Cloud computing](https://learn.microsoft.com/en-us/training/browse/?subjects=cloud-computing&amp;resource_type=learning%20path)[Storage](https://learn.microsoft.com/en-us/training/browse/?subjects=storage&amp;resource_type=learning%20path)\\r\\n\\r\\nLearn how to create Azure Blob storage resources, manage data through the blob storage lifecycle, and work with containers and items by using the Azure Blob storage client library V12 for .NET.\\r\\n\\r\\n## Prerequisites\\r\\n\\r\\n- At least one year of experience developing scalable solutions through all phases of software development.\\r\\n- Have a base understanding of Azure and cloud concepts, services, and the Azure portal.\\r\\n- If you're new to Azure or cloud computing, it's recommended you complete the [AZ-900: Azure Fundamentals](https://learn.microsoft.com/en-us/training/paths/az-900-describe-cloud-concepts/) course.\\r\\n\\r\\n## Get started with Azure\\r\\n\\r\\nChoose the Azure account that's right for you. Pay as you go or try Azure free for up to 30 days. [Sign up.](https://azure.microsoft.com/pricing/purchase-options/azure-account?icid=msft_learn)\\r\\n\\r\\n**Achievement Code**\\r\\n\\r\\nWould you like to request an achievement code?\\r\\n\\r\\n## Modules in this learning path\\r\\n\\r\\n[Explore Azure Blob storage](https://learn.microsoft.com/training/modules/explore-azure-blob-storage/)\\r\\n\\r\\nLearn the core features and functionality of Azure Blob storage.\\r\\n\\r\\n[Manage the Azure Blob storage lifecycle](https://learn.microsoft.com/training/modules/manage-azure-blob-storage-lifecycle/)\\r\\n\\r\\nLearn how to manage data availability throughout the Azure Blob storage lifecycle.\\r\\n\\r\\n[Work with Azure Blob storage](https://learn.microsoft.com/training/modules/work-azure-blob-storage/)\\r\\n\\r\\nLearn how to use the Azure Blob storage client library to create and update Blob storage resources.\", \"contentUrl\": \"https://learn.microsoft.com/training/paths/develop-solutions-that-use-blob-storage/\"}, {\"title\": \"Configure Azure Blob Storage - Training\", \"content\": \"# Configure Azure Blob Storage\\r\\n\\r\\n- Module\\r\\n- 11 Units\\r\\n\\r\\n Intermediate \\r\\n\\r\\n Administrator \\r\\n\\r\\n Azure Blob Storage \\r\\n\\r\\nLearn how to configure Configure Azure Blob Storage, including tiers and object replication.\\r\\n\\r\\n##  Learning objectives \\r\\n\\r\\nIn this module, you learn how to:\\r\\n\\r\\n- Understand the purpose and benefits of Azure Blob Storage.\\r\\n- Create and configure Azure Blob Storage accounts.\\r\\n- Manage containers and blobs within Azure Blob Storage.\\r\\n- Optimize blob storage performance and scalability.\\r\\n- Implement lifecycle management policies to automate data movement and deletion.\\r\\n- Determine the best pricing plans for your Azure Blob Storage.\\r\\n\\r\\n## Prerequisites\\r\\n\\r\\n- Basic understanding of cloud computing. Familiarity with cloud computing concepts, such as virtualization, scalability, and pay-as-you-go pricing models, can provide a foundation for understanding how Azure Blob Storage fits into the broader cloud ecosystem.\\r\\n- Knowledge of Azure fundamentals. Having a basic understanding of Microsoft Azure services and concepts, such as Azure Resource Manager, Azure Storage Accounts, and Azure Virtual Networks, can help you navigate and configure blob storage effectively.\\r\\n- Familiarity with storage concepts like file systems, directories, files, and data replication.\\r\\n- Experience with Azure portal or Azure CLI. Familiarity with the Azure portal (web-based management interface) or Azure CLI (command-line interface) can help you navigate and configure blob storage resources efficiently.\\r\\n- Basic programming or scripting skills. While not always required, having some knowledge of programming or scripting languages like Azure PowerShell can be advantageous when automating blob storage configuration tasks.\\r\\n\\r\\nTake the module assessment\\r\\n\\r\\n Module Assessment Results\\r\\n\\r\\nAssess your understanding of this module. Sign in and answer all questions correctly to earn a pass designation on your profile.\\r\\n\\r\\n- [Introduction](https://learn.microsoft.com/training/modules/configure-blob-storage/1-introduction)\\r\\n- [Implement Azure Blob Storage](https://learn.microsoft.com/training/modules/configure-blob-storage/2-implement)\\r\\n- [Create blob containers](https://learn.microsoft.com/training/modules/configure-blob-storage/3-create-blob-containers)\\r\\n- [Assign blob access tiers](https://learn.microsoft.com/training/modules/configure-blob-storage/4-create-blob-access-tiers)\\r\\n- [Add blob lifecycle management rules](https://learn.microsoft.com/training/modules/configure-blob-storage/5-add-blob-lifecycle-management-rules)\\r\\n- [Determine blob object replication](https://learn.microsoft.com/training/modules/configure-blob-storage/6-determine-blob-object-replication)\\r\\n- [Manage blobs](https://learn.microsoft.com/training/modules/configure-blob-storage/7-upload-blobs)\\r\\n- [Determine Blob Storage pricing](https://learn.microsoft.com/training/modules/configure-blob-storage/8-determine-storage-pricing)\\r\\n- [Exercise - Provide storage for the public website](https://learn.microsoft.com/training/modules/configure-blob-storage/9-simulation-blobs)\\r\\n- [Module assessment](https://learn.microsoft.com/training/modules/configure-blob-storage/10-knowledge-check)\\r\\n- [Summary and resources](https://learn.microsoft.com/training/modules/configure-blob-storage/11-summary-resources)\\r\\n\\r\\nTake the module assessment\\r\\n\\r\\n Module Assessment Results\\r\\n\\r\\nAssess your understanding of this module. Sign in and answer all questions correctly to earn a pass designation on your profile.\", \"contentUrl\": \"https://learn.microsoft.com/training/modules/configure-blob-storage/\"}, {\"title\": \"Work with Azure Blob storage - Training\", \"content\": \"# Work with Azure Blob storage\\r\\n\\r\\n- Module\\r\\n- 8 Units\\r\\n\\r\\n Intermediate \\r\\n\\r\\n Developer \\r\\n\\r\\n Azure \\r\\n\\r\\n Azure Blob Storage \\r\\n\\r\\nLearn how to use the Azure Blob storage client library to create and update Blob storage resources.\\r\\n\\r\\n## Learning objectives\\r\\n\\r\\nAfter completing this module, you'll be able to:\\r\\n\\r\\n- Create an application to create and manipulate data by using the Azure Storage client library for Blob storage.\\r\\n- Manage container properties and metadata by using .NET and REST.\\r\\n\\r\\n## Prerequisites\\r\\n\\r\\n- You should be familiar with developer concepts and terminology.\\r\\n- Experience working with unstructured data solutions.\\r\\n- An understanding of cloud computing and some experience with the Azure portal.\\r\\n\\r\\n## Get started with Azure\\r\\n\\r\\nChoose the Azure account that's right for you. Pay as you go or try Azure free for up to 30 days. [Sign up.](https://azure.microsoft.com/pricing/purchase-options/azure-account?icid=msft_learn)\\r\\n\\r\\nTake the module assessment\\r\\n\\r\\n Module Assessment Results\\r\\n\\r\\nAssess your understanding of this module. Sign in and answer all questions correctly to earn a pass designation on your profile.\\r\\n\\r\\n- [Introduction](https://learn.microsoft.com/training/modules/work-azure-blob-storage/1-introduction)\\r\\n- [Explore Azure Blob storage client library](https://learn.microsoft.com/training/modules/work-azure-blob-storage/2-blob-storage-client-library-overview)\\r\\n- [Create a client object](https://learn.microsoft.com/training/modules/work-azure-blob-storage/3-create-client-object)\\r\\n- [Exercise - Create Blob storage resources by using the .NET client library](https://learn.microsoft.com/training/modules/work-azure-blob-storage/4-develop-blob-storage-dotnet)\\r\\n- [Manage container properties and metadata by using .NET](https://learn.microsoft.com/training/modules/work-azure-blob-storage/5-manage-container-properties-metadata-dotnet)\\r\\n- [Set and retrieve properties and metadata for blob resources by using REST](https://learn.microsoft.com/training/modules/work-azure-blob-storage/6-set-retrieve-properties-metadata-rest)\\r\\n- [Module assessment](https://learn.microsoft.com/training/modules/work-azure-blob-storage/7-knowledge-check)\\r\\n- [Summary](https://learn.microsoft.com/training/modules/work-azure-blob-storage/8-summary)\\r\\n\\r\\nTake the module assessment\\r\\n\\r\\n Module Assessment Results\\r\\n\\r\\nAssess your understanding of this module. Sign in and answer all questions correctly to earn a pass designation on your profile.\", \"contentUrl\": \"https://learn.microsoft.com/training/modules/work-azure-blob-storage/\"}, {\"title\": \"Get started with Azure Blob Storage and .NET\", \"content\": \"# Get started with Azure Blob Storage and .NET\\n1. [.NET](https://learn.microsoft.com/azure/storage/blobs/storage-blob-dotnet-get-started)\\n2. [Java](https://learn.microsoft.com/azure/storage/blobs/storage-blob-java-get-started)\\n3. [JavaScript](https://learn.microsoft.com/azure/storage/blobs/storage-blob-javascript-get-started)\\n4. [Python](https://learn.microsoft.com/azure/storage/blobs/storage-blob-python-get-started)\\n5. [Go](https://learn.microsoft.com/azure/storage/blobs/storage-blob-go-get-started)\\nThis article shows you how to connect to Azure Blob Storage by using the Azure Blob Storage client library for .NET. Once connected, use the developer guides to learn how your code can operate on containers, blobs, and features of the Blob Storage service.\\nIf you're looking to start with a complete example, see [Quickstart: Azure Blob Storage client library for .NET](https://learn.microsoft.com/azure/storage/blobs/storage-quickstart-blobs-dotnet).\\n[API reference](https://learn.microsoft.com/en-us/dotnet/api/azure.storage.blobs) | [Library source code](https://github.com/Azure/azure-sdk-for-net/tree/master/sdk/storage/Azure.Storage.Blobs) | [Package (NuGet)](https://www.nuget.org/packages/Azure.Storage.Blobs) | [Samples](https://learn.microsoft.com/azure/storage/common/storage-samples-dotnet?toc=/azure/storage/blobs/toc.json#blob-samples) | [Give feedback](https://github.com/Azure/azure-sdk-for-net/issues)\\n## Prerequisites\\n1. Azure subscription - [create one for free](https://azure.microsoft.com/pricing/purchase-options/azure-account?cid=msft_learn)\\n2. Azure storage account - [create a storage account](https://learn.microsoft.com/azure/storage/common/storage-account-create)\\n3. Latest [.NET SDK](https://dotnet.microsoft.com/download/dotnet) for your operating system. Be sure to get the SDK and not the runtime.\", \"contentUrl\": \"https://learn.microsoft.com/azure/storage/blobs/storage-blob-dotnet-get-started\"}, {\"title\": \"Get started with Azure Blob Storage and .NET\", \"content\": \"# Get started with Azure Blob Storage and .NET\\n## Build your app\\nAs you build apps to work with data resources in Azure Blob Storage, your code primarily interacts with three resource types: storage accounts, containers, and blobs. To learn more about these resource types, how they relate to one another, and how apps interact with resources, see [Understand how apps interact with Blob Storage data resources](https://learn.microsoft.com/azure/storage/blobs/storage-blob-object-model).\\nThe following guides show you how to access data and perform specific actions using the Azure Storage client library for .NET:\\n| Guide | Description| \\n|  --- | ---  |\\n| [Append data to blobs](https://learn.microsoft.com/azure/storage/blobs/storage-blob-append) | Learn how to create an append blob and then append data to that blob. |\\n| [Configure a retry policy](https://learn.microsoft.com/azure/storage/blobs/storage-retry-policy) | Implement retry policies for client operations. |\\n| [Copy blobs](https://learn.microsoft.com/azure/storage/blobs/storage-blob-copy) | Copy a blob from one location to another. |\\n| [Create a container](https://learn.microsoft.com/azure/storage/blobs/storage-blob-container-create) | Create containers. |\\n| [Create a user delegation SAS](https://learn.microsoft.com/azure/storage/blobs/storage-blob-user-delegation-sas-create-dotnet) | Create a user delegation SAS for a container or blob. |\\n| [Create and manage blob leases](https://learn.microsoft.com/azure/storage/blobs/storage-blob-lease) | Establish and manage a lock on a blob. |\\n| [Create and manage container leases](https://learn.microsoft.com/azure/storage/blobs/storage-blob-container-lease) | Establish and manage a lock on a container. |\\n| [Delete and restore blobs](https://learn.microsoft.com/azure/storage/blobs/storage-blob-delete) | Delete blobs, and if soft-delete is enabled, restore deleted blobs. |\\n| [Delete and restore containers](https://learn.microsoft.com/azure/storage/blobs/storage-blob-container-delete) | Delete containers, and if soft-delete is enabled, restore deleted containers. |\\n| [Download blobs](https://learn.microsoft.com/azure/storage/blobs/storage-blob-download) | Download blobs by using strings, streams, and file paths. |\\n| [Find blobs using tags](https://learn.microsoft.com/azure/storage/blobs/storage-blob-tags) | Set and retrieve tags, and use tags to find blobs. |\\n| [List blobs](https://learn.microsoft.com/azure/storage/blobs/storage-blobs-list) | List blobs in different ways. |\\n| [List containers](https://learn.microsoft.com/azure/storage/blobs/storage-blob-containers-list) | List containers in an account and the various options available to customize a listing. |\\n| [Manage properties and metadata](https://learn.microsoft.com/azure/storage/blobs/storage-blob-properties-metadata) | Get and set properties and metadata for blobs. |\\n| [Manage properties and metadata](https://learn.microsoft.com/azure/storage/blobs/storage-blob-container-properties-metadata) | Get and set properties and metadata for containers. |\\n| [Performance tuning for data transfers](https://learn.microsoft.com/azure/storage/blobs/storage-blobs-tune-upload-download) | Optimize performance for data transfer operations. |\\n| [Set or change a blob's access tier](https://learn.microsoft.com/azure/storage/blobs/storage-blob-use-access-tier-dotnet) | Set or change the access tier for a block blob. |\\n| [Upload blobs](https://learn.microsoft.com/azure/storage/blobs/storage-blob-upload) | Learn how to upload blobs by using strings, streams, file paths, and other methods. |\\n\", \"contentUrl\": \"https://learn.microsoft.com/azure/storage/blobs/storage-blob-dotnet-get-started#build-your-app\"}, {\"title\": \"Get started with Azure Blob Storage and JavaScript or TypeScript\", \"content\": \"# Get started with Azure Blob Storage and JavaScript or TypeScript\\n## Build your app\\nAs you build apps to work with data resources in Azure Blob Storage, your code primarily interacts with three resource types: storage accounts, containers, and blobs. To learn more about these resource types, how they relate to one another, and how apps interact with resources, see [Understand how apps interact with Blob Storage data resources](https://learn.microsoft.com/azure/storage/blobs/storage-blob-object-model).\\nThe following guides show you how to access data and perform specific actions using the Azure Storage client library for JavaScript:\\n| Guide | Description| \\n|  --- | ---  |\\n| [Configure a retry policy](https://learn.microsoft.com/azure/storage/blobs/storage-retry-policy-javascript) | Implement retry policies for client operations. |\\n| [Copy blobs](https://learn.microsoft.com/azure/storage/blobs/storage-blob-copy-javascript) | Copy a blob from one location to another. |\\n| [Create a container](https://learn.microsoft.com/azure/storage/blobs/storage-blob-container-create-javascript) | Create blob containers. |\\n| [Create a user delegation SAS](https://learn.microsoft.com/azure/storage/blobs/storage-blob-create-user-delegation-sas-javascript) | Create a user delegation SAS for a container or blob. |\\n| [Create and manage blob leases](https://learn.microsoft.com/azure/storage/blobs/storage-blob-lease-javascript) | Establish and manage a lock on a blob. |\\n| [Create and manage container leases](https://learn.microsoft.com/azure/storage/blobs/storage-blob-container-lease-javascript) | Establish and manage a lock on a container. |\\n| [Delete and restore](https://learn.microsoft.com/azure/storage/blobs/storage-blob-delete-javascript) | Delete blobs and restore soft-deleted blobs. |\\n| [Delete and restore containers](https://learn.microsoft.com/azure/storage/blobs/storage-blob-container-delete-javascript) | Delete containers and restore soft-deleted containers. |\\n| [Download blobs](https://learn.microsoft.com/azure/storage/blobs/storage-blob-download-javascript) | Download blobs by using strings, streams, and file paths. |\\n| [Find blobs using tags](https://learn.microsoft.com/azure/storage/blobs/storage-blob-tags-javascript) | Set and retrieve tags, and use tags to find blobs. |\\n| [List blobs](https://learn.microsoft.com/azure/storage/blobs/storage-blobs-list-javascript) | List blobs in different ways. |\\n| [List containers](https://learn.microsoft.com/azure/storage/blobs/storage-blob-containers-list-javascript) | List containers in an account and the various options available to customize a listing. |\\n| [Manage properties and metadata (blobs)](https://learn.microsoft.com/azure/storage/blobs/storage-blob-properties-metadata-javascript) | Get and set properties and metadata for blobs. |\\n| [Manage properties and metadata (containers)](https://learn.microsoft.com/azure/storage/blobs/storage-blob-container-properties-metadata-javascript) | Get and set properties and metadata for containers. |\\n| [Performance tuning for data transfers](https://learn.microsoft.com/azure/storage/blobs/storage-blobs-tune-upload-download-javascript) | Optimize performance for data transfer operations. |\\n| [Set or change a blob's access tier](https://learn.microsoft.com/azure/storage/blobs/storage-blob-use-access-tier-javascript) | Set or change the access tier for a block blob. |\\n| [Upload blobs](https://learn.microsoft.com/azure/storage/blobs/storage-blob-upload-javascript) | Learn how to upload blobs by using strings, streams, file paths, and other methods. |\\n\", \"contentUrl\": \"https://learn.microsoft.com/azure/storage/blobs/storage-blob-javascript-get-started#build-your-app\"}, {\"title\": \"Get started with Azure Blob Storage and .NET\", \"content\": \"# Get started with Azure Blob Storage and .NET\\n## Set up your project\\nThis section walks you through preparing a project to work with the Azure Blob Storage client library for .NET.\\nFrom your project directory, install packages for the Azure Blob Storage and Azure Identity client libraries using the `dotnet add package` command. The Azure.Identity package is needed for passwordless connections to Azure services.\\n```console\\ndotnet add package Azure.Storage.Blobs\\ndotnet add package Azure.Identity\\n```\\nAdd these `using` directives to the top of your code file:\\n```csharp\\nusing Azure.Identity;\\nusing Azure.Storage.Blobs;\\nusing Azure.Storage.Blobs.Models;\\nusing Azure.Storage.Blobs.Specialized;\\n```\\nBlob client library information:\\n1. [Azure.Storage.Blobs](https://learn.microsoft.com/en-us/dotnet/api/azure.storage.blobs): Contains the primary classes (*client objects*) that you can use to operate on the service, containers, and blobs.\\n2. [Azure.Storage.Blobs.Specialized](https://learn.microsoft.com/en-us/dotnet/api/azure.storage.blobs.specialized): Contains classes that you can use to perform operations specific to a blob type, such as block blobs.\\n3. [Azure.Storage.Blobs.Models](https://learn.microsoft.com/en-us/dotnet/api/azure.storage.blobs.models): All other utility classes, structures, and enumeration types.\\n## Authorize access and connect to Blob Storage\\nTo connect an app to Blob Storage, create an instance of the [BlobServiceClient](https://learn.microsoft.com/en-us/dotnet/api/azure.storage.blobs.blobserviceclient) class. This object is your starting point to interact with data resources at the storage account level. Use it to operate on the storage account and its containers. You can also use the service client to create container clients or blob clients, depending on the resource you need to work with.\\nTo learn more about creating and managing client objects, see [Create and manage client objects that interact with data resources](https://learn.microsoft.com/azure/storage/blobs/storage-blob-client-management).\\nAuthorize a `BlobServiceClient` object by using a Microsoft Entra authorization token, an account access key, or a shared access signature (SAS). For optimal security, Microsoft recommends using Microsoft Entra ID with managed identities to authorize requests against blob data. For more information, see [Authorize access to blobs using Microsoft Entra ID](https://learn.microsoft.com/azure/storage/blobs/authorize-access-azure-active-directory).\", \"contentUrl\": \"https://learn.microsoft.com/azure/storage/blobs/storage-blob-dotnet-get-started#set-up-your-project\"}, {\"title\": \"Store data in Azure learning path - Training\", \"content\": \"# Store data in Azure\\r\\n\\r\\n- Learning Path\\r\\n- 4 Modules\\r\\n\\r\\n##  At a glance\\r\\n\\r\\n- Level \\r\\n\\r\\n[Beginner](https://learn.microsoft.com/en-us/training/browse/?levels=beginner&amp;resource_type=learning%20path)\\r\\n- Skill \\r\\n\\r\\n&nbsp;\\r\\n- Product \\r\\n\\r\\n[Azure](https://learn.microsoft.com/en-us/training/browse/?products=azure&amp;resource_type=learning%20path)[Azure Storage](https://learn.microsoft.com/en-us/training/browse/?products=azure-storage&amp;resource_type=learning%20path)[Azure Portal](https://learn.microsoft.com/en-us/training/browse/?products=azure-portal&amp;resource_type=learning%20path)[Azure Cloud Shell](https://learn.microsoft.com/en-us/training/browse/?products=azure-cloud-shell&amp;resource_type=learning%20path)\\r\\n- Role \\r\\n\\r\\n[Developer](https://learn.microsoft.com/en-us/training/browse/?roles=developer&amp;resource_type=learning%20path)[Data Engineer](https://learn.microsoft.com/en-us/training/browse/?roles=data-engineer&amp;resource_type=learning%20path)\\r\\n- Subject \\r\\n\\r\\n[Storage](https://learn.microsoft.com/en-us/training/browse/?subjects=storage&amp;resource_type=learning%20path)\\r\\n\\r\\nAzure provides a variety of ways to store data: unstructured, archival, relational, and more. Learn the basics of storage management in Azure, how to create a Storage Account, and how to choose the right model for the data you want to store in the cloud. This learning path can help you prepare for the [Microsoft Certified: Azure Developer Associate certification](https://learn.microsoft.com/en-us/certifications/azure-developer).\\r\\n\\r\\n## Prerequisites\\r\\n\\r\\nNone\\r\\n\\r\\n## Get started with Azure\\r\\n\\r\\nChoose the Azure account that's right for you. Pay as you go or try Azure free for up to 30 days. [Sign up.](https://azure.microsoft.com/pricing/purchase-options/azure-account?icid=msft_learn)\\r\\n\\r\\n**Achievement Code**\\r\\n\\r\\nWould you like to request an achievement code?\\r\\n\\r\\n## Modules in this learning path\\r\\n\\r\\n[Choose a data storage approach in Azure](https://learn.microsoft.com/training/modules/choose-storage-approach-in-azure/)\\r\\n\\r\\nLearn how to use Azure Storage, Azure SQL Database, Azure Cosmos DB, or a combination of Azure resources for a performant solution in your business scenario.\\r\\n\\r\\n[Create an Azure Storage account](https://learn.microsoft.com/training/modules/create-azure-storage-account/)\\r\\n\\r\\nCreate an Azure Storage account with the correct options for your business needs.\\r\\n\\r\\n[Secure your Azure Storage account](https://learn.microsoft.com/training/modules/secure-azure-storage-account/)\\r\\n\\r\\nLearn how Azure Storage provides multilayered security to protect your data. Find out how to use access keys, to secure networks, and to use Advanced Threat Protection to proactively monitor your system.\\r\\n\\r\\n[Store application data with Azure Blob Storage](https://learn.microsoft.com/training/modules/store-app-data-with-azure-blob-storage/)\\r\\n\\r\\nBuild an app that stores user files with Azure Blob Storage.\", \"contentUrl\": \"https://learn.microsoft.com/training/paths/store-data-in-azure/\"}, {\"title\": \"Process change feed in Azure Blob Storage\", \"content\": \"# Process change feed in Azure Blob Storage\\nChange feed provides transaction logs of all the changes that occur to the blobs and the blob metadata in your storage account. This article shows you how to read change feed records by using the blob change feed processor library.\\nTo learn more about the change feed, see [Change feed in Azure Blob Storage](https://learn.microsoft.com/azure/storage/blobs/storage-blob-change-feed).\\n## Set up your project\\nThis section walks you through preparing a project to work with the Blobs Change Feed client library for .NET.\\n### Install packages\\nFrom your project directory, install the package for the [Azure Storage Blobs Change Feed client library for .NET](https://learn.microsoft.com/en-us/dotnet/api/overview/azure/storage.blobs.changefeed-readme) using the `dotnet add package` command. In this example, we add the `--prerelease` flag to the command to install the latest preview version.\\n```console\\ndotnet add package Azure.Storage.Blobs.ChangeFeed --prerelease\\n```\\nThe code examples in this article also use the [Azure Blob Storage](https://learn.microsoft.com/en-us/dotnet/api/azure.storage.blobs) and [Azure Identity](https://learn.microsoft.com/en-us/dotnet/api/azure.identity) packages.\\n```console\\ndotnet add package Azure.Identity\\ndotnet add package Azure.Storage.Blobs\\n```\\n### Add `using` directives\\nAdd the following `using` directives to your code file:\\n```csharp\\nusing Azure.Identity;\\nusing Azure.Storage.Blobs;\\nusing Azure.Storage.Blobs.ChangeFeed;\\n```\\n### Create a client object\\nTo connect the application to Blob Storage, create an instance of the `BlobServiceClient` class. The following example shows how to create a client object using `DefaultAzureCredential` for authorization. To learn more, see [Authorize access and connect to Blob Storage](https://learn.microsoft.com/azure/storage/blobs/storage-blob-dotnet-get-started#authorize-access-and-connect-to-blob-storage). To work with the change feed, you need Azure RBAC built-in role **Storage Blob Data Reader** or higher.\\n```csharp\\n// TODO: Replace <storage-account-name> with the name of your storage account\\nstring accountName = \\\"<storage-account-name>\\\";\\n\\nBlobServiceClient client = new(\\n        new Uri($\\\"https://{accountName}.blob.core.windows.net\\\"),\\n        new DefaultAzureCredential());\\n```\\nThe client object is passed as a parameter to some of the methods shown in this article.\", \"contentUrl\": \"https://learn.microsoft.com/azure/storage/blobs/storage-blob-change-feed-how-to\"}, {\"title\": \"Get started with Azure Blob Storage and JavaScript or TypeScript\", \"content\": \"# Get started with Azure Blob Storage and JavaScript or TypeScript\\n## Authorize access and connect to Blob Storage\\n### **Microsoft Entra ID (recommended)**\\nTo authorize with Microsoft Entra ID, you need to use a [security principal](https://learn.microsoft.com/azure/active-directory/develop/app-objects-and-service-principals). Which type of security principal you need depends on where your app runs. Use the following table as a guide:\\n| Where the app runs | Security principal | Guidance| \\n|  --- | --- | ---  |\\n| Local machine (developing and testing) | Service principal | To learn how to register the app, set up a Microsoft Entra group, assign roles, and configure environment variables, see [Authorize access using developer service principals](https://learn.microsoft.com/en-us/azure/developer/javascript/sdk/authentication/local-development-environment-service-principal?toc=/azure/storage/blobs/toc.json&bc=/azure/storage/blobs/breadcrumb/toc.json) |\\n| Local machine (developing and testing) | User identity | To learn how to set up a Microsoft Entra group, assign roles, and sign in to Azure, see [Authorize access using developer credentials](https://learn.microsoft.com/en-us/azure/developer/javascript/sdk/authentication/local-development-environment-developer-account?toc=/azure/storage/blobs/toc.json&bc=/azure/storage/blobs/breadcrumb/toc.json) |\\n| Hosted in Azure | Managed identity | To learn how to enable managed identity and assign roles, see [Authorize access from Azure-hosted apps using a managed identity](https://learn.microsoft.com/en-us/azure/developer/javascript/sdk/authentication/azure-hosted-apps?toc=/azure/storage/blobs/toc.json&bc=/azure/storage/blobs/breadcrumb/toc.json) |\\n| Hosted outside of Azure (for example, on-premises apps) | Service principal | To learn how to register the app, assign roles, and configure environment variables, see [Authorize access from on-premises apps using an application service principal](https://learn.microsoft.com/en-us/azure/developer/javascript/sdk/authentication/on-premises-apps?toc=/azure/storage/blobs/toc.json&bc=/azure/storage/blobs/breadcrumb/toc.json) |\\n\\n#### Authorize access using DefaultAzureCredential\\nAn easy and secure way to authorize access and connect to Blob Storage is to obtain an OAuth token by creating a [DefaultAzureCredential](https://learn.microsoft.com/en-us/javascript/api/overview/azure/identity-readme#defaultazurecredential) instance. You can then use that credential to create a `BlobServiceClient` object.\\nThe following example creates a `BlobServiceClient` object using `DefaultAzureCredential`:\\n```javascript\\nconst accountName = \\\"<account-name>\\\";\\nconst accountURL = `https://${accountName}.blob.core.windows.net`;\\nconst blobServiceClient = new BlobServiceClient(\\n  accountURL,\\n  new DefaultAzureCredential()\\n);\\n```\\nThis code example can be used for JavaScript or TypeScript projects.\", \"contentUrl\": \"https://learn.microsoft.com/azure/storage/blobs/storage-blob-javascript-get-started#authorize-access-and-connect-to-blob-storage\"}]}",
