        might be covered by trademarks or similar intellectual property rights. This
        notice does not grant any licenses under those rights. For a list of Microsoft
        trademarks, visit https://www.microsoft.com/trademarks.\\\", \\\"contentUrl\\\":
        \\\"https://learn.microsoft.com/openspecs/ie_standards/ms-ruby/9a42a052-6c5f-4ed0-98d1-c1f3cb4d0d38#intellectual-property-rights-notice-for-open-specifications-documentation\\\"},
        {\\\"title\\\": \\\"[MS-RUBY]: Microsoft Edge / Internet Explorer Ruby Annotation
        Standards Support Document\\\", \\\"content\\\": \\\"# [MS-RUBY]: Microsoft
        Edge / Internet Explorer Ruby Annotation Standards Support Document\\\\n##
        Intellectual Property Rights Notice for Open Specifications Documentation\\\\n7.
        **Fictitious Names**. The example companies, organizations, products, domain
        names, email addresses, logos, people, places, and events that are depicted
        in this documentation are fictitious. No association with any real company,
        organization, product, domain name, email address, logo, person, place, or
        event is intended or should be inferred.\\\\n**Reservation of Rights**. All
        other rights are reserved, and this notice does not grant any rights other
        than as specifically described above, whether by implication, estoppel, or
        otherwise. \\\\n**Tools**. The Open Specifications documentation does not
        require the use of Microsoft programming tools or programming environments
        in order for you to develop an implementation. If you have access to Microsoft
        programming tools and environments, you are free to take advantage of them.
        Certain Open Specifications documents are intended for use in conjunction
        with publicly available standards specifications and network programming art
        and, as such, assume that the reader either is familiar with the aforementioned
        material or has immediate access to it.\\\\n**Support.** For questions and
        support, please contact dochelp@microsoft.com.\\\", \\\"contentUrl\\\": \\\"https://learn.microsoft.com/openspecs/ie_standards/ms-ruby/9a42a052-6c5f-4ed0-98d1-c1f3cb4d0d38#intellectual-property-rights-notice-for-open-specifications-documentation\\\"},
        {\\\"title\\\": \\\"1 Introduction\\\", \\\"content\\\": \\\"# 1 Introduction\\\\nThis
        document describes the level of support provided by Microsoft web browsers
        for the *Ruby Annotation*[\\\\\\\\[Ruby:2001\\\\\\\\]](https://go.microsoft.com/fwlink/?linkid=2025928),
        W3C Recommendation 31 May 2001. Internet Explorer displays web pages written
        in HTML. \\\\nThe [Ruby:2001] specification may contain guidance for authors
        of webpages and browser users, in addition to user agents (browser applications).
        This document considers only normative language from the specification that
        applies directly to user agents.\\\", \\\"contentUrl\\\": \\\"https://learn.microsoft.com/openspecs/ie_standards/ms-ruby/f360e855-e952-491f-9068-f29d164f5eb8\\\"},
        {\\\"title\\\": \\\"Build API clients for Ruby with Microsoft identity authentication\\\",
        \\\"content\\\": \\\"# Build API clients for Ruby with Microsoft identity
        authentication\\\\nIn this tutorial, you generate an API client that uses
        [Microsoft identity authentication](https://learn.microsoft.com/en-us/azure/active-directory/fundamentals/auth-oauth2)
        to access [Microsoft Graph](https://learn.microsoft.com/en-us/graph/overview).\\\\n##
        Required tools\\\\n1. [Ruby 3.3 or newer](https://www.ruby-lang.org/en/downloads/)\\\\n2.
        [Bundler](https://bundler.io/)\\\\n## Create a project\\\\nCreate a new file
        named **Gemfile** in the root directory of your project.\\\", \\\"contentUrl\\\":
        \\\"https://learn.microsoft.com/openapi/kiota/tutorials/ruby-azure\\\"}, {\\\"title\\\":
        \\\"Build API clients for Ruby with Microsoft identity authentication\\\",
        \\\"content\\\": \\\"# Build API clients for Ruby with Microsoft identity
        authentication\\\\n## Add dependencies\\\\nBefore you can compile and run
        the generated API client, you need to make sure the generated source files
        are part of a project with the required dependencies. Your project must have
        a reference to the [abstraction package](https://github.com/microsoft/kiota-ruby/tree/main/components/abstractions).
        Additionally, you must either use the Kiota default implementations or provide
        your own custom implementations of the following packages.\\\\n1. Authentication
        ([Kiota default Azure authentication](https://github.com/microsoft/kiota-ruby/tree/main/components/authentication/oauth))\\\\n2.
        HTTP ([Kiota default Faraday-based implementation](https://github.com/microsoft/kiota-ruby/tree/main/components/http))\\\\n3.
        JSON serialization ([Kiota default](https://github.com/microsoft/kiota-ruby/tree/main/components/serialization/json))\\\\n4.
        Text serialization ([Kiota default](https://github.com/microsoft/kiota-ruby/tree/main/components/serialization/text))\\\\n5.
        Form serialization ([Kiota default](https://github.com/microsoft/kiota-ruby/tree/main/components/serialization/form))\\\\n6.
        Multipart serialization ([Kiota default](https://github.com/microsoft/kiota-ruby/tree/main/components/serialization/multipart))\\\\nFor
        this tutorial, use the default implementations.\\\\n1. Edit your **Gemfile**
        and add the following code.\\\\n```ruby\\\\n source 'https://rubygems.org'\\\\n\\\\n
        ruby \\\\\\\">= 3.3.0\\\\\\\"\\\\n\\\\n gem \\\\\\\"microsoft_kiota_abstractions\\\\\\\"\\\\n
        gem \\\\\\\"microsoft_kiota_serialization_json\\\\\\\"\\\\n gem \\\\\\\"microsoft_kiota_serialization_text\\\\\\\"\\\\n
        gem \\\\\\\"microsoft_kiota_serialization_form\\\\\\\"\\\\n gem \\\\\\\"microsoft_kiota_serialization_multipart\\\\\\\"\\\\n
        gem \\\\\\\"microsoft_kiota_authentication_oauth\\\\\\\"\\\\n gem \\\\\\\"microsoft_kiota_faraday\\\\\\\"\\\\n```\\\\n2.
        To install dependencies, run the following command.\\\\n```bash\\\\n bundle
        install\\\\n```\\\\n### Generate the API client\\\\nKiota generates API clients
        from OpenAPI documents. Create a file named **get-me.yml** and add the following.\\\\nYou
        can then use the Kiota command line tool to generate the API client classes.\\\\n```bash\\\\nkiota
        generate -l ruby -d get-me.yml -c GetUserApiClient -n GetUser -o ./client\\\\n```\\\",
        \\\"contentUrl\\\": \\\"https://learn.microsoft.com/openapi/kiota/tutorials/ruby-azure#add-dependencies\\\"},
        {\\\"title\\\": \\\"Ruby Driver for SQL Server\\\", \\\"content\\\": \\\"#
        Ruby Driver for SQL Server\\\\n![](https://learn.microsoft.com/sql/includes/media/download.svg?view=sql-server-ver17)**[Download
        Ruby driver for SQL](https://learn.microsoft.com/sql/connect/sql-connection-libraries?view=sql-server-ver17#anchor-20-drivers-relational-access)**\\\\nYou
        can connect to a SQL Database using Ruby on Windows, Linux, or macOS.\\\\n##
        Get started\\\\n1. [Step 1: Configure development environment for Ruby development](https://learn.microsoft.com/sql/connect/ruby/step-1-configure-development-environment-for-ruby-development?view=sql-server-ver17)\\\\n2.
        [Step 2: Create a SQL database for Ruby development](https://learn.microsoft.com/sql/connect/ruby/step-2-create-a-sql-database-for-ruby-development?view=sql-server-ver17)\\\\n3.
        [Step 3: Proof of concept connecting to SQL using Ruby](https://learn.microsoft.com/sql/connect/ruby/step-3-proof-of-concept-connecting-to-sql-using-ruby?view=sql-server-ver17)\\\\n##
        Documentation\\\\n[Documentation at ruby-lang.org](https://www.ruby-lang.org/en/documentation/)\\\\n##
        Support\\\\nRuby and tiny\\\\\\\\_tds are community-supported software. This
        software doesn't come with Microsoft support. To get help, visit the community
        resources.\\\\n## Community resources\\\\n1. [Azure Ruby Developer Center](https://azure.microsoft.com/develop/ruby/)\\\",
        \\\"contentUrl\\\": \\\"https://learn.microsoft.com/sql/connect/ruby/ruby-driver-for-sql-server?view=sql-server-ver17\\\"},
        {\\\"title\\\": \\\"Build API clients for Ruby\\\", \\\"content\\\": \\\"#
        Build API clients for Ruby\\\\nIn this tutorial, you build a sample app in
        Ruby that calls a REST API that doesn't require authentication.\\\\n## Required
        tools\\\\n1. [Ruby 3.3 or newer](https://www.ruby-lang.org/en/downloads/)\\\\n2.
        [Bundler](https://bundler.io/)\\\\n## Create a project\\\\nCreate a directory
        to contain the new project, and create a new file named **Gemfile** in it.\\\\n##
        Add dependencies\\\\nBefore you can compile and run the generated API client,
        you need to make sure the generated source files are part of a project with
        the required dependencies. Your project must have a reference to the [abstraction
        package](https://github.com/microsoft/kiota-ruby/tree/main/components/abstractions).
        Additionally, you must either use the Kiota default implementations or provide
        your own custom implementations of the following packages.\\\\n1. HTTP ([Kiota
        default Faraday-based implementation](https://github.com/microsoft/kiota-ruby/tree/main/components/http))\\\\n2.
        JSON serialization ([Kiota default](https://github.com/microsoft/kiota-ruby/tree/main/components/serialization/json))\\\\n3.
        Text serialization ([Kiota default](https://github.com/microsoft/kiota-ruby/tree/main/components/serialization/text))\\\\n4.
        Form serialization ([Kiota default](https://github.com/microsoft/kiota-ruby/tree/main/components/serialization/form))\\\\n5.
        Multipart serialization ([Kiota default](https://github.com/microsoft/kiota-ruby/tree/main/components/serialization/multipart))\\\\nFor
        this tutorial, use the default implementations.\\\\n1. Edit your **Gemfile**
        and add the following code.\\\\n```ruby\\\\n source 'https://rubygems.org'\\\\n\\\\n
        ruby \\\\\\\">= 3.3.0\\\\\\\"\\\\n\\\\n gem \\\\\\\"microsoft_kiota_abstractions\\\\\\\"\\\\n
        gem \\\\\\\"microsoft_kiota_faraday\\\\\\\"\\\\n gem \\\\\\\"microsoft_kiota_serialization_json\\\\\\\"\\\\n
        gem \\\\\\\"microsoft_kiota_serialization_text\\\\\\\"\\\\n gem \\\\\\\"microsoft_kiota_serialization_form\\\\\\\"\\\\n
        gem \\\\\\\"microsoft_kiota_serialization_multipart\\\\\\\"\\\\n```\\\\n2.
        To install dependencies, run the following command.\\\\n```bash\\\\n bundle
        install\\\\n```\\\", \\\"contentUrl\\\": \\\"https://learn.microsoft.com/openapi/kiota/quickstarts/ruby\\\"},
        {\\\"title\\\": \\\"2 Standards Support Statements\\\", \\\"content\\\": \\\"#
        2 Standards Support Statements\\\\nThis section contains all variations and
        clarifications for the Microsoft implementation of [\\\\\\\\[Ruby:2001\\\\\\\\]](https://go.microsoft.com/fwlink/?linkid=2025928).\\\\n1.
        Section [2.1](https://learn.microsoft.com/openspecs/ie_standards/ms-ruby/ec9c8be7-1345-47fe-b4c9-6ba0db689afb)
        describes normative variations from the MUST requirements of the specification.\\\\n2.
        Section [2.2](https://learn.microsoft.com/openspecs/ie_standards/ms-ruby/f245dbe6-ec0e-4984-be62-29ce34bab3ac)
        describes clarifications of the MAY and SHOULD requirements.\\\\n3. Section
        [2.3](https://learn.microsoft.com/openspecs/ie_standards/ms-ruby/09ccb566-cf50-44cd-9ea3-bb2d3b5610a4)
        considers error handling aspects of the implementation.\\\\n4. Section [2.4](https://learn.microsoft.com/openspecs/ie_standards/ms-ruby/4b1eb474-cf2a-4c98-8086-fc003ad7d7d5)
        considers security aspects of the implementation.\\\", \\\"contentUrl\\\":
        \\\"https://learn.microsoft.com/openspecs/ie_standards/ms-ruby/8add21e0-c252-4bf2-aeb1-90be10d122d3\\\"},
