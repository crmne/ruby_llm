        Functions diagnostics overview","contentUrl":"https://learn.microsoft.com/azure/azure-functions/functions-diagnostics","content":"#
        Azure Functions diagnostics overview\nWhen you’re running a function app,
        you want to be prepared for any issues that may arise, from 4xx errors to
        trigger failures. Azure Functions diagnostics is an intelligent and interactive
        experience to help you troubleshoot your function app with no configuration
        or extra cost. When you do run into issues with your function app, Azure Functions
        diagnostics points out what’s wrong. It guides you to the right information
        to more easily and quickly troubleshoot and resolve the issue. This article
        shows you the basics of how to use Azure Functions diagnostics to more quickly
        diagnose and solve common function app issues.\n## Start Azure Functions diagnostics\nTo
        start Azure Functions diagnostics:\n1. Navigate to your function app in the
        [Azure portal](https://portal.azure.com).\n2. Select **Diagnose and solve
        problems** to open Azure Functions diagnostics.\n3. Choose a category that
        best describes the issue of your function app by using the keywords in the
        homepage tile. You can also type a keyword that best describes your issue
        in the search bar. For example, you could type `execution` to see a list of
        diagnostic reports related to your function app execution and open them directly
        from the homepage.\n ![Search for Azure Functions diagnostics.](https://learn.microsoft.com/azure/azure-functions/media/functions-diagnostics/functions-app-search-azure-functions-diagnostics.png)\n##
        Use the Interactive interface\nOnce you select a homepage category that best
        aligns with your function app''s problem, Azure Functions diagnostics'' interactive
        interface, named Genie, can guide you through diagnosing and solving problem
        of your app. You can use the tile shortcuts provided by Genie to view the
        full diagnostic report of the problem category that you''re interested in.
        The tile shortcuts provide you a direct way of accessing your diagnostic metrics.\n![Genie
        is Azure Functions diagnostics'' interface.](https://learn.microsoft.com/azure/azure-functions/media/functions-diagnostics/genie.png)\nAfter
        selecting a tile, you can see a list of topics related to the issue described
        in the tile. These topics provide snippets of notable information from the
        full report. Select any of these topics to investigate the issues further.
        Also, you can select **View Full Report** to explore all the topics on a single
        page.\n![Preview of diagnostic report](https://learn.microsoft.com/azure/azure-functions/media/functions-diagnostics/preview-of-diagnostic-report.png)"},{"title":"Get
