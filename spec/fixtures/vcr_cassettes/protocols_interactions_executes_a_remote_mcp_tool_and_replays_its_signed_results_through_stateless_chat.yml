        | Output |\\\\n\\\\n## Scope of availability for functions triggers and bindings\\\\n|
        Tier | Azure Cache for Redis (Basic, Standard, Premium, Enterprise, Enterprise
        Flash) | Azure Managed Redis (Memory Optimized, Basic, Compute Optimized,
        Flash Optimized)| \\\\n|  --- | --- | ---  |\\\\n| Pub/Sub | Yes | Yes |\\\\n|
        Lists | Yes | Yes |\\\\n| Streams | Yes | Yes |\\\\n| Bindings | Yes | Yes
        |\\\\n\\\\nImportant\\\\nRedis triggers are currently only supported for functions
        running in either a [Elastic Premium plan](https://learn.microsoft.com/azure/azure-functions/functions-premium-plan)
        or a dedicated [App Service plan](https://learn.microsoft.com/azure/azure-functions/dedicated-plan).\\\",\\\"contentUrl\\\":\\\"https://learn.microsoft.com/azure/azure-functions/functions-bindings-cache\\\"},{\\\"title\\\":\\\"Get
        started with Azure Functions (programming-language-csharp)\\\",\\\"content\\\":\\\"#
        Get started with Azure Functions (programming-language-csharp)\\\\nAzure Functions
        lets you implement your system\\\\u0027s logic as event-driven, readily available
        blocks of code. These code blocks are called functions. This article helps
        you find the most useful Azure Functions content quickly. For more general
        information about Azure Functions, see the [Introduction to Azure Functions](https://learn.microsoft.com/azure/azure-functions/functions-overview).\\\\nChoose
        your preferred development language at the top of the article.\\\\n## Create
        your first function\\\\nComplete a quickstart article to create and deploy
        your first functions in less than five minutes.\\\\nYou can create your first
        function by using one of the following tools:\\\\n1. [Azure Developer CLI
        (azd)](https://learn.microsoft.com/azure/azure-functions/create-first-function-azure-developer-cli)\\\\n2.
