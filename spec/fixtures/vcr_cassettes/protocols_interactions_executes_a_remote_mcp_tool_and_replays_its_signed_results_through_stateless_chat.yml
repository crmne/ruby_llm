        |\\n\",\"contentUrl\":\"https://learn.microsoft.com/azure/azure-functions/functions-bindings-azure-sql#samples\"},{\"title\":\"What
        is Azure Functions?\",\"content\":\"# What is Azure Functions?\\nAzure Functions
        is a serverless solution that allows you to build robust apps while using
        less code, and with less infrastructure and lower costs. Instead of worrying
        about deploying and maintaining servers, you can use the cloud infrastructure
        to provide all the up-to-date resources needed to keep your applications running.\\nYou
        focus on the code that matters most to you, in the most productive language
        for you, and Azure Functions handles the rest. For a list of supported languages,
        see [Supported languages in Azure Functions](https://learn.microsoft.com/azure/azure-functions/supported-languages).\\n##
        Scenarios\\nFunctions provides a comprehensive set of event-driven [triggers
        and bindings](https://learn.microsoft.com/azure/azure-functions/functions-triggers-bindings)
        that connect your functions to other services without having to write extra
        code.\\nThe following list includes common integrated scenarios that use Functions.\\n|
        If you want to... | then...| \\n|  --- | ---  |\\n| [Process file uploads](https://learn.microsoft.com/azure/azure-functions/functions-scenarios#process-file-uploads)
        | Run code when a file is uploaded or changed in blob storage. |\\n| [Process
        data in real time](https://learn.microsoft.com/azure/azure-functions/functions-scenarios#real-time-stream-and-event-processing)
        | Capture and transform data from event and IoT source streams on the way
        to storage. |\\n| [Run AI inference](https://learn.microsoft.com/azure/azure-functions/functions-scenarios#machine-learning-and-ai)
        | Pull text from a queue and present it to various AI services for analysis
        and classification. |\\n| [Run scheduled task](https://learn.microsoft.com/azure/azure-functions/functions-scenarios#run-scheduled-tasks)
        | Execute data clean-up code on predefined timed intervals. |\\n| [Build a
        scalable web API](https://learn.microsoft.com/azure/azure-functions/functions-scenarios#build-a-scalable-web-api)
        | Implement a set of REST endpoints for your web applications using HTTP triggers.
        |\\n| [Build a serverless workflow](https://learn.microsoft.com/azure/azure-functions/functions-scenarios#build-a-serverless-workflow)
        | Create an event-driven workflow from a series of functions using Durable
        Functions. |\\n| [Respond to database changes](https://learn.microsoft.com/azure/azure-functions/functions-scenarios#respond-to-database-changes)
        | Run custom logic when a document is created or updated in a database. |\\n|
        [Create reliable message systems](https://learn.microsoft.com/azure/azure-functions/functions-scenarios#create-reliable-message-systems)
        | Process message queues using Azure Queue Storage, Service Bus, or Event
        Hubs. |\\n\\nThese scenarios allow you to build event-driven systems using
        modern architectural patterns. For more information, see [Azure Functions
        scenarios](https://learn.microsoft.com/azure/azure-functions/functions-scenarios).\",\"contentUrl\":\"https://learn.microsoft.com/azure/azure-functions/functions-overview\"},{\"title\":\"Azure
        Functions libraries for .NET\",\"content\":\"# Azure Functions libraries for
        .NET\\n## Overview\\n[Azure Functions](https://learn.microsoft.com/en-us/azure/azure-functions/functions-overview)
        is a solution for easily running small pieces of code, or *functions*, in
        Azure. Azure Functions supports a [serverless](https://azure.microsoft.com/solutions/serverless/)
        execution model.\\n## Durable Functions extension\\n*Durable Functions* is
        an extension of [Azure Functions](https://learn.microsoft.com/en-us/azure/azure-functions/functions-overview)
        that lets you write stateful functions in a serverless compute environment.
        The extension lets you define stateful workflows by writing [*orchestrator
        functions*](https://learn.microsoft.com/en-us/azure/azure-functions/durable/durable-functions-orchestrations)
        and stateful entities by writing [*entity functions*](https://learn.microsoft.com/en-us/azure/azure-functions/durable/durable-functions-entities)
        using the Azure Functions programming model. Behind the scenes, the extension
        manages state, checkpoints, and restarts for you, allowing you to focus on
        your business logic.\\nInstall the extension [NuGet package](https://www.nuget.org/packages/Microsoft.Azure.WebJobs.Extensions.DurableTask)
        directly from the Visual Studio [Package Manager console](https://learn.microsoft.com/en-us/nuget/tools/package-manager-console)
        or with the [.NET Core CLI](https://learn.microsoft.com/en-us/dotnet/core/tools/dotnet-add-package).\\nThe
        Azure API reference documentation supports [version 2.x of the Durable Functions
        extension](https://learn.microsoft.com/en-us/dotnet/api/overview/azure/functions/runtime).\\n###
        Visual Studio package manager\\n\\u0060\\u0060\\u0060powershell\\nInstall-Package
        Microsoft.Azure.WebJobs.Extensions.DurableTask\\n\\u0060\\u0060\\u0060\\n###
        .NET Core CLI\\n\\u0060\\u0060\\u0060dotnetcli\\ndotnet add package Microsoft.Azure.WebJobs.Extensions.DurableTask\\n\\u0060\\u0060\\u0060\\n###
        Getting started\\n## Samples\\nView the [complete list](https://learn.microsoft.com/en-us/samples/browse/?products=azure-functions\\u0026languages=csharp)
        of Azure Functions samples.\",\"contentUrl\":\"https://learn.microsoft.com/dotnet/api/overview/azure/functions?view=azure-dotnet#overview\"},{\"title\":\"Overview
