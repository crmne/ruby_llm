        or a dedicated [App Service plan](https://learn.microsoft.com/azure/azure-functions/dedicated-plan).","contentUrl":"https://learn.microsoft.com/azure/azure-functions/functions-bindings-cache","title":"Overview
        of Azure functions for Azure Redis (programming-language-powershell)"},{"content":"#
        Get started with Azure Functions (programming-language-python)\nAzure Functions
        lets you implement your system''s logic as event-driven, readily available
        blocks of code. These code blocks are called functions. This article helps
        you find the most useful Azure Functions content quickly. For more general
        information about Azure Functions, see the [Introduction to Azure Functions](https://learn.microsoft.com/azure/azure-functions/functions-overview).\nChoose
        a programming language or hosted skills at the top of the article.\n## Create
        your first function\nComplete a quickstart article to create and deploy your
        first functions in less than five minutes.\nYou can create your first function
        by using one of the following tools:\n1. [Azure Developer CLI (azd)](https://learn.microsoft.com/azure/azure-functions/create-first-function-azure-developer-cli)\n2.
        [Command line](https://learn.microsoft.com/azure/azure-functions/how-to-create-function-azure-cli)\n3.
        [Visual Studio Code](https://learn.microsoft.com/azure/azure-functions/how-to-create-function-vs-code)\n##
        Review end-to-end samples\nThese sites let you browse existing functions reference
        projects and samples in your desired language:\n1. [Awesome azd template library](https://azure.github.io/awesome-azd/?tags=functions&tags=python)\n2.
        [Azure Functions samples in GitHub](https://github.com/search?q=topic%3Aazure-functions+org%3AAzure-Samples+fork%3Atrue+language%3APython+&type=repositories)\n3.
        [Azure samples browser](https://learn.microsoft.com/en-us/samples/browse/?expanded=azure&languages=python&products=azure-functions)\n##
        Scenarios\nHere are some common scenarios to help you get started:\n1. [Process
        file uploads](https://learn.microsoft.com/azure/azure-functions/functions-scenarios#process-file-uploads)\n2.
        [Real-time stream and event processing](https://learn.microsoft.com/azure/azure-functions/functions-scenarios#real-time-stream-and-event-processing)\n3.
        [Build AI-enabled apps](https://learn.microsoft.com/azure/azure-functions/functions-scenarios#build-ai-enabled-apps)\n4.
        [Run scheduled tasks](https://learn.microsoft.com/azure/azure-functions/functions-scenarios#run-scheduled-tasks)\n5.
        [Build a scalable web API](https://learn.microsoft.com/azure/azure-functions/functions-scenarios#build-a-scalable-web-api)\n6.
        [Build a serverless workflow](https://learn.microsoft.com/azure/azure-functions/functions-scenarios#build-a-serverless-workflow)\n7.
        [Respond to database changes](https://learn.microsoft.com/azure/azure-functions/functions-scenarios#respond-to-database-changes)\n8.
        [Create reliable message systems](https://learn.microsoft.com/azure/azure-functions/functions-scenarios#create-reliable-message-systems)","contentUrl":"https://learn.microsoft.com/azure/azure-functions/functions-get-started","title":"Get
        started with Azure Functions (programming-language-python)"},{"content":"#
        Azure Functions diagnostics overview\nWhen you’re running a function app,
        you want to be prepared for any issues that may arise, from 4xx errors to
        trigger failures. Azure Functions diagnostics is an intelligent and interactive
        experience to help you troubleshoot your function app with no configuration
        or extra cost. When you do run into issues with your function app, Azure Functions
        diagnostics points out what’s wrong. It guides you to the right information
        to more easily and quickly troubleshoot and resolve the issue. This article
        shows you the basics of how to use Azure Functions diagnostics to more quickly
        diagnose and solve common function app issues.\n## Start Azure Functions diagnostics\nTo
        start Azure Functions diagnostics:\n1. Navigate to your function app in the
        [Azure portal](https://portal.azure.com).\n2. Select **Diagnose and solve
        problems** to open Azure Functions diagnostics.\n3. Choose a category that
        best describes the issue of your function app by using the keywords in the
        homepage tile. You can also type a keyword that best describes your issue
        in the search bar. For example, you could type `execution` to see a list of
        diagnostic reports related to your function app execution and open them directly
        from the homepage.\n ![Search for Azure Functions diagnostics.](https://learn.microsoft.com/azure/azure-functions/media/functions-diagnostics/functions-app-search-azure-functions-diagnostics.png)\n##
        Use the Interactive interface\nOnce you select a homepage category that best
        aligns with your function app''s problem, Azure Functions diagnostics'' interactive
        interface, named Genie, can guide you through diagnosing and solving problem
        of your app. You can use the tile shortcuts provided by Genie to view the
        full diagnostic report of the problem category that you''re interested in.
        The tile shortcuts provide you a direct way of accessing your diagnostic metrics.\n![Genie
        is Azure Functions diagnostics'' interface.](https://learn.microsoft.com/azure/azure-functions/media/functions-diagnostics/genie.png)\nAfter
        selecting a tile, you can see a list of topics related to the issue described
        in the tile. These topics provide snippets of notable information from the
        full report. Select any of these topics to investigate the issues further.
        Also, you can select **View Full Report** to explore all the topics on a single
        page.\n![Preview of diagnostic report](https://learn.microsoft.com/azure/azure-functions/media/functions-diagnostics/preview-of-diagnostic-report.png)","contentUrl":"https://learn.microsoft.com/azure/azure-functions/functions-diagnostics","title":"Azure
        Functions diagnostics overview"}]}}},{"signature":"","type":"thought"},{"content":[{"text":"According
        to Microsoft Learn''s [What is Azure Functions?](https://learn.microsoft.com/azure/azure-functions/functions-overview)
        overview:\n\n* **What it is:** Azure Functions is an event-driven serverless
        compute service that enables you to run small pieces of code (functions) without
        provisioning or managing infrastructure.\n* **Key benefits:** Focus on application
        logic while cloud infrastructure handles scaling, maintenance, and resource
        allocation, lowering operational costs and code overhead.\n* **Core features:**
        Built-in triggers and bindings to integrate seamlessly with various Azure
        and third-party services, with multi-language support (C#, Python, JavaScript/TypeScript,
        Java, PowerShell, etc.).","type":"text"}],"type":"model_output"},{"type":"user_input","content":[{"type":"text","text":"What
