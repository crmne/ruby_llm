        is detected on a SQL table | [SQL trigger](https://learn.microsoft.com/azure/azure-functions/functions-bindings-azure-sql-trigger)
        |\\\\n| Read data from a database | [Input binding](https://learn.microsoft.com/azure/azure-functions/functions-bindings-azure-sql-input)
