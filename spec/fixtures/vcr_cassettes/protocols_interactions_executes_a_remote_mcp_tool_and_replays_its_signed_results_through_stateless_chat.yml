        detected on a SQL table | [SQL trigger](https://learn.microsoft.com/azure/azure-functions/functions-bindings-azure-sql-trigger)
        |\\n| Read data from a database | [Input binding](https://learn.microsoft.com/azure/azure-functions/functions-bindings-azure-sql-input)
        |\\n| Save data to a database | [Output binding](https://learn.microsoft.com/azure/azure-functions/functions-bindings-azure-sql-output)
        |\\n\",\"contentUrl\":\"https://learn.microsoft.com/azure/azure-functions/functions-bindings-azure-sql#samples\"},{\"title\":\"Azure
        Functions libraries for .NET\",\"content\":\"# Azure Functions libraries for
        .NET\\n## Overview\\n[Azure Functions](https://learn.microsoft.com/en-us/azure/azure-functions/functions-overview)
        is a solution for easily running small pieces of code, or *functions*, in
        Azure. Azure Functions supports a [serverless](https://azure.microsoft.com/solutions/serverless/)
        execution model.\\n## Durable Functions extension\\n*Durable Functions* is
        an extension of [Azure Functions](https://learn.microsoft.com/en-us/azure/azure-functions/functions-overview)
        that lets you write stateful functions in a serverless compute environment.
        The extension lets you define stateful workflows by writing [*orchestrator
        functions*](https://learn.microsoft.com/en-us/azure/azure-functions/durable/durable-functions-orchestrations)
        and stateful entities by writing [*entity functions*](https://learn.microsoft.com/en-us/azure/azure-functions/durable/durable-functions-entities)
        using the Azure Functions programming model. Behind the scenes, the extension
        manages state, checkpoints, and restarts for you, allowing you to focus on
        your business logic.\\nInstall the extension [NuGet package](https://www.nuget.org/packages/Microsoft.Azure.WebJobs.Extensions.DurableTask)
        directly from the Visual Studio [Package Manager console](https://learn.microsoft.com/en-us/nuget/tools/package-manager-console)
        or with the [.NET Core CLI](https://learn.microsoft.com/en-us/dotnet/core/tools/dotnet-add-package).\\nThe
        Azure API reference documentation supports [version 2.x of the Durable Functions
        extension](https://learn.microsoft.com/en-us/dotnet/api/overview/azure/functions/runtime).\\n###
        Visual Studio package manager\\n\\u0060\\u0060\\u0060powershell\\nInstall-Package
        Microsoft.Azure.WebJobs.Extensions.DurableTask\\n\\u0060\\u0060\\u0060\\n###
        .NET Core CLI\\n\\u0060\\u0060\\u0060dotnetcli\\ndotnet add package Microsoft.Azure.WebJobs.Extensions.DurableTask\\n\\u0060\\u0060\\u0060\\n###
        Getting started\\n## Samples\\nView the [complete list](https://learn.microsoft.com/en-us/samples/browse/?products=azure-functions\\u0026languages=csharp)
        of Azure Functions samples.\",\"contentUrl\":\"https://learn.microsoft.com/dotnet/api/overview/azure/functions?view=azure-dotnet#overview\"},{\"title\":\"Get
        started with Azure Functions (programming-language-python)\",\"content\":\"#
        Get started with Azure Functions (programming-language-python)\\nAzure Functions
        lets you implement your system\\u0027s logic as event-driven, readily available
        blocks of code. These code blocks are called functions. This article helps
        you find the most useful Azure Functions content quickly. For more general
        information about Azure Functions, see the [Introduction to Azure Functions](https://learn.microsoft.com/azure/azure-functions/functions-overview).\\nChoose
        a programming language or hosted skills at the top of the article.\\n## Create
        your first function\\nComplete a quickstart article to create and deploy your
        first functions in less than five minutes.\\nYou can create your first function
        by using one of the following tools:\\n1. [Azure Developer CLI (azd)](https://learn.microsoft.com/azure/azure-functions/create-first-function-azure-developer-cli)\\n2.
        [Command line](https://learn.microsoft.com/azure/azure-functions/how-to-create-function-azure-cli)\\n3.
        [Visual Studio Code](https://learn.microsoft.com/azure/azure-functions/how-to-create-function-vs-code)\\n##
        Review end-to-end samples\\nThese sites let you browse existing functions
        reference projects and samples in your desired language:\\n1. [Awesome azd
        template library](https://azure.github.io/awesome-azd/?tags=functions\\u0026tags=python)\\n2.
        [Azure Functions samples in GitHub](https://github.com/search?q=topic%3Aazure-functions\\u002Borg%3AAzure-Samples\\u002Bfork%3Atrue\\u002Blanguage%3APython\\u002B\\u0026type=repositories)\\n3.
        [Azure samples browser](https://learn.microsoft.com/en-us/samples/browse/?expanded=azure\\u0026languages=python\\u0026products=azure-functions)\\n##
        Scenarios\\nHere are some common scenarios to help you get started:\\n1. [Process
        file uploads](https://learn.microsoft.com/azure/azure-functions/functions-scenarios#process-file-uploads)\\n2.
        [Real-time stream and event processing](https://learn.microsoft.com/azure/azure-functions/functions-scenarios#real-time-stream-and-event-processing)\\n3.
        [Build AI-enabled apps](https://learn.microsoft.com/azure/azure-functions/functions-scenarios#build-ai-enabled-apps)\\n4.
        [Run scheduled tasks](https://learn.microsoft.com/azure/azure-functions/functions-scenarios#run-scheduled-tasks)\\n5.
        [Build a scalable web API](https://learn.microsoft.com/azure/azure-functions/functions-scenarios#build-a-scalable-web-api)\\n6.
        [Build a serverless workflow](https://learn.microsoft.com/azure/azure-functions/functions-scenarios#build-a-serverless-workflow)\\n7.
        [Respond to database changes](https://learn.microsoft.com/azure/azure-functions/functions-scenarios#respond-to-database-changes)\\n8.
        [Create reliable message systems](https://learn.microsoft.com/azure/azure-functions/functions-scenarios#create-reliable-message-systems)\",\"contentUrl\":\"https://learn.microsoft.com/azure/azure-functions/functions-get-started\"},{\"title\":\"Azure
        Functions diagnostics overview\",\"content\":\"# Azure Functions diagnostics
        overview\\nWhen you\\u2019re running a function app, you want to be prepared
        for any issues that may arise, from 4xx errors to trigger failures. Azure
        Functions diagnostics is an intelligent and interactive experience to help
        you troubleshoot your function app with no configuration or extra cost. When
        you do run into issues with your function app, Azure Functions diagnostics
        points out what\\u2019s wrong. It guides you to the right information to more
        easily and quickly troubleshoot and resolve the issue. This article shows
        you the basics of how to use Azure Functions diagnostics to more quickly diagnose
        and solve common function app issues.\\n## Start Azure Functions diagnostics\\nTo
        start Azure Functions diagnostics:\\n1. Navigate to your function app in the
        [Azure portal](https://portal.azure.com).\\n2. Select **Diagnose and solve
        problems** to open Azure Functions diagnostics.\\n3. Choose a category that
        best describes the issue of your function app by using the keywords in the
        homepage tile. You can also type a keyword that best describes your issue
        in the search bar. For example, you could type \\u0060execution\\u0060 to
        see a list of diagnostic reports related to your function app execution and
        open them directly from the homepage.\\n ![Search for Azure Functions diagnostics.](https://learn.microsoft.com/azure/azure-functions/media/functions-diagnostics/functions-app-search-azure-functions-diagnostics.png)\\n##
        Use the Interactive interface\\nOnce you select a homepage category that best
        aligns with your function app\\u0027s problem, Azure Functions diagnostics\\u0027
        interactive interface, named Genie, can guide you through diagnosing and solving
        problem of your app. You can use the tile shortcuts provided by Genie to view
        the full diagnostic report of the problem category that you\\u0027re interested
        in. The tile shortcuts provide you a direct way of accessing your diagnostic
        metrics.\\n![Genie is Azure Functions diagnostics\\u0027 interface.](https://learn.microsoft.com/azure/azure-functions/media/functions-diagnostics/genie.png)\\nAfter
        selecting a tile, you can see a list of topics related to the issue described
        in the tile. These topics provide snippets of notable information from the
        full report. Select any of these topics to investigate the issues further.
        Also, you can select **View Full Report** to explore all the topics on a single
        page.\\n![Preview of diagnostic report](https://learn.microsoft.com/azure/azure-functions/media/functions-diagnostics/preview-of-diagnostic-report.png)\",\"contentUrl\":\"https://learn.microsoft.com/azure/azure-functions/functions-diagnostics\"},{\"title\":\"Get
