# Mutineer settings shared by bin/mutineer and direct mutineer runs; see
# the Mutation testing section of CONTRIBUTING.md.
framework: rspec
timeout: 60
capture_timeout: 1200
# Equivalent mutants. An id changes when its method changes, so recheck
# the entry when you edit one of these methods.
ignore:
