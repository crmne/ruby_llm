name: Issue assessment

on:
  issues:
    types: [opened, reopened]
  issue_comment:
    types: [created]
  discussion:
    types: [created]
  discussion_comment:
    types: [created]
  workflow_dispatch:
    inputs:
      kind:
        type: choice
        options: [issue, discussion]
        default: issue
      number:
        description: Issue or discussion number
        required: true
      dry_run:
        description: Preview without changing the report
        type: boolean
        default: true

permissions:
  contents: read
  issues: write
  discussions: write

concurrency:
  group: >-
    assessment-${{ github.event.discussion && 'discussion' || inputs.kind || 'issue' }}-${{ github.event.issue.number || github.event.discussion.number || inputs.number }}-${{ github.event.discussion && (github.event.comment.parent_id || github.event.comment.id) || 'report' }}
  cancel-in-progress: false

jobs:
  assess:
    if: vars.COPILOT_ISSUE_ASSESSMENT_ENABLED == 'true' && (github.event.sender.type != 'Bot' || github.event_name == 'issues') && !github.event.issue.pull_request
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: crmne/copilot-triage@1a1d99705d3aca14a858bab6af45f17054f61763 # v0.5.0
        with:
          copilot-token: ${{ secrets.COPILOT_GITHUB_TOKEN }}
          kind: ${{ github.event.discussion && 'discussion' || inputs.kind || 'issue' }}
          number: ${{ github.event.issue.number || github.event.discussion.number || inputs.number }}
          dry-run: ${{ inputs.dry_run || false }}
