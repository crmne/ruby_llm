name: Issue assessment

on:
  issues:
    types: [opened, reopened, closed]
  issue_comment:
    types: [created]
  discussion:
    types: [created]
  discussion_comment:
    types: [created]
  pull_request_target:
    types: [opened, reopened, ready_for_review, synchronize, closed]
  pull_request_review:
    types: [submitted]
  workflow_dispatch:
    inputs:
      kind:
        type: choice
        options: [issue, discussion, pull_request]
        default: issue
      number:
        description: Issue, discussion, or pull request number
        required: true
      dry_run:
        description: Preview without changing the report
        type: boolean
        default: true

permissions:
  contents: read
  issues: write
  discussions: write
  pull-requests: write

# Copilot Triage's own workflow does the rest, and updates with its v0 tag.
jobs:
  triage:
    uses: crmne/copilot-triage/.github/workflows/assess.yml@v0
    secrets: inherit
    with:
      kind: ${{ inputs.kind || '' }}
      number: ${{ inputs.number || '' }}
      dry_run: ${{ inputs.dry_run || false }}
