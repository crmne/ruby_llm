name: Board

on:
  schedule:
    - cron: '17 6 * * *'
  workflow_dispatch:
    inputs:
      dry_run:
        description: Show where cards would go without moving them
        type: boolean
        default: true

permissions:
  contents: read
  pull-requests: write
  actions: write

# Copilot Triage's own workflow does the rest, and updates with its v0 tag.
jobs:
  sweep:
    uses: crmne/copilot-triage/.github/workflows/sweep.yml@v0
    secrets: inherit
    with:
      dry_run: ${{ inputs.dry_run || false }}
      triage_workflow: issue-assessment.yml
