name: _Test Matrix

on:
  workflow_call:
    inputs:
      bundler-cache:
        description: Enable Bundler cache
        required: false
        type: boolean
        default: false
      full:
        description: Run every Ruby and Rails pair, each with Faraday v1 too
        required: false
        type: boolean
        default: true
    secrets:
      CODECOV_TOKEN:
        required: false

permissions:
  contents: read

jobs:
  test:
    # No " / " in the name: GitHub joins the caller job id and this name with
    # " / ", then splits on it to build the checks tree, so an inner slash
    # hides everything before it (a bare "rails-7.1)" in the sidebar).
    name: Test (${{ matrix.ruby-version }}, ${{ matrix.rails-version }})
    runs-on: ubuntu-latest
    env:
      BUNDLE_PATH: vendor/bundle
      BUNDLE_DISABLE_SHARED_GEMS: "true"
      # Specs run short snippets once, so JRuby's startup mode beats its optimizing JIT.
      JRUBY_OPTS: ${{ startsWith(matrix.ruby-version, 'jruby') && '--dev' || '' }}
    strategy:
      fail-fast: false
      matrix:
        # Pull requests test the oldest and newest Ruby and Rails; main tests every pair.
        ruby-version: ${{ fromJSON(inputs.full && '["3.2", "3.3", "3.4", "4.0", "jruby-10.0.2.0"]' || '["3.2", "4.0", "jruby-10.0.2.0"]') }}
        rails-version: ${{ fromJSON(inputs.full && '["rails-7.1", "rails-7.2", "rails-8.0", "rails-8.1"]' || '["rails-7.1", "rails-8.1"]') }}
        exclude:
          - ruby-version: "jruby-10.0.2.0"
            rails-version: "rails-8.1"
          - ruby-version: "jruby-10.0.2.0"
            rails-version: "rails-8.0"
          - ruby-version: "jruby-10.0.2.0"
            rails-version: "rails-7.2"

    steps:
      - uses: actions/checkout@v7

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: ${{ matrix.ruby-version }}
          bundler-cache: ${{ inputs.bundler-cache }}

      - name: Install dependencies
        run: |
          bundle install
          bundle exec appraisal generate
          bundle exec appraisal ${{ matrix.rails-version }} bundle install

      - name: Run eager-load guard (appraisal)
        run: bundle exec appraisal ${{ matrix.rails-version }} ruby -e "require 'ruby_llm'; Zeitwerk::Loader.eager_load_all"

      - name: Run tests
        if: matrix.ruby-version != '4.0' || matrix.rails-version != 'rails-8.1'
        run: bundle exec appraisal ${{ matrix.rails-version }} bin/rspec-queue
        env:
          SPEC_OPTS: --tag ~generator
          SKIP_COVERAGE: true

      - name: Run full test suite with coverage (latest Ruby/Rails)
        if: matrix.ruby-version == '4.0' && matrix.rails-version == 'rails-8.1'
        run: bundle exec appraisal ${{ matrix.rails-version }} bin/rspec-queue

      - name: Upload coverage to Codecov
        if: matrix.ruby-version == '4.0' && matrix.rails-version == 'rails-8.1'
        uses: codecov/codecov-action@v5
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
        with:
          files: ./coverage/coverage.xml
          fail_ci_if_error: false

      - name: Run the test suite with Faraday v1
        if: >-
          matrix.ruby-version != '4.0' &&
          (inputs.full || (matrix.ruby-version == '3.2' && matrix.rails-version == 'rails-7.1'))
        run: |
          bundle install
          bundle exec appraisal ${{ matrix.rails-version }} bundle update faraday faraday-retry
          bundle exec appraisal ${{ matrix.rails-version }} bin/rspec-queue
        env:
          FARADAY_VERSION: '1.10.3'
          SPEC_OPTS: --tag ~generator
          SKIP_COVERAGE: true

  sandbox:
    name: Sandbox (${{ matrix.backend }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        backend: [bubblewrap, landlock]
    env:
      RUBYLLM_SANDBOX_BACKEND: ${{ matrix.backend }}
      RUBYLLM_REQUIRE_SANDBOX: "true"
      SKIP_COVERAGE: true
    steps:
      - uses: actions/checkout@v7

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "4.0"
          bundler-cache: ${{ inputs.bundler-cache }}

      - name: Install dependencies
        if: ${{ !inputs.bundler-cache }}
        run: bundle install

      # Ubuntu 24.04 lets only programs with an AppArmor profile create
      # user namespaces, and Bubblewrap needs one.
      - name: Allow Bubblewrap
        if: matrix.backend == 'bubblewrap'
        run: |
          sudo apt-get update
          sudo apt-get install -y bubblewrap slirp4netns iptables util-linux
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0

      - name: Run the sandbox specs
        run: >-
          bundle exec rspec spec/ruby_llm/sandbox spec/ruby_llm/sandbox_spec.rb
          spec/ruby_llm/code_execution spec/ruby_llm/chat_code_execution_spec.rb
          spec/ruby_llm/chat_code_execution_escalation_spec.rb spec/ruby_llm/agent_code_execution_spec.rb
          spec/ruby_llm/chat_skills_sandbox_spec.rb spec/ruby_llm/chat_file_store_sandbox_spec.rb

  mcp-conformance:
    name: MCP conformance
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "4.0"
          bundler-cache: ${{ inputs.bundler-cache }}

      - name: Install dependencies
        if: ${{ !inputs.bundler-cache }}
        run: bundle install

      - uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Run the official MCP client conformance suite
        run: bundle exec rake conformance
