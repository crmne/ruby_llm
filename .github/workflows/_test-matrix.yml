name: _Test Matrix

on:
  workflow_call:
    inputs:
      bundler-cache:
        description: Enable Bundler cache
        required: false
        type: boolean
        default: false
    secrets:
      CODECOV_TOKEN:
        required: false

permissions:
  contents: read

jobs:
  migration-adapters:
    name: Migration adapters (PostgreSQL, MySQL)
    runs-on: ubuntu-latest
    env:
      BUNDLE_PATH: vendor/bundle
      BUNDLE_DISABLE_SHARED_GEMS: "true"
      RUBY_LLM_POSTGRES_URL: postgresql://postgres:postgres@127.0.0.1:5432/ruby_llm_test
      RUBY_LLM_MYSQL_URL: mysql2://root:mysql@127.0.0.1:3306/ruby_llm_test
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: ruby_llm_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: mysql
          MYSQL_DATABASE: ruby_llm_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd "mysqladmin ping -h localhost -pmysql"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v6

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "4.0"
          bundler-cache: ${{ inputs.bundler-cache }}

      - name: Install dependencies
        run: |
          bundle install
          bundle exec appraisal rails-8.1 bundle install

      - name: Test migrations on supported adapters
        run: >-
          bundle exec appraisal rails-8.1 rspec
          spec/ruby_llm/generators/upgrade_migration_adapters_spec.rb

      - name: Install RubyLLM 1.16 for online upgrade tests
        run: gem install ruby_llm --version 1.16.0 --no-document --install-dir "$RUNNER_TEMP/ruby-llm-1.16"

      - name: Test live 1.16 writes and version switches on PostgreSQL and MySQL
        env:
          RUBY_LLM_LEGACY_GEM_HOME: ${{ runner.temp }}/ruby-llm-1.16
        run: |
          for database_url in "$RUBY_LLM_POSTGRES_URL" "$RUBY_LLM_MYSQL_URL"; do
            RUBY_LLM_COMPATIBILITY_URL="$database_url" bundle exec appraisal rails-8.1 rspec \
              spec/ruby_llm/generators/upgrade_migration_spec.rb
          done

  test:
    # No " / " in the name: GitHub joins the caller job id and this name with
    # " / ", then splits on it to build the checks tree, so an inner slash
    # hides everything before it (a bare "rails-7.1)" in the sidebar).
    name: Test (${{ matrix.ruby-version }}, ${{ matrix.rails-version }})
    runs-on: ubuntu-latest
    env:
      BUNDLE_PATH: vendor/bundle
      BUNDLE_DISABLE_SHARED_GEMS: "true"
    strategy:
      fail-fast: false
      matrix:
        ruby-version: ["3.1", "3.2", "3.3", "3.4", "4.0", "jruby-10.0.2.0"]
        rails-version: ["rails-7.1", "rails-7.2", "rails-8.0", "rails-8.1"]
        exclude:
          - ruby-version: "3.1"
            rails-version: "rails-8.0"
          - ruby-version: "3.1"
            rails-version: "rails-8.1"
          - ruby-version: "jruby-10.0.2.0"
            rails-version: "rails-8.1"
          - ruby-version: "jruby-10.0.2.0"
            rails-version: "rails-8.0"
          - ruby-version: "jruby-10.0.2.0"
            rails-version: "rails-7.2"

    steps:
      - uses: actions/checkout@v6

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: ${{ matrix.ruby-version }}
          bundler-cache: ${{ inputs.bundler-cache }}

      - name: Install dependencies
        run: |
          bundle install
          bundle exec appraisal generate
          bundle exec appraisal ${{ matrix.rails-version }} bundle install

      - name: Run eager-load guard (appraisal)
        run: bundle exec appraisal ${{ matrix.rails-version }} ruby -e "require 'ruby_llm'; Zeitwerk::Loader.eager_load_all"

      - name: Run tests
        if: matrix.ruby-version != '4.0' || matrix.rails-version != 'rails-8.1'
        run: bundle exec appraisal ${{ matrix.rails-version }} bin/rspec-queue
        env:
          SPEC_OPTS: --tag ~generator
          SKIP_COVERAGE: true

      - name: Install RubyLLM 1.16 for upgrade compatibility tests
        if: matrix.ruby-version == '4.0' && matrix.rails-version == 'rails-8.1'
        run: gem install ruby_llm --version 1.16.0 --no-document --install-dir "$RUNNER_TEMP/ruby-llm-1.16"

      - name: Run full test suite with coverage (latest Ruby/Rails)
        if: matrix.ruby-version == '4.0' && matrix.rails-version == 'rails-8.1'
        run: bundle exec appraisal ${{ matrix.rails-version }} bin/rspec-queue
        env:
          RUBY_LLM_LEGACY_GEM_HOME: ${{ runner.temp }}/ruby-llm-1.16

      - name: Upload coverage to Codecov
        if: matrix.ruby-version == '4.0' && matrix.rails-version == 'rails-8.1'
        uses: codecov/codecov-action@v5
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
        with:
          files: ./coverage/coverage.xml
          fail_ci_if_error: false

      - name: Run the test suite with Faraday v1
        if: matrix.ruby-version != '4.0'
        run: |
          FARADAY_VERSION=1.10.3 bundle install
          bundle exec appraisal ${{ matrix.rails-version }} bundle install
          bundle exec appraisal ${{ matrix.rails-version }} bin/rspec-queue
        env:
          SPEC_OPTS: --tag ~generator
          SKIP_COVERAGE: true
