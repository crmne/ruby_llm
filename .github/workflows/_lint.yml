name: _Lint

on:
  workflow_call:
    inputs:
      ruby-version:
        description: Ruby version for linting
        required: false
        type: string
        default: "4.0"
      working-directory:
        description: Directory to run bundler/rubocop in
        required: false
        type: string
        default: "."
      bundler-cache:
        description: Enable Bundler cache
        required: false
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  lint:
    name: Lint (RuboCop, ArchSpec)
    runs-on: ubuntu-latest
    env:
      BUNDLE_PATH: vendor/bundle
      BUNDLE_DISABLE_SHARED_GEMS: "true"
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 1

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: ${{ inputs.ruby-version }}
          bundler-cache: ${{ inputs.bundler-cache }}
          working-directory: ${{ inputs.working-directory }}

      - name: Install dependencies
        working-directory: ${{ inputs.working-directory }}
        run: bundle install

      - name: Run RuboCop
        working-directory: ${{ inputs.working-directory }}
        run: bundle exec rubocop

      - name: Run ArchSpec
        working-directory: ${{ inputs.working-directory }}
        run: bundle exec archspec check
