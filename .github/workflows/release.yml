name: Release

on:
  release:
    types: [published]

permissions:
  contents: read

concurrency:
  group: release-${{ github.event.release.tag_name }}
  cancel-in-progress: false

jobs:
  validate:
    name: Validate release
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      commit: ${{ steps.version.outputs.commit }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "4.0"

      - name: Verify release tag and version
        id: version
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
          RELEASE_PRERELEASE: ${{ github.event.release.prerelease }}
        shell: bash
        run: |
          set -euo pipefail
          version=$(ruby -r ./lib/ruby_llm/version -e 'puts RubyLLM::VERSION')
          if [ "$RELEASE_TAG" != "v$version" ]; then
            echo "Release tag $RELEASE_TAG does not match gem version $version." >&2
            exit 1
          fi

          commit=$(git rev-parse HEAD)
          tag_commit=$(git rev-parse --verify "refs/tags/$RELEASE_TAG^{commit}")
          if [ "$tag_commit" != "$commit" ]; then
            echo "The release tag moved after this workflow was triggered." >&2
            exit 1
          fi
          git merge-base --is-ancestor "$commit" origin/main

          prerelease=$(ruby -rrubygems/version -e 'puts Gem::Version.new(ARGV.fetch(0)).prerelease?' "$version")
          if [ "$prerelease" != "$RELEASE_PRERELEASE" ]; then
            echo "The GitHub prerelease setting does not match gem version $version." >&2
            exit 1
          fi

          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "commit=$commit" >> "$GITHUB_OUTPUT"

  gitleaks:
    needs: [validate]
    uses: ./.github/workflows/_gitleaks.yml

  lint:
    needs: [validate]
    uses: ./.github/workflows/_lint.yml
    with:
      ruby-version: "4.0"
      bundler-cache: true

  test:
    needs: [validate, gitleaks, lint]
    uses: ./.github/workflows/_test-matrix.yml
    with:
      bundler-cache: true
    secrets: inherit

  publish:
    name: Build and publish
    needs: [validate, test]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    env:
      BUNDLE_PATH: vendor/bundle
      BUNDLE_DISABLE_SHARED_GEMS: "true"
      GEM_VERSION: ${{ needs.validate.outputs.version }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ needs.validate.outputs.commit }}

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "4.0"
          bundler-cache: true

      - name: Verify cassettes are fresh
        run: bundle exec rake release:verify_cassettes

      - name: Build gem
        run: gem build ruby_llm.gemspec --output "ruby_llm-${GEM_VERSION}.gem"

      - name: Publish to GitHub Packages
        env:
          GEM_HOST_API_KEY: "Bearer ${{ secrets.GITHUB_TOKEN }}"
          OWNER: ${{ github.repository_owner }}
        shell: bash
        run: |
          set -euo pipefail
          output=$(gem push --host "https://rubygems.pkg.github.com/${OWNER}" "ruby_llm-${GEM_VERSION}.gem" 2>&1) || {
            echo "$output"
            if echo "$output" | grep -qi "already been pushed"; then
              exit 0
            fi
            exit 1
          }
          echo "$output"

      - name: Publish to RubyGems
        env:
          GEM_HOST_API_KEY: ${{ secrets.RUBYGEMS_AUTH_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "$GEM_HOST_API_KEY" ]; then
            echo "RUBYGEMS_AUTH_TOKEN is not configured." >&2
            exit 1
          fi
          output=$(gem push --host https://rubygems.org "ruby_llm-${GEM_VERSION}.gem" 2>&1) || {
            echo "$output"
            if echo "$output" | grep -qi "Repushing of gem versions is not allowed"; then
              exit 0
            fi
            exit 1
          }
          echo "$output"
