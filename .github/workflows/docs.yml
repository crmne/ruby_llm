name: Deploy docs

on:
  release:
    types: [published]
  schedule:
    - cron: '17 */6 * * *'
  push:
    branches: [main]
    paths:
      - 'docs/**'
      - 'lib/**'
      - '.rdoc_options'
      - '.github/workflows/docs.yml'
      - 'Rakefile'
      - 'tasks/**'
  workflow_dispatch:
    inputs:
      refresh_model_registry:
        description: Refresh the model registry from upstream sources before deploying
        required: false
        type: boolean
        default: false
      allow_model_registry_drop:
        description: Accept reviewed model count drops while refreshing the registry
        required: false
        type: boolean
        default: false

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      deploy: ${{ steps.registry.outputs.deploy }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0 # Build release tags alongside main, including on release events.

      - name: Setup Ruby for models guide generation (root Gemfile)
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'
          bundler-cache: true

      - name: Select or refresh the published model registry
        id: registry
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          AZURE_API_BASE: ${{ secrets.AZURE_API_BASE }}
          AZURE_API_KEY: ${{ secrets.AZURE_API_KEY }}
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_REGION: ${{ secrets.AWS_REGION }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_SESSION_TOKEN: ${{ secrets.AWS_SESSION_TOKEN }}
          COHERE_API_KEY: ${{ secrets.COHERE_API_KEY }}
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GOOGLE_CLOUD_LOCATION: ${{ secrets.GOOGLE_CLOUD_LOCATION }}
          GOOGLE_CLOUD_PROJECT: ${{ secrets.GOOGLE_CLOUD_PROJECT }}
          MISTRAL_API_KEY: ${{ secrets.MISTRAL_API_KEY }}
          OLLAMA_CLOUD_API_KEY: ${{ secrets.OLLAMA_CLOUD_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          PERPLEXITY_API_KEY: ${{ secrets.PERPLEXITY_API_KEY }}
          TYPESAFE_API_KEY: ${{ secrets.TYPESAFE_API_KEY }}
          VERTEXAI_SERVICE_ACCOUNT_KEY: ${{ secrets.VERTEXAI_SERVICE_ACCOUNT_KEY }}
          XAI_API_KEY: ${{ secrets.XAI_API_KEY }}
          REFRESH_MODEL_REGISTRY: ${{ github.event_name == 'schedule' || inputs.refresh_model_registry || inputs.allow_model_registry_drop }}
          ALLOW_MODEL_REGISTRY_DROP: ${{ inputs.allow_model_registry_drop && 'true' || 'false' }}
        run: |
          registry="$RUNNER_TEMP/ruby-llm-models.json"
          if ! curl --fail --silent --show-error --retry 3 \
            https://rubyllm.com/models.json --output "$registry"; then
            cp lib/ruby_llm/models.json "$registry"
          fi

          if ! bundle exec ruby -Ilib -e '
            require "ruby_llm"
            require "json_schemer"
            data = JSON.parse(File.read(ARGV.fetch(0)))
            registry_schema = {
              "$schema" => "https://json-schema.org/draft/2020-12/schema",
              "type" => "array",
              "minItems" => 1,
              "items" => RubyLLM::Models::Schema.json_schema
            }
            errors = JSONSchemer.schema(registry_schema).validate(data).first(5).map do |error|
              "#{error["data_pointer"]}: #{error["error"]}"
            end
            abort(errors.join("\n")) unless errors.empty?
            providers = data.map { |model| model.fetch("provider") }.uniq
            additions = JSON.parse(File.read("lib/ruby_llm/models.json")).reject do |model|
              providers.include?(model.fetch("provider"))
            end
            File.write(ARGV.fetch(0), JSON.pretty_generate(data + additions) + "\n") unless additions.empty?
          ' "$registry"; then
            cp lib/ruby_llm/models.json "$registry"
          fi

          deploy=true
          if [ "$REFRESH_MODEL_REGISTRY" = "true" ]; then
            before="$(sha256sum "$registry" | cut -d ' ' -f 1)"
            MODEL_REGISTRY_FILE="$registry" bundle exec rake models:update
            after="$(sha256sum "$registry" | cut -d ' ' -f 1)"
            if [ "${{ github.event_name }}" = "schedule" ] && [ "$before" = "$after" ]; then
              deploy=false
            fi
          fi

          echo "file=$registry" >> "$GITHUB_OUTPUT"
          echo "deploy=$deploy" >> "$GITHUB_OUTPUT"

      - name: Install libvips for social cards (only if missing)
        if: steps.registry.outputs.deploy == 'true'
        run: |
          if command -v vips >/dev/null 2>&1; then
            echo "libvips already available: $(vips --version)"
          else
            sudo apt-get update -qq
            sudo apt-get install -y --no-install-recommends libvips-tools
          fi

      - name: Setup Ruby for Jekyll build (docs Gemfile)
        if: steps.registry.outputs.deploy == 'true'
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'
          bundler-cache: true
          working-directory: docs
          cache-version: 3
      - name: Setup Pages
        if: steps.registry.outputs.deploy == 'true'
        id: pages
        uses: actions/configure-pages@v5

      - name: Build stable, next, and 1.x documentation
        if: steps.registry.outputs.deploy == 'true'
        run: docs/bin/build-versions.sh
        env:
          JEKYLL_ENV: production
          BASE: ${{ steps.pages.outputs.base_path }}
          MODEL_REGISTRY_FILE: ${{ steps.registry.outputs.file }}

      - name: Upload artifact
        if: steps.registry.outputs.deploy == 'true'
        uses: actions/upload-pages-artifact@v4
        with:
          path: docs/_site

  deploy:
    if: needs.build.outputs.deploy == 'true'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
