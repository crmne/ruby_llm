groups:
  - id: registry.ruby_llm.workflow
    type: attribute_group
    brief: RubyLLM workflow identity.
    attributes:
      - id: ruby_llm.workflow.id
        type: string
        stability: development
        brief: The workflow identifier supplied by the application or generated by RubyLLM.
        examples: [workflow-42]
      - id: ruby_llm.workflow.step.id
        type: string
        stability: development
        brief: The step identifier supplied by the application or generated by RubyLLM.
        examples: [step-42]
      - id: ruby_llm.workflow.step.name
        type: string
        stability: development
        brief: The name of the workflow step.
        examples: [Summarize]
  - id: registry.ruby_llm.code_execution
    type: attribute_group
    brief: RubyLLM code execution runs.
    attributes:
      - id: ruby_llm.code_execution.language
        type: string
        stability: development
        brief: The language the code ran in.
        examples: [ruby, shell]
      - id: ruby_llm.code_execution.exit_code
        type: int
        stability: development
        brief: The exit code of the run.
        examples: [0, 2]
      - id: ruby_llm.code_execution.timed_out
        type: boolean
        stability: development
        brief: Whether the run hit its timeout.
      - id: ruby_llm.code_execution.duration
        type: double
        stability: development
        brief: How long the run took, in seconds.
        examples: [0.42]
