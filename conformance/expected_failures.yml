client:
  # Servers asking for input or resuming streams mid-request belong to the
  # 2025 revisions; RubyLLM declares no capabilities to older servers.
  - elicitation-sep1034-client-defaults
  - sse-retry
  # RubyLLM speaks one modern revision, so it has no other to retry with.
  - request-metadata
  # Authorization extensions RubyLLM does not implement.
  - auth/client-credentials-jwt
  - auth/client-credentials-basic
  - auth/enterprise-managed-authorization
  - auth/dpop
  - auth/dpop-nonce
  - auth/wif-jwt-bearer
