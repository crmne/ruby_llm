# yaml-language-server: $schema=https://coderabbit.ai/integrations/schema.v2.json
reviews:
  profile: chill
  request_changes_workflow: true
  path_instructions:
    - path: "lib/**"
      instructions: >-
        Check every new or renamed public name (class, method, keyword
        argument, configuration option, callback, or column in RubyLLM's own
        tables) against Public API rules in AGENTS.md. Flag a predicate or
        narrower list that only filters something the API already returns
        (`awaiting_approval?` or `pending_approvals` next to
        `pending_questions`); a second verb for an outcome an existing verb
        already reaches (`deny` next to `decline`); a new concept or class
        where a pattern composed from the public API would do (a subagent is
        an agent wrapped in a tool); and state held in an object's memory
        across calls instead of in the application's records or RubyLLM's
        tables. A removed public name needs a row with its exact replacement
        in docs/_reference/upgrading.md.
    - path: "api.txt"
      instructions: >-
        This file lists the public API and is generated by `rake api:dump`.
        Call out every added, changed, or removed line in the review summary
        as a public API change that needs the maintainer's explicit approval
        before merging, and check each new line against Public API rules in
        AGENTS.md.
  pre_merge_checks:
    custom_checks:
      - name: Review evidence stays out of the repository
        mode: error
        instructions: >-
          Fail when the pull request adds screenshots, captures, comparison
          pages, recordings, or other files made to show reviewers the change,
          such as a folder of before-and-after images or an HTML comparison
          page. That evidence belongs in the pull request description or
          comments. Media the project itself uses, such as a documentation
          figure a page shows, a release-note image, or an app asset, is
          fine. Pass when the pull request adds no review evidence.
      - name: Dependencies from sources the maintainer controls
        mode: error
        instructions: >-
          Fail when the pull request makes a dependency come from anywhere but
          its package registry or a repository under github.com/crmne/ or
          this repository's own organization: a git URL, a contributor's
          fork, a patch, override, or replace entry, or another registry, in
          a manifest, lockfile, or package manager configuration. Pass
          otherwise.
