title: RubyLLM
description: 'RubyLLM is the Ruby-native AI framework for chats, tools, agents, RAG, multimodal workflows, and Rails apps, with 17 providers and a generator for custom ones.'
tagline: Build AI features the Ruby way
url: https://rubyllm.com
baseurl: /
lang: en-US
locale: en_US
timezone: Europe/Berlin
repository: crmne/ruby_llm

theme: jekyll-vitepress-theme

markdown: kramdown
kramdown:
  input: GFM
  syntax_highlighter_opts:
    block:
      line_numbers: false
permalink: pretty

collections:
  getting_started:
    permalink: "/:name/"
    output: true
  core_features:
    permalink: "/:name/"
    output: true
  advanced:
    permalink: "/:name/"
    output: true
  reference:
    permalink: "/:name/"
    output: true

# Configure Just the Docs collections

defaults:
  - scope:
      path: ""
    values:
      layout: default
      jekyll_vitepress:
        auto_title: false
  - scope:
      path: ""
      type: getting_started
    values:
      layout: default
  - scope:
      path: ""
      type: core_features
    values:
      layout: default
  - scope:
      path: ""
      type: advanced
    values:
      layout: default
  - scope:
      path: ""
      type: reference
    values:
      layout: default

jekyll_vitepress:
  seo:
    page_type: TechArticle
    image:
      path: /assets/images/logotype.jpg
      alt: RubyLLM
      width: 579
      height: 200
    publisher:
      type: Organization
      name: RubyLLM
      url: https://rubyllm.com
      logo: /assets/images/favicon/web-app-manifest-512x512.png
      same_as:
        - https://github.com/crmne/ruby_llm
        - https://rubygems.org/gems/ruby_llm
        - https://github.com/sponsors/crmne
  llms:
    title: RubyLLM Documentation
    description: >-
      Developer documentation for RubyLLM, the Ruby-native AI framework for
      chats, tools, agents, RAG, multimodal workflows, and Rails applications.
    full: true
    details: >-
      The canonical docs cover installation, configuration, providers, core
      features, agents, Rails integration, and the complete reference. Also
      available: the [API reference Markdown index](https://rubyllm.com/api/index.md),
      the live [model registry as JSON](https://rubyllm.com/models.json),
      the [source](https://github.com/crmne/ruby_llm), and the
      [RubyGems package](https://rubygems.org/gems/ruby_llm).
  branding:
    site_title: false
    logo:
      default: "/assets/images/logotype.svg"
      light: "/assets/images/logotype.svg"
      dark: "/assets/images/logotype_dark.svg"
      alt: RubyLLM
      width: 150
      height: 32
  typography:
    body_font_family: "'Inter', ui-sans-serif, system-ui, -apple-system, 'Segoe UI',
      sans-serif"
    code_font_family: "'IBM Plex Mono', ui-monospace, monospace"
    google_fonts_url: "https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:ital,wght@0,400;0,500;0,700;1,400;1,500;1,700&family=Inter:ital,wght@0,300;0,400;0,500;0,600;0,700;0,900;1,300;1,400;1,500;1,600;1,700;1,900&family=Lora:wght@400;500;600;700&display=swap"
  syntax:
    light_theme: rubyllm.light
    dark_theme: rubyllm.dark
  tokens:
    light:
      "--vp-c-brand-1": "#B30000"
      "--vp-c-brand-2": "#C9271E"
      "--vp-c-brand-3": "#9D0006"
      "--vp-c-brand-soft": rgba(201, 39, 30, 0.14)
      "--vp-c-bg": "#f7f3f1"
      "--vp-c-bg-alt": "#F3ECE7"
      "--vp-c-bg-soft": "#F3ECE7"
      "--vp-c-bg-elv": "#FAF9F7"
      "--vp-c-border": "#E0D9D5"
      "--vp-c-text-1": "#2C2926"
      "--vp-c-text-2": "#5C5353"
      "--vp-c-text-3": "#796B67"
      "--vp-c-default-1": "#F3ECE7"
      "--vp-c-default-2": "#E0D9D5"
      "--vp-c-default-3": "#D7CDC7"
      "--vp-c-divider": "#E0D9D5"
      "--vp-c-gutter": "#E0D9D5"
      "--vp-nav-logo-height": 32px
      "--vp-home-hero-name-color": var(--vp-c-brand-1)
      "--vp-home-hero-name-background": 'linear-gradient(120deg, #e24a2f 28%, #9f1406
        78%)'
    dark:
      "--vp-c-brand-1": "#FF433D"
      "--vp-c-brand-2": "#D52E2A"
      "--vp-c-brand-3": "#C9271E"
      "--vp-c-brand-soft": rgba(255, 67, 61, 0.18)
      "--vp-c-bg": "#1B1B1A"
      "--vp-c-bg-alt": "#181817"
      "--vp-c-bg-soft": "#232323"
      "--vp-c-bg-elv": "#232323"
      "--vp-c-border": "#30302F"
      "--vp-c-text-1": "#D3CECA"
      "--vp-c-text-2": "#9D9995"
      "--vp-c-text-3": "#7E7975"
      "--vp-c-default-1": "#232323"
      "--vp-c-default-2": "#2B2928"
      "--vp-c-default-3": "#30302F"
      "--vp-c-divider": "#30302F"
      "--vp-c-gutter": "#30302F"
      "--vp-nav-logo-height": 32px
      "--vp-home-hero-name-color": var(--vp-c-brand-1)
      "--vp-home-hero-name-background": 'linear-gradient(120deg, #ff433d 28%, #c9271e
        76%)'
  github_star:
    enabled: true
    repository: crmne/ruby_llm
    text: Star
    show_count: true
  gem_downloads:
    enabled: true
    name: ruby_llm
    text: Gem downloads
    url: https://clickgems.clickhouse.com/dashboard/ruby_llm
    label: View RubyLLM gem downloads
    show_count: true
  github_trending:
    enabled: true
    text: GitHub trending
    value: "#1 repo of the day"
    url: https://trendshift.io/repositories/13640
    label: View RubyLLM GitHub trending history
  github_sponsor:
    enabled: true
    user: crmne
    text: Support
    label: Support RubyLLM on GitHub Sponsors
  footer:
    # The homepage draws its own footer in _includes/home.html, and this one
    # renders on the homepage only, so enabling it would print both.
    enabled: false
    show_on_docs: false
    message: >-
      Brought to you by <a href="https://paolino.me" target="_blank" rel="noreferrer">Carmine Paolino</a>, maker of
    copyright: >-
      <span class="footer-brand-links"><a class="footer-chatwithwork-link" href="https://chatwithwork.com" target="_blank" rel="noreferrer"><img class="footer-chatwithwork-logo" src="https://chatwithwork.com/logotype.svg" alt="Chat with Work"></a></span><br><span class="footer-built-with">Docs built with <a href="https://jekyll-vitepress.dev" target="_blank" rel="noreferrer">Jekyll VitePress</a>.</span>
  doc_footer:
    enabled: true
    previous_label: Previous page
    next_label: Next page
  last_updated:
    enabled: true
    text: Last updated
    format: "%-d %b %Y, %H:%M"
  labels:
    outline: On this page
    sidebar_menu: Menu
    return_to_top: Return to top
    skip_to_content: Skip to content
    appearance_menu: Appearance
    switch_to_dark: Switch to dark theme
    switch_to_light: Switch to light theme
  behavior:
    scroll_offset: 134
  edit_link:
    enabled: true
    pattern: https://github.com/crmne/ruby-llm-docs/edit/main/:path
    text: Edit page on Github

plugins:
  - jekyll-og-image
  - jekyll-redirect-from
  - jekyll-vitepress-theme


exclude:
  - bin
  - vendor
  - Gemfile
  - Gemfile.lock
  - README.md

twitter:
  username: paolino
  card: summary_large_image

social:
  name: RubyLLM
  links:
    - https://github.com/crmne/ruby_llm
    - https://rubygems.org/gems/ruby_llm
    - https://github.com/sponsors/crmne

author:
  type: Organization
  name: RubyLLM
  url: https://rubyllm.com
  twitter: paolino

# Jekyll uses Dart Sass; suppress deprecations emitted by upstream theme styles.

og_image:
  output_dir: "assets/images/og"
  force: true
  collections:
    - pages
    - getting_started
    - core_features
    - advanced
    - reference
  image:
    path: "assets/images/logotype.svg"
    width: 290
    height: 100
  domain: "rubyllm.com"
  header:
    prefix: "RubyLLM Docs: "
    font_family: "Plus Jakarta Sans, bold"
  content:
    font_family: "Inter, regular"
  metadata:
    fields:
      - description
  border_bottom:
    width: 20
    fill:
      - "#820C02"
      - "#A91401"
      - "#D51F06"
      - "#DE3F24"
      - "#EDA895"

# Model variables for documentation
# These are used throughout the docs to ensure consistency
# and make it easy to update model names in one place

models:
  # Default models for basic examples
  default_chat: "gpt-5-nano"
  default_embedding: "text-embedding-3-small"
  default_image: "gpt-image-1.5"
  default_speech: "gpt-4o-mini-tts"

  # OpenAI models
  openai_latest: "gpt-5.4"
  openai_current: "gpt-5-nano"
  openai_vision: "gpt-5.4"
  openai_tools: "gpt-5.4"
  openai_mini: "gpt-5-mini"
  openai_audio: "gpt-4o-audio-preview-2025-06-03"
  openai_speech: "gpt-4o-mini-tts"
  openai_legacy: "gpt-3.5-turbo" # schema unsupported
  openai_standard: "gpt-5.4"

  # Anthropic models
  anthropic_server_tools: "claude-sonnet-5"
  anthropic_latest: "claude-sonnet-4-6"
  anthropic_current: "claude-sonnet-4-6"
  anthropic_newest: "claude-sonnet-4-6"
  anthropic_opus: "claude-opus-4-6"

  # Google models
  gemini_latest: "gemini-3.1-pro-preview"
  gemini_current: "gemini-3.1-pro-preview"
  gemini_current_latest: "gemini-3.1-pro-preview"

  # Embedding models
  embedding_small: "text-embedding-3-small"
  embedding_large: "text-embedding-3-large"
  embedding_google: "text-embedding-004"

  # Image generation models
  image_openai: "gpt-image-1.5"
  image_dalle: "dall-e-3"
  image_google: "imagen-3.0-generate-002"

  # Speech generation models
  speech_openai: "gpt-4o-mini-tts"
  speech_google: "gemini-2.5-flash-preview-tts"

  # Local/Other models
  local_llama: "llama-3"

  # Model categories for different use cases
  best_for_code: "gpt-5.4"
  best_for_creative: "claude-opus-4-6"
  best_for_factual: "gemini-3.1-pro-preview"
  best_for_vision: "gpt-5.4"
  best_for_audio: "gpt-4o-audio-preview-2025-06-03"
  best_for_tools: "gpt-5.4"
  best_for_budget: "gemini-3-flash-preview"
