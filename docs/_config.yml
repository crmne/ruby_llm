title: RubyLLM
description: 'RubyLLM: a delightful Ruby AI framework for every major provider. Switch models without rewriting your code. Agents, Tools, RAG, Agentic Workflows, at home in Rails.'
tagline: Build AI features the Ruby way
url: https://rubyllm.com
baseurl: /
lang: en-US
locale: en_US
timezone: Europe/Berlin
repository: crmne/ruby_llm

theme: jekyll-vitepress-theme

markdown: kramdown
kramdown:
  input: GFM
  syntax_highlighter_opts:
    block:
      line_numbers: false
permalink: pretty

collections:
  getting_started:
    permalink: "/:name/"
    output: true
  core_features:
    permalink: "/:name/"
    output: true
  advanced:
    permalink: "/:name/"
    output: true
  reference:
    permalink: "/:name/"
    output: true

# Configure Just the Docs collections

defaults:
  - scope:
      path: ""
    values:
      layout: default
      jekyll_vitepress:
        auto_title: false
  - scope:
      path: ""
      type: getting_started
    values:
      layout: default
  - scope:
      path: ""
      type: core_features
    values:
      layout: default
  - scope:
      path: ""
      type: advanced
    values:
      layout: default
  - scope:
      path: ""
      type: reference
    values:
      layout: default

jekyll_vitepress:
  branding:
    site_title: false
    logo:
      default: "/assets/images/logotype.svg"
      light: "/assets/images/logotype.svg"
      dark: "/assets/images/logotype_dark.svg"
      alt: RubyLLM
      width: 150
      height: 32
  typography:
    body_font_family: "'Inter', ui-sans-serif, system-ui, -apple-system, 'Segoe UI',
      sans-serif"
    code_font_family: "'IBM Plex Mono', ui-monospace, monospace"
    google_fonts_url: "https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:ital,wght@0,400;0,500;0,700;1,400;1,500;1,700&family=Inter:ital,wght@0,300;0,400;0,500;0,600;0,700;0,900;1,300;1,400;1,500;1,600;1,700;1,900&family=Lora:wght@400;500;600;700&display=swap"
  syntax:
    light_theme: rubyllm.light
    dark_theme: rubyllm.dark
  tokens:
    light:
      "--vp-c-brand-1": "#B30000"
      "--vp-c-brand-2": "#C9271E"
      "--vp-c-brand-3": "#9D0006"
      "--vp-c-brand-soft": rgba(201, 39, 30, 0.14)
      "--vp-c-bg": "#f7f3f1"
      "--vp-c-bg-alt": "#F3ECE7"
      "--vp-c-bg-soft": "#F3ECE7"
      "--vp-c-bg-elv": "#FAF9F7"
      "--vp-c-border": "#E0D9D5"
      "--vp-c-text-1": "#2C2926"
      "--vp-c-text-2": "#5C5353"
      "--vp-c-text-3": "#796B67"
      "--vp-c-default-1": "#F3ECE7"
      "--vp-c-default-2": "#E0D9D5"
      "--vp-c-default-3": "#D7CDC7"
      "--vp-c-divider": "#E0D9D5"
      "--vp-c-gutter": "#E0D9D5"
      "--vp-nav-logo-height": 32px
      "--vp-home-hero-name-color": var(--vp-c-brand-1)
      "--vp-home-hero-name-background": 'linear-gradient(120deg, #e24a2f 28%, #9f1406
        78%)'
    dark:
      "--vp-c-brand-1": "#FF433D"
      "--vp-c-brand-2": "#D52E2A"
      "--vp-c-brand-3": "#C9271E"
      "--vp-c-brand-soft": rgba(255, 67, 61, 0.18)
      "--vp-c-bg": "#1B1B1A"
      "--vp-c-bg-alt": "#181817"
      "--vp-c-bg-soft": "#232323"
      "--vp-c-bg-elv": "#232323"
      "--vp-c-border": "#30302F"
      "--vp-c-text-1": "#D3CECA"
      "--vp-c-text-2": "#9D9995"
      "--vp-c-text-3": "#7E7975"
      "--vp-c-default-1": "#232323"
      "--vp-c-default-2": "#2B2928"
      "--vp-c-default-3": "#30302F"
      "--vp-c-divider": "#30302F"
      "--vp-c-gutter": "#30302F"
      "--vp-nav-logo-height": 32px
      "--vp-home-hero-name-color": var(--vp-c-brand-1)
      "--vp-home-hero-name-background": 'linear-gradient(120deg, #ff433d 28%, #c9271e
        76%)'
  github_star:
    enabled: true
    repository: crmne/ruby_llm
    text: Star
    show_count: true
  gem_downloads:
    enabled: true
    name: ruby_llm
    text: Gem downloads
    url: https://clickgems.clickhouse.com/dashboard/ruby_llm
    label: View RubyLLM gem downloads
    show_count: true
  github_trending:
    enabled: true
    text: GitHub trending
    value: "#1 repo of the day"
    url: https://trendshift.io/repositories/13640
    label: View RubyLLM GitHub trending history
  github_sponsor:
    enabled: true
    user: crmne
    text: Support
    label: Support RubyLLM on GitHub Sponsors
  footer:
    # The homepage draws its own footer in _includes/home.html, and this one
    # renders on the homepage only, so enabling it would print both.
    enabled: false
    show_on_docs: false
    message: >-
      Brought to you by <a href="https://paolino.me" target="_blank" rel="noreferrer">Carmine Paolino</a>, maker of
    copyright: >-
      <span class="footer-brand-links"><a class="footer-chatwithwork-link" href="https://chatwithwork.com" target="_blank" rel="noreferrer"><img class="footer-chatwithwork-logo" src="https://chatwithwork.com/logotype.svg" alt="Chat with Work"></a></span><br><span class="footer-built-with">Docs built with <a href="https://jekyll-vitepress.dev" target="_blank" rel="noreferrer">Jekyll VitePress</a>.</span>
  doc_footer:
    enabled: true
    previous_label: Previous page
    next_label: Next page
  last_updated:
    enabled: true
    text: Last updated
    format: "%-d %b %Y, %H:%M"
  labels:
    outline: On this page
    sidebar_menu: Menu
    return_to_top: Return to top
    skip_to_content: Skip to content
    appearance_menu: Appearance
    switch_to_dark: Switch to dark theme
    switch_to_light: Switch to light theme
  behavior:
    scroll_offset: 134
  edit_link:
    enabled: true
    pattern: https://github.com/crmne/ruby-llm-docs/edit/main/:path
    text: Edit page on Github

plugins:
  - jekyll-seo-tag
  - jekyll-sitemap
  - jekyll-og-image
  - jekyll-redirect-from
  - jekyll-ai-visible-content
  - jekyll-vitepress-theme


exclude:
  - bin
  - vendor
  - Gemfile
  - Gemfile.lock
  - README.md

twitter:
  username: paolino
  card: summary_large_image

social:
  name: RubyLLM
  links:
    - https://github.com/crmne/ruby_llm
    - https://rubygems.org/gems/ruby_llm
    - https://github.com/sponsors/crmne

author:
  type: Organization
  name: RubyLLM
  url: https://rubyllm.com
  twitter: paolino

ai_visible_content:
  enabled: true
  entity:
    type: Organization
    id_slug: ruby-llm
    name: RubyLLM
    alternate_names:
      - ruby_llm
      - Ruby LLM
    description: one consistent Ruby framework for chat, image generation, embeddings, speech generation, transcription, moderation, tools, agents, structured output, streaming, and Rails integration across OpenAI, Anthropic, Gemini, Bedrock, DeepSeek, Mistral, Ollama, OpenRouter, Perplexity, GPUStack, xAI, and OpenAI-compatible providers.
    image: /assets/images/logotype.svg
    same_as:
      - https://github.com/crmne/ruby_llm
      - https://rubygems.org/gems/ruby_llm
      - https://github.com/sponsors/crmne
    knows_about:
      - Ruby
      - Ruby on Rails
      - Large language models
      - AI agents
      - Retrieval augmented generation
      - Function calling
      - Structured output
      - Vector embeddings
      - Streaming AI responses
      - Multi-modal AI
      - OpenAI
      - Anthropic Claude
      - Google Gemini
      - AWS Bedrock
      - DeepSeek
      - Mistral AI
      - xAI
      - OpenRouter
      - Perplexity
      - Ollama
      - Vertex AI
      - GPUStack
      - OpenAI-compatible APIs
  json_ld:
    auto_inject: false
    include_website_schema: true
    include_breadcrumbs: true
    include_blog_posting: false
    include_faq: true
    include_how_to: true
    article_body: excerpt
    compact: true
  crawlers:
    allow_gptbot: true
    allow_perplexitybot: true
    allow_claudebot: true
    allow_googlebot: true
    allow_bingbot: true
    generate_robots_txt: true
  llms_txt:
    enabled: true
    title: RubyLLM Documentation
    description: Developer documentation for RubyLLM, a Ruby library for building AI applications with chat, agents, tools, embeddings, image generation, speech generation, audio transcription, moderation, streaming, and Rails integration.
    include_full_text: true
    markdown_urls: true
    sections:
      - heading: Canonical Resources
        content: |
          - Documentation: https://rubyllm.com
          - API reference Markdown index: https://rubyllm.com/api/index.md
          - Source code: https://github.com/crmne/ruby_llm
          - RubyGems package: https://rubygems.org/gems/ruby_llm
      - heading: Primary Topics
        content: |
          RubyLLM covers provider-agnostic AI application development in Ruby, including OpenAI, Anthropic, Gemini, Bedrock, DeepSeek, Mistral, Ollama, OpenRouter, Perplexity, GPUStack, xAI, OpenAI-compatible APIs, agents, tools, structured output, embeddings, image generation, speech generation, audio transcription, moderation, streaming, Rails integration, async workloads, model registry usage, and upgrade guidance.
  linking:
    enable_entity_links: false
    apply_to_metadata: false
    enable_related_posts: false
  validation:
    warn_name_inconsistency: false
    warn_missing_same_as: true
    warn_missing_dates: false
    warn_orphan_pages: false
    warn_missing_descriptions: true
    fail_build_on_error: false
    content_only: true
    verbose: false
    max_examples: 5

# Jekyll uses Dart Sass; suppress deprecations emitted by upstream theme styles.

og_image:
  output_dir: "assets/images/og"
  force: true
  collections:
    - pages
    - getting_started
    - core_features
    - advanced
    - reference
  image:
    path: "assets/images/logotype.svg"
    width: 290
    height: 100
  domain: "rubyllm.com"
  header:
    prefix: "RubyLLM Docs: "
    font_family: "Plus Jakarta Sans, bold"
  content:
    font_family: "Inter, regular"
  metadata:
    fields:
      - description
  border_bottom:
    width: 20
    fill:
      - "#820C02"
      - "#A91401"
      - "#D51F06"
      - "#DE3F24"
      - "#EDA895"

# Model variables for documentation
# These are used throughout the docs to ensure consistency
# and make it easy to update model names in one place

models:
  # Default models for basic examples
  default_chat: "gpt-5-nano"
  default_embedding: "text-embedding-3-small"
  default_image: "gpt-image-1.5"
  default_speech: "gpt-4o-mini-tts"

  # OpenAI models
  openai_latest: "gpt-5.4"
  openai_current: "gpt-5-nano"
  openai_vision: "gpt-5.4"
  openai_tools: "gpt-5.4"
  openai_mini: "gpt-5-mini"
  openai_audio: "gpt-4o-audio-preview"
  openai_speech: "gpt-4o-mini-tts"
  openai_legacy: "gpt-3.5-turbo" # schema unsupported
  openai_standard: "gpt-5.4"

  # Anthropic models
  anthropic_latest: "claude-sonnet-4-6"
  anthropic_current: "claude-sonnet-4-6"
  anthropic_newest: "claude-sonnet-4-6"
  anthropic_opus: "claude-opus-4-6"

  # Google models
  gemini_latest: "gemini-3.1-pro-preview"
  gemini_current: "gemini-3.1-pro-preview"
  gemini_current_latest: "gemini-3.1-pro-preview"

  # Embedding models
  embedding_small: "text-embedding-3-small"
  embedding_large: "text-embedding-3-large"
  embedding_google: "text-embedding-004"

  # Image generation models
  image_openai: "gpt-image-1.5"
  image_dalle: "dall-e-3"
  image_google: "imagen-3.0-generate-002"

  # Speech generation models
  speech_openai: "gpt-4o-mini-tts"
  speech_google: "gemini-2.5-flash-preview-tts"

  # Local/Other models
  local_llama: "llama-3"

  # Model categories for different use cases
  best_for_code: "gpt-5.4"
  best_for_creative: "claude-opus-4-6"
  best_for_factual: "gemini-3.1-pro-preview"
  best_for_vision: "gpt-5.4"
  best_for_audio: "gpt-4o-audio-preview"
  best_for_tools: "gpt-5.4"
  best_for_budget: "gemini-3-flash-preview"
