<link rel="stylesheet" href="{{ '/assets/css/rubyllm-overrides.css' | relative_url }}">
{% if page.layout == 'home' or page.url == '/' %}
<script defer src="{{ '/assets/js/homepage.js' | relative_url }}"></script>
{% endif %}
{% if page.url == '/' and site.gem_version and site.docs_channel != 'next' %}
{%- assign home_url = '/' | absolute_url -%}
<script type="application/ld+json">{"@context":"https://schema.org","@type":"SoftwareSourceCode","@id":{{ home_url | append: '#software' | jsonify }},"name":{{ site.title | jsonify }},"description":{{ page.description | jsonify }},"url":{{ home_url | jsonify }},"codeRepository":{{ 'https://github.com/' | append: site.repository | jsonify }},"programmingLanguage":{"@type":"ComputerLanguage","name":"Ruby","url":"https://www.ruby-lang.org/"},"runtimePlatform":"Ruby","license":"https://opensource.org/licenses/MIT","version":{{ site.gem_version | jsonify }},"downloadUrl":"https://rubygems.org/gems/ruby_llm","author":{"@type":"Person","name":"Carmine Paolino","url":"https://paolino.me"},"publisher":{"@id":{{ home_url | append: '#identity' | jsonify }}}}</script>
{% endif %}
{% if page.layout == 'models' %}
<meta name="turbo-visit-control" content="reload">
<link rel="stylesheet" href="{{ '/assets/css/model-catalog.css' | relative_url }}">
<script defer src="{{ '/assets/js/model-catalog.js' | relative_url }}"></script>
{% endif %}
{% if page.provider_coverage %}
<link rel="stylesheet" href="{{ '/assets/css/provider-coverage.css' | relative_url }}">
<meta name="turbo-visit-control" content="reload">
<script defer src="{{ '/assets/js/provider-coverage.js' | relative_url }}"></script>
{% endif %}
<link rel="icon" type="image/png" href="{{ '/assets/images/favicon/favicon-96x96.png' | relative_url }}" sizes="96x96">
<link rel="icon" type="image/svg+xml" href="{{ '/assets/images/logo.svg' | relative_url }}">
<link rel="shortcut icon" href="{{ '/assets/images/favicon/favicon.ico' | relative_url }}">
<link rel="apple-touch-icon" sizes="180x180" href="{{ '/assets/images/favicon/apple-touch-icon.png' | relative_url }}">
<meta name="apple-mobile-web-app-title" content="{{ site.title | default: 'RubyLLM' }}">
<link rel="manifest" href="{{ '/assets/images/favicon/site.webmanifest' | relative_url }}">

<!-- Privacy-friendly analytics by Plausible -->
<script async src="https://stats.paolino.me/js/pa-tE3lTn5_7BdIgwydtq7WJ.js"></script>
<script>
  window.plausible = window.plausible || function() { (plausible.q = plausible.q || []).push(arguments) };
  plausible.init = plausible.init || function(options) { plausible.o = options || {} };
  plausible.init();
</script>
