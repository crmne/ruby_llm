# Prices models.dev cannot express yet: per character, per second of audio,
# and per search unit (https://github.com/anomalyco/models.dev/issues/12512).
# `rake models` adds them to lib/ruby_llm/models.json. A model models.dev
# prices keeps its models.dev pricing, and the refresh reports the entry so
# it can be removed, or the price reported upstream.
#
# Each entry is one price from the provider's own pricing page:
#   provider:    RubyLLM provider slug
#   model:       model id, as RubyLLM.models.find finds it
#   unit:        characters, audio_seconds, or search_units
#   per_million: USD per million units
#   quoted:      the price as the page states it
#   source:      the pricing page
#   checked:     the date the price was read from the page
#
# List only list prices the page states plainly, the same on every plan.

- provider: openai
  model: tts-1
  unit: characters
  per_million: 15
  quoted: "$15.00 / 1M characters"
  source: https://developers.openai.com/api/docs/pricing
  checked: 2026-11-03

- provider: openai
  model: tts-1-hd
  unit: characters
  per_million: 30
  quoted: "$30.00 / 1M characters"
  source: https://developers.openai.com/api/docs/pricing
  checked: 2026-11-03

